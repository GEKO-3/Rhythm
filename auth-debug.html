<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Debug - Rhythm Boduberu</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #f5d000;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(43, 43, 43, 0.9);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #444;
        }
        h1 {
            color: #f5d000;
            text-align: center;
            margin-bottom: 30px;
        }
        .debug-section {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border-left: 3px solid #f5d000;
        }
        .debug-section h3 {
            margin-top: 0;
            color: #fced98;
        }
        button {
            background: #f5d000;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #fced98;
        }
        .output {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .success { color: #4caf50; }
        .error { color: #ff6b6b; }
        .warning { color: #ff9800; }
        .info { color: #2196f3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ Authentication Debug Panel</h1>
        
        <div class="debug-section">
            <h3>Quick Actions</h3>
            <button onclick="restoreAdminSession()">🔧 Restore Admin Session (0023)</button>
            <button onclick="clearAllAuth()">🗑️ Clear All Auth Data</button>
            <button onclick="checkCurrentAuth()">🔍 Check Current Auth</button>
            <button onclick="testLogin()">🔐 Test Login System</button>
        </div>

        <div class="debug-section">
            <h3>Current State</h3>
            <div id="currentState" class="output">Click "Check Current Auth" to see current state...</div>
        </div>

        <div class="debug-section">
            <h3>Actions Log</h3>
            <div id="actionLog" class="output">Actions will be logged here...</div>
        </div>

        <div class="debug-section">
            <h3>Manual Access Code Entry</h3>
            <input type="text" id="accessCodeInput" placeholder="Enter access code (e.g., 0023)" maxlength="4" style="background: #1a1a1a; color: #f5d000; border: 1px solid #444; padding: 10px; border-radius: 5px; margin-right: 10px;">
            <button onclick="restoreSpecificUser()">🔄 Restore This User</button>
        </div>
    </div>

    <script type="module">
        import RhythmUnifiedAuth from './js/rhythm-unified-auth.js';

        // Global functions for the buttons
        window.restoreAdminSession = async function() {
            log('🔄 Attempting to restore admin session for code 0023...', 'info');
            
            try {
                const success = await window.rhythmAuth.restoreUserSession('0023');
                if (success) {
                    log('✅ Admin session restored successfully!', 'success');
                    log('📍 You can now navigate to: /pages/songlist.html or /pages/admin/admin.html', 'success');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    log('❌ Failed to restore admin session', 'error');
                }
            } catch (error) {
                log('❌ Error during restoration: ' + error.message, 'error');
            }
        };

        window.restoreSpecificUser = async function() {
            const accessCode = document.getElementById('accessCodeInput').value.trim();
            if (!accessCode) {
                log('❌ Please enter an access code', 'error');
                return;
            }

            log(`🔄 Attempting to restore session for code ${accessCode}...`, 'info');
            
            try {
                const success = await window.rhythmAuth.restoreUserSession(accessCode);
                if (success) {
                    log(`✅ Session restored successfully for code ${accessCode}!`, 'success');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    log(`❌ Failed to restore session for code ${accessCode}`, 'error');
                }
            } catch (error) {
                log('❌ Error during restoration: ' + error.message, 'error');
            }
        };

        window.clearAllAuth = function() {
            log('🗑️ Clearing all authentication data...', 'warning');
            localStorage.removeItem('rhythmAuth_approval');
            localStorage.removeItem('rhythmAuth_pendingRequest');
            localStorage.removeItem('rhythm_device_id');
            localStorage.removeItem('rhythmAuth_deviceId');
            log('✅ All authentication data cleared', 'success');
            checkCurrentAuth();
        };

        window.checkCurrentAuth = async function() {
            log('🔍 Checking current authentication state...', 'info');
            
            const authData = localStorage.getItem('rhythmAuth_approval');
            const pendingData = localStorage.getItem('rhythmAuth_pendingRequest');
            const deviceId = localStorage.getItem('rhythm_device_id');
            
            let state = 'Current Authentication State:\n\n';
            
            if (authData) {
                try {
                    const auth = JSON.parse(authData);
                    state += '✅ AUTHENTICATED\n';
                    state += `Name: ${auth.fullName || 'Unknown'}\n`;
                    state += `Access Code: ${auth.accessCode || 'Unknown'}\n`;
                    state += `Role: ${auth.role || 'user'}\n`;
                    state += `Admin: ${auth.isAdmin ? 'Yes' : 'No'}\n`;
                    state += `Permissions: ${auth.permissions ? auth.permissions.join(', ') : 'None'}\n`;
                    state += `Status: ${auth.status || 'Unknown'}\n`;
                    state += `Device ID: ${auth.deviceId || 'Unknown'}\n`;
                } catch (e) {
                    state += '❌ CORRUPTED AUTH DATA\n';
                }
            } else {
                state += '❌ NOT AUTHENTICATED\n';
            }
            
            if (pendingData) {
                try {
                    const pending = JSON.parse(pendingData);
                    state += '\n⏳ PENDING REQUEST:\n';
                    state += `Name: ${pending.fullName}\n`;
                    state += `Access Code: ${pending.accessCode}\n`;
                    state += `Requested: ${new Date(pending.requestedAt).toLocaleString()}\n`;
                } catch (e) {
                    state += '\n❌ CORRUPTED PENDING DATA\n';
                }
            }
            
            state += `\n🔧 Current Device ID: ${deviceId || 'Not set'}\n`;
            
            if (window.rhythmAuth) {
                const authResult = await window.rhythmAuth.checkAuthentication();
                state += `\n🔍 Unified Auth Check: ${authResult.isAuthenticated ? 'AUTHENTICATED' : 'NOT AUTHENTICATED'}\n`;
                state += `Reason: ${authResult.reason}\n`;
            }
            
            document.getElementById('currentState').textContent = state;
        };

        window.testLogin = function() {
            log('🔐 Redirecting to login page for testing...', 'info');
            window.location.href = '/login.html';
        };

        function log(message, type = 'info') {
            const logElement = document.getElementById('actionLog');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}\n`;
            
            logElement.innerHTML += `<span class="${type}">${logEntry}</span>`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async function() {
            log('🚀 Authentication Debug Panel loaded', 'info');
            
            // Wait for unified auth to initialize
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            
            if (window.rhythmAuth?.isInitialized) {
                log('✅ Unified Auth system initialized', 'success');
                checkCurrentAuth();
            } else {
                log('❌ Failed to initialize unified auth system', 'error');
            }
        });
    </script>
</body>
</html>
