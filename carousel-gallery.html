<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Boduberu - Gallery Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', Arial, sans-serif;
            background-color: #2b2b2b;
        }

        /* Animated loading background - constantly running */
        .loading-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2b2b2b;
            z-index: 1;
            overflow: hidden;
        }

        /* Pattern Container */
        .pattern-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            opacity: 0.25;
            will-change: opacity;
            transform: translateZ(0);
        }

        .pattern-line {
            position: absolute;
            height: 40px;
            width: 300vw;
            background-image: url('src/repeatp.svg');
            background-repeat: repeat-x;
            background-size: auto 40px;
            left: -100vw;
            will-change: transform;
            transform: translateZ(0);
        }

        .pattern-line:nth-child(odd) {
            animation: slideLeft 10s linear infinite;
        }

        .pattern-line:nth-child(even) {
            animation: slideRight 10s linear infinite;
        }

        @keyframes slideLeft {
            0% { transform: translateX(0) translateZ(0); }
            100% { transform: translateX(-100vw) translateZ(0); }
        }

        @keyframes slideRight {
            0% { transform: translateX(-100vw) translateZ(0); }
            100% { transform: translateX(0) translateZ(0); }
        }

        /* Title logo in the center */
        .title-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
        }

        .title-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: spin-and-scale 8s linear infinite;
        }

        @keyframes spin-and-scale {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .title-text {
            color: #f5d000;
            font-size: 2.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(245, 208, 0, 0.5);
            font-family: 'Aldrich', Arial, sans-serif;
        }

        .subtitle-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1em;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .studio-opening-text {
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            font-family: 'Aldrich', Arial, sans-serif;
        }

        /* Infinite carousel */
        .carousel-container {
            position: fixed;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: 5;
            overflow: hidden;
            mask: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
        }

        .carousel-track {
            display: flex;
            align-items: center;
            height: 100%;
            animation: scroll-left 60s linear infinite;
            gap: 30px;
        }

        .carousel-item {
            flex-shrink: 0;
            width: 120px;
            height: 120px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            background: transparent;
        }

        .carousel-item:hover {
            transform: scale(1.1) translateY(-10px);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent;
            border-radius: 15px;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-120px * 23 - 30px * 22)); }
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .title-logo {
                width: 80px;
                height: 80px;
            }

            .title-text {
                font-size: 1.8em;
                letter-spacing: 2px;
            }

            .subtitle-text {
                font-size: 0.9em;
            }

            .studio-opening-text {
                font-size: 1.2em;
                letter-spacing: 1.5px;
            }

            .carousel-container {
                height: 100px;
                bottom: 30px;
            }

            .carousel-item {
                width: 80px;
                height: 80px;
            }

            @keyframes scroll-left {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-80px * 23 - 20px * 22)); }
            }
        }

        /* Font loading */
        @font-face {
            font-family: 'Aldrich';
            src: url('Fonts/Aldrich-Regular.ttf') format('truetype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }

            src: url('Fonts/Montserrat-Regular.ttf') format('truetype');
            font-display: swap;
            font-weight: 400;
            font-style: normal;
        }
    </style>

    <script>
        // Generate animated pattern lines for the background
        function createPatternLines() {
            const container = document.getElementById('pattern-container');
            const numberOfLines = Math.ceil(window.innerHeight / 30); // One line every 30px for closer spacing
            
            for (let i = 0; i < numberOfLines; i++) {
                const line = document.createElement('div');
                line.className = 'pattern-line';
                line.style.top = i * 45 + 'px'; // Space lines 30px apart for tighter look
                container.appendChild(line);
            }
        }

        // Initialize the pattern
        createPatternLines();

        // Recreate pattern lines on window resize
        window.addEventListener('resize', function() {
            const container = document.getElementById('pattern-container');
            container.innerHTML = '';
            createPatternLines();
        });
