<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - Rhythm Boduberu</title>
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
    
    <style>
        :root {
            --primary-color: #f5d000;
            --hover-color: #fced98;
            --text-color: #2b2b2b;
            --bg-color: #1f1f1f;
            --card-bg: rgba(43, 43, 43, 0.9);
            --border-color: #444;
            --error-color: #ff6b6b;
            --success-color: #4caf50;
            --font-family: 'Montserrat', Arial, sans-serif;
            --border-radius: 10px;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('Fonts/Montserrat-Regular.ttf') format('truetype');
            font-display: swap;
            font-weight: normal;
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('Fonts/Montserrat-SemiBold.ttf') format('truetype');
            font-display: swap;
            font-weight: 600;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            padding: 20px;
        }

        .login-container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .logo p {
            color: rgba(245, 208, 0, 0.7);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 500;
        }

        .pin-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .pin-input {
            width: 60px;
            height: 60px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background: #222;
            color: var(--primary-color);
            font-family: var(--font-family);
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(245, 208, 0, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--hover-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 208, 0, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: rgba(245, 208, 0, 0.7);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--primary-color);
        }

        .admin-info {
            background: rgba(245, 208, 0, 0.1);
            border: 1px solid rgba(245, 208, 0, 0.3);
            border-radius: var(--border-radius);
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .admin-info h3 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .admin-info p {
            color: rgba(245, 208, 0, 0.7);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .pin-input {
                width: 50px;
                height: 50px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Admin Access</h1>
            <p>Rhythm Boduberu Administration</p>
        </div>

        <div class="admin-info">
            <h3>Admin Login</h3>
            <p>Enter your 4-digit access code to access the admin panel</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Your 4-digit Access Code</label>
                <div class="pin-inputs">
                    <input type="password" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="password" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="password" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                    <input type="password" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                </div>
            </div>

            <div id="message" class="message"></div>

            <button type="submit" id="submitBtn" class="submit-btn">Access Admin Panel</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to User Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const form = document.getElementById('adminLoginForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        const pinInputs = document.querySelectorAll('.pin-input');

        // Device ID generation for session tracking
        function getDeviceId() {
            let deviceId = localStorage.getItem('rhythmAuth_deviceId');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 10);
                localStorage.setItem('rhythmAuth_deviceId', deviceId);
            }
            return deviceId;
        }

        // PIN input auto-advance functionality
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Only allow digits
                if (!/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                // Move to next input
                if (value && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                // Handle backspace
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text');
                const digits = paste.replace(/\D/g, '').substring(0, 4);
                
                digits.split('').forEach((digit, i) => {
                    if (pinInputs[i]) {
                        pinInputs[i].value = digit;
                    }
                });
                
                // Focus the next empty input or the last one
                const nextEmpty = Array.from(pinInputs).findIndex(input => !input.value);
                if (nextEmpty !== -1) {
                    pinInputs[nextEmpty].focus();
                } else {
                    pinInputs[pinInputs.length - 1].focus();
                }
            });
        });

        // Check for existing admin session on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const existingApproval = localStorage.getItem('rhythmAuth_approval');
            if (existingApproval) {
                try {
                    const approval = JSON.parse(existingApproval);
                    const deviceId = getDeviceId();
                    
                    // Check if user has admin privileges
                    const hasAdminAccess = await verifyAdminAccess(approval.accessCode, deviceId);
                    
                    if (hasAdminAccess) {
                        showMessage('Welcome back! Redirecting to admin panel...', 'success');
                        setTimeout(() => {
                            window.location.href = 'login-admin.html';
                        }, 1500);
                        return;
                    }
                } catch (e) {
                    // Invalid session data
                }
            }
        });

        async function verifyAdminAccess(accessCode, deviceId) {
            try {
                const approvedRef = ref(database, `approvedUsers/${accessCode}`);
                const snapshot = await get(approvedRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    // Check if user is approved, device matches, and has admin role
                    return userData.deviceId === deviceId && 
                           userData.status === 'active' && 
                           (userData.role === 'admin' || userData.permissions?.includes('admin'));
                }
                return false;
            } catch (error) {
                console.error('Error verifying admin access:', error);
                return false;
            }
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const accessCode = Array.from(pinInputs).map(input => input.value).join('');
            
            if (accessCode.length !== 4) {
                showMessage('Please enter your complete 4-digit access code', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';
            
            try {
                const deviceId = getDeviceId();
                const hasAdminAccess = await verifyAdminAccess(accessCode, deviceId);
                
                if (hasAdminAccess) {
                    showMessage('Admin access granted! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login-admin.html';
                    }, 1500);
                } else {
                    // Check if user exists but doesn't have admin privileges
                    const userExists = await checkUserExists(accessCode, deviceId);
                    if (userExists) {
                        showMessage('You don\'t have admin privileges. Contact a developer for admin access.', 'error');
                    } else {
                        showMessage('Invalid access code or you don\'t have an approved account.', 'error');
                    }
                    
                    // Clear inputs
                    pinInputs.forEach(input => input.value = '');
                    pinInputs[0].focus();
                }
            } catch (error) {
                console.error('Admin access check error:', error);
                showMessage('Connection error. Please try again.', 'error');
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = 'Access Admin Panel';
        });

        async function checkUserExists(accessCode, deviceId) {
            try {
                const approvedRef = ref(database, `approvedUsers/${accessCode}`);
                const snapshot = await get(approvedRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    return userData.deviceId === deviceId && userData.status === 'active';
                }
                return false;
            } catch (error) {
                return false;
            }
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            if (type === 'error') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
