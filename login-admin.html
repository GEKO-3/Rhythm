<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Boduberu - Admin</title>
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
    <style>
        :root {
          --primary-color: #f5d000;
          --hover-color: #fced98;
          --active-color: #E6B800;
          --text-color: #2b2b2b;
          --bg-color: #1f1f1f;
          --card-bg: rgba(43, 43, 43, 0.7);
          --border-color: #444;
          --error-color: #ff6b6b;
          --success-color: #4caf50;
          --font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
          --border-radius: 5px;
          --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @font-face {
          font-family: 'Montserrat';
          src: url('assets/Fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
          font-display: swap;
          font-weight: 100 900;
          font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            min-height: 100vh;
            color: var(--primary-color);
            padding: 20px;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            color: rgba(245, 208, 0, 0.7);
        }

        .users-section {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #f5d000;
        }

        .user-grid {
            display: grid;
            gap: 15px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .user-card:hover {
            border-color: rgba(245, 208, 0, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .user-details h3 {
            color: white;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .user-details p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .status-revoked {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-approve {
            background: #4caf50;
            color: white;
        }

        .btn-approve:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .btn-reject {
            background: #f44336;
            color: white;
        }

        .btn-reject:hover {
            background: #da190b;
            transform: translateY(-1px);
        }

        .btn-revoke {
            background: #ff9800;
            color: white;
        }

        .btn-revoke:hover {
            background: #e68900;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px;
        }

        .no-users {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 40px;
        }

        .timestamp {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .access-note {
            background: rgba(245, 208, 0, 0.1);
            border: 1px solid rgba(245, 208, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .access-note h3 {
            color: #f5d000;
            margin-bottom: 5px;
        }

        .access-note p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <p>Manage user access for Songs & Lyrics (NO CSV FEATURES)</p>
        </div>

        <div class="access-note">
            <h3>🎵 Normal Access Permissions</h3>
            <p>Approved users get access to: Song List, Lyrics Viewing & Editing, Music Player</p>
        </div>

        <div class="users-section">
            <h2 class="section-title">User Access Requests</h2>
            <div id="usersList">
                <div class="loading">Loading users...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, get, onValue, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const usersListDiv = document.getElementById('usersList');

        // Global admin info
        let currentAdmin = null;

        // Check admin authentication on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const userApproval = localStorage.getItem('rhythmAuth_approval');
            
            if (!userApproval) {
                // No user session, redirect to regular login
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const approval = JSON.parse(userApproval);
                const deviceId = getDeviceId();
                const hasAdminAccess = await verifyAdminAccess(approval.accessCode, deviceId);
                
                if (!hasAdminAccess) {
                    // User doesn't have admin access
                    alert('You don\'t have admin privileges. Contact a developer for admin access.');
                    window.location.href = 'pages/songlist.html';
                    return;
                }
                
                // Valid admin access
                currentAdmin = approval;
                
                // Add admin info to header
                const header = document.querySelector('.header');
                const adminInfo = document.createElement('div');
                adminInfo.style.cssText = 'margin-top: 10px; padding: 10px; background: rgba(245, 208, 0, 0.1); border-radius: 5px; border: 1px solid rgba(245, 208, 0, 0.3);';
                adminInfo.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="color: #f5d000; font-weight: 600;">Admin: ${approval.fullName} (${approval.accessCode})</span>
                        <button onclick="logoutAdmin()" style="background: rgba(255, 255, 255, 0.1); color: #f5d000; border: 1px solid rgba(245, 208, 0, 0.3); border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 0.8rem;">Back to Songs</button>
                    </div>
                `;
                header.appendChild(adminInfo);
                
                // Load users after authentication
                loadUsers();
                
                // Set up real-time listeners
                setupRealtimeListeners();
                
            } catch (error) {
                console.error('Error verifying admin access:', error);
                alert('Session error. Please log in again.');
                window.location.href = 'login.html';
                return;
            }
        });

        function getDeviceId() {
            let deviceId = localStorage.getItem('rhythmAuth_deviceId');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 10);
                localStorage.setItem('rhythmAuth_deviceId', deviceId);
            }
            return deviceId;
        }

        // Logout function - just go back to songlist (they're still a regular user)
        window.logoutAdmin = function() {
            window.location.href = 'pages/songlist.html';
        };

        async function verifyAdminAccess(accessCode, deviceId) {
            try {
                const approvedRef = ref(database, `approvedUsers/${accessCode}`);
                const snapshot = await get(approvedRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    return userData.deviceId === deviceId && 
                           userData.status === 'active' && 
                           (userData.role === 'admin' || userData.permissions?.includes('admin'));
                }
                return false;
            } catch (error) {
                console.error('Error verifying admin access:', error);
                return false;
            }
        }

        // Load and display users from all sources
        async function loadUsers() {
            try {
                const [pendingSnapshot, approvedSnapshot, rejectedSnapshot] = await Promise.all([
                    get(ref(database, 'loginRequests')),
                    get(ref(database, 'approvedUsers')),
                    get(ref(database, 'rejectedLogins'))
                ]);

                displayUsers(pendingSnapshot, approvedSnapshot, rejectedSnapshot);
            } catch (error) {
                console.error('Error loading users:', error);
                usersListDiv.innerHTML = '<div class="no-users">Error loading users</div>';
            }
        }

        function displayUsers(pendingSnapshot, approvedSnapshot, rejectedSnapshot) {
            const allUsers = [];

            // Add pending requests
            if (pendingSnapshot.exists()) {
                const pending = pendingSnapshot.val();
                Object.entries(pending).forEach(([key, user]) => {
                    allUsers.push({ key, ...user, status: 'pending' });
                });
            }

            // Add approved users
            if (approvedSnapshot.exists()) {
                const approved = approvedSnapshot.val();
                Object.entries(approved).forEach(([key, user]) => {
                    // Check if user is revoked
                    const status = user.status === 'revoked' ? 'revoked' : 'approved';
                    allUsers.push({ key, ...user, status });
                });
            }

            // Add rejected users
            if (rejectedSnapshot.exists()) {
                const rejected = rejectedSnapshot.val();
                Object.entries(rejected).forEach(([key, user]) => {
                    const status = user.reason === 'Access revoked' ? 'revoked' : 'rejected';
                    allUsers.push({ key, ...user, status });
                });
            }

            if (allUsers.length === 0) {
                usersListDiv.innerHTML = '<div class="no-users">No users found</div>';
                return;
            }

            // Sort: pending first, then approved, then others by date
            allUsers.sort((a, b) => {
                if (a.status === 'pending' && b.status !== 'pending') return -1;
                if (b.status === 'pending' && a.status !== 'pending') return 1;
                if (a.status === 'approved' && b.status !== 'approved' && b.status !== 'pending') return -1;
                if (b.status === 'approved' && a.status !== 'approved' && a.status !== 'pending') return 1;
                return new Date(b.requestedAt || b.approvedAt || 0) - new Date(a.requestedAt || a.approvedAt || 0);
            });

            usersListDiv.innerHTML = allUsers.map(user => `
                <div class="user-card">
                    <div class="user-info">
                        <div class="user-details">
                            <h3>${user.fullName || user.name || 'Unknown User'}</h3>
                            <p>Access Code: ${user.accessCode || user.phone || 'N/A'}</p>
                            <p>Device ID: ${user.deviceId ? user.deviceId.substring(0, 20) + '...' : 'N/A'}</p>
                            ${user.deviceInfo ? `<p>Device: ${user.deviceInfo.substring(0, 50)}...</p>` : ''}
                            <div class="timestamp">
                                Requested: ${new Date(user.requestedAt || Date.now()).toLocaleString()}
                                ${user.approvedAt ? `<br>Approved: ${new Date(user.approvedAt).toLocaleString()}` : ''}
                            </div>
                        </div>
                        <div class="status-badge status-${user.status}">
                            ${user.status}
                        </div>
                    </div>
                    <div class="user-actions">
                        ${getActionButtons(user)}
                    </div>
                </div>
            `).join('');
        }

        function getActionButtons(user) {
            if (user.status === 'approved') {
                return `<button class="btn btn-revoke" onclick="revokeAccess('${user.key}')">Revoke Access</button>`;
            } else if (user.status === 'rejected' || user.status === 'revoked') {
                return `<button class="btn btn-approve" onclick="approveUser('${user.key}')">Re-approve</button>`;
            } else {
                return `
                    <button class="btn btn-approve" onclick="approveUser('${user.key}')">Approve</button>
                    <button class="btn btn-reject" onclick="rejectUser('${user.key}')">Reject</button>
                `;
            }
        }

        window.approveUser = async function(userKey) {
            try {
                if (!currentAdmin) {
                    alert('Admin session error. Please re-login.');
                    window.location.href = 'login.html';
                    return;
                }
                
                // Get user data from pending requests
                const requestRef = ref(database, `loginRequests/${userKey}`);
                const snapshot = await get(requestRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    
                    // Add to approved users (using accessCode as the key)
                    const approvedRef = ref(database, `approvedUsers/${userData.accessCode}`);
                    await set(approvedRef, {
                        accessCode: userData.accessCode,
                        fullName: userData.fullName,
                        deviceId: userData.deviceId,
                        approvedAt: Date.now(),
                        approvedBy: currentAdmin.fullName || `User ${currentAdmin.accessCode}`,
                        approvedByAccessCode: currentAdmin.accessCode,
                        permissions: ['songlist', 'lyrics'],
                        role: 'user',
                        status: 'active',
                        deviceInfo: userData.deviceInfo
                    });

                    // Remove from pending requests
                    await remove(requestRef);
                    
                    // Also remove from rejected if exists
                    const rejectedRef = ref(database, `rejectedLogins/${userKey}`);
                    await remove(rejectedRef);

                    alert(`✅ User "${userData.fullName}" approved for Songs & Lyrics access!\n👤 Approved by: ${currentAdmin.fullName || `User ${currentAdmin.accessCode}`}`);
                    loadUsers();
                }
            } catch (error) {
                console.error('Error approving user:', error);
                alert('Failed to approve user');
            }
        };

        window.rejectUser = async function(userKey) {
            try {
                const requestRef = ref(database, `loginRequests/${userKey}`);
                const snapshot = await get(requestRef);
                
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    
                    // Add to rejected
                    const rejectedRef = ref(database, `rejectedLogins/${userKey}`);
                    await set(rejectedRef, {
                        ...userData,
                        rejectedAt: Date.now(),
                        rejectedBy: 'admin'
                    });

                    // Remove from pending
                    await remove(requestRef);

                    alert(`❌ User "${userData.fullName || userData.name}" access denied.`);
                    loadUsers();
                }
            } catch (error) {
                console.error('Error rejecting user:', error);
                alert('Failed to reject user');
            }
        };

        window.revokeAccess = async function(userKey) {
            if (!confirm('Are you sure you want to revoke access for this user? They will be immediately logged out.')) {
                return;
            }

            try {
                if (!currentAdmin) {
                    alert('Admin session error. Please re-login.');
                    window.location.href = 'login-admin-auth.html';
                    return;
                }
                
                // For approved users, the userKey is the accessCode, but we need to find the actual approval record
                let approvedRef, userData, actualKey;
                
                if (userKey.includes('_')) {
                    // This is from the rejected/pending list - extract accessCode
                    const accessCode = userKey.split('_')[0];
                    approvedRef = ref(database, `approvedUsers/${accessCode}`);
                    actualKey = accessCode;
                } else {
                    // This is already an accessCode from approved users
                    approvedRef = ref(database, `approvedUsers/${userKey}`);
                    actualKey = userKey;
                }
                
                const snapshot = await get(approvedRef);
                
                if (snapshot.exists()) {
                    userData = snapshot.val();
                    
                    // Move to rejected with device-specific key
                    const rejectedRef = ref(database, `rejectedLogins/${userData.accessCode}_${userData.deviceId}`);
                    await set(rejectedRef, {
                        ...userData,
                        rejectedAt: Date.now(),
                        rejectedBy: currentAdmin.fullName || `User ${currentAdmin.accessCode}`,
                        rejectedByAccessCode: currentAdmin.accessCode,
                        reason: 'Access revoked',
                        status: 'revoked'
                    });

                    // Update the approved user status to revoked (this triggers logout)
                    await set(approvedRef, {
                        ...userData,
                        status: 'revoked',
                        revokedAt: Date.now(),
                        revokedBy: currentAdmin.fullName || `User ${currentAdmin.accessCode}`,
                        revokedByAccessCode: currentAdmin.accessCode
                    });

                    alert(`🚫 Access revoked for "${userData.fullName}". They will be logged out on next activity.\n👤 Revoked by: ${currentAdmin.fullName || `User ${currentAdmin.accessCode}`}`);
                    loadUsers();
                } else {
                    alert('User not found in approved list');
                }
            } catch (error) {
                console.error('Error revoking access:', error);
                alert('Failed to revoke access');
            }
        };

        // Set up real-time listeners (only after authentication)
        function setupRealtimeListeners() {
            onValue(ref(database, 'loginRequests'), loadUsers);
            onValue(ref(database, 'approvedUsers'), loadUsers);  
            onValue(ref(database, 'rejectedLogins'), loadUsers);
        }
    </script>
</body>
</html>
