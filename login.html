<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Boduberu - Login</title>
    <meta name="description" content="Access Rhythm Boduberu song collection and admin panel. Traditional Maldivian Boduberu music group.">
    <meta name="keywords" content="Rhythm Boduberu, Traditional Maldivian Music, Boduberu, Songs, Admin">
    
    <!-- SEO and social sharing -->
    <meta property="og:title" content="Rhythm Boduberu - Login">
    <meta property="og:description" content="Access Rhythm Boduberu song collection and admin panel">
    <meta property="og:image" content="https://rhythmboduberu.com/assets/favicons/icons-512.png">
    <meta property="og:url" content="https://rhythmboduberu.com/login.html">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://rhythmboduberu.com/login.html">
    
    <!-- Favicon and web app manifest -->
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg">
    <link rel="icon" type="image/x-icon" href="assets/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicons/icons-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicons/icons-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicons/manifest.webmanifest">
    
    <!-- PWA meta tags -->
    <meta name="theme-color" content="#f5d000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rhythm Boduberu">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Rhythm Boduberu">
    
    <style>
        :root {
          --primary-color: #f5d000;
          --hover-color: #fced98;
          --active-color: #E6B800;
          --text-color: #2b2b2b;
          --bg-color: #1f1f1f;
          --card-bg: rgba(43, 43, 43, 0.7);
          --border-color: #444;
          --error-color: #ff6b6b;
          --success-color: #4caf50;
          --font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
          --border-radius: 5px;
          --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @font-face {
          font-family: 'Montserrat';
          src: url('assets/Fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
          font-display: swap;
          font-weight: 100 900;
          font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
        }

        .login-container {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-width: 400px;
            width: 90%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .logo p {
            color: rgba(245, 208, 0, 0.7);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background: #222;
            color: var(--primary-color);
            font-size: 1rem;
            font-family: var(--font-family);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(245, 208, 0, 0.2);
        }

        .pin-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
        }

        .pin-input {
            width: 50px !important;
            height: 50px;
            text-align: center;
            font-size: 1.5rem !important;
            font-weight: 600;
            padding: 0 !important;
            border: 2px solid var(--border-color) !important;
            border-radius: 8px !important;
            background: #222 !important;
            color: var(--primary-color) !important;
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 2px rgba(245, 208, 0, 0.2) !important;
            transform: scale(1.05);
        }

        .pin-input:valid {
            border-color: var(--primary-color);
            background: rgba(245, 208, 0, 0.1) !important;
        }

        input::placeholder {
            color: #999;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: var(--text-color);
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: 600;
            font-family: var(--font-family);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background: var(--hover-color);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(245, 208, 0, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: var(--border-radius);
            text-align: center;
            font-weight: 500;
            font-family: var(--font-family);
        }

        .message.success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: var(--success-color);
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: var(--error-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Rhythm Boduberu</h1>
            <p>Request Access to Songs & Lyrics</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Rhythm Index Number</label>
                <div class="pin-container">
                    <input type="tel" class="pin-input" id="pin1" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="tel" class="pin-input" id="pin2" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="tel" class="pin-input" id="pin3" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="tel" class="pin-input" id="pin4" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Request Access
            </button>
        </form>

        <div id="message" class="message" style="display: none;"></div>
        
        <!-- Clear saved data option -->
        <div style="text-align: center; margin-top: 15px;">
            <button type="button" id="clearDataBtn" style="background: none; border: none; color: rgba(245, 208, 0, 0.6); font-size: 0.8rem; cursor: pointer; text-decoration: underline; font-family: var(--font-family); display: none;">
                Clear saved login data
            </button>
        </div>
    </div>

    <script type="module">
        import RhythmUnifiedAuth from './js/rhythm-unified-auth.js';

        // Disable PWA installation prompts
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            return false;
        });

        // Wait for unified auth to initialize
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Login page loaded, initializing unified auth...');
            
            // Wait for auth system to initialize
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            
            if (!window.rhythmAuth?.isInitialized) {
                console.error('Unified auth failed to initialize');
                showMessage('System initialization failed. Please refresh the page.', 'error');
                return;
            }
            
            // Check if user is already authenticated
            const authResult = await window.rhythmAuth.checkAuthentication();
            if (authResult.isAuthenticated) {
                console.log('User already authenticated, redirecting...');
                showMessage('Already logged in! Redirecting...', 'success');
                setTimeout(() => {
                    window.rhythmAuth.redirectAfterLogin();
                }, 1000);
                return;
            }
            
            // Check for pending request
            await checkPendingRequest();
            
            // Auto-fill saved login data
            loadSavedLoginData();
        });

        // Function to load saved login data
        function loadSavedLoginData() {
            try {
                const savedData = localStorage.getItem('rhythmLoginData');
                if (savedData) {
                    const loginData = JSON.parse(savedData);
                    
                    // Fill name field
                    if (loginData.name) {
                        document.getElementById('name').value = loginData.name;
                    }
                    
                    // Fill PIN fields
                    if (loginData.pin && loginData.pin.length === 4) {
                        const pinInputs = document.querySelectorAll('.pin-input');
                        for (let i = 0; i < 4; i++) {
                            if (pinInputs[i] && loginData.pin[i]) {
                                pinInputs[i].value = loginData.pin[i];
                            }
                        }
                    }
                    
                    console.log('Auto-filled login data from storage');
                }
            } catch (error) {
                console.error('Error loading saved login data:', error);
            }
        }

        // Function to save login data
        function saveLoginData(name, pin) {
            try {
                const loginData = {
                    name: name,
                    pin: pin,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem('rhythmLoginData', JSON.stringify(loginData));
                console.log('Login data saved to storage');
            } catch (error) {
                console.error('Error saving login data:', error);
            }
        }

        // PIN input auto-advance functionality
        const pinInputs = document.querySelectorAll('.pin-input');
        
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Only allow digits
                if (!/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                // Auto-advance to next input
                if (value && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('keydown', (e) => {
                // Handle backspace to go to previous input
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
                
                // Handle arrow keys
                if (e.key === 'ArrowLeft' && index > 0) {
                    pinInputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });
            
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text');
                const digits = paste.replace(/\D/g, '').substring(0, 4);
                
                digits.split('').forEach((digit, i) => {
                    if (pinInputs[i]) {
                        pinInputs[i].value = digit;
                    }
                });
                
                // Focus the next empty input or the last one
                const nextEmpty = Array.from(pinInputs).findIndex(input => !input.value);
                if (nextEmpty !== -1) {
                    pinInputs[nextEmpty].focus();
                } else {
                    pinInputs[pinInputs.length - 1].focus();
                }
            });
        });

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('name').value.trim();
            const accessCode = Array.from(pinInputs).map(input => input.value).join('');
            
            if (!fullName) {
                showMessage('Please enter your full name.', 'error');
                return;
            }
            
            if (accessCode.length !== 4 || !/^\d{4}$/.test(accessCode)) {
                showMessage('Please enter a valid 4-digit access code.', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            try {
                const result = await window.rhythmAuth.submitLoginRequest(accessCode, fullName);
                
                if (result.success) {
                    // Save login data for auto-fill on next visit
                    saveLoginData(fullName, accessCode);
                    
                    if (result.action === 'auto_login') {
                        showMessage('Access approved! Redirecting...', 'success');
                        setTimeout(() => {
                            window.rhythmAuth.redirectAfterLogin();
                        }, 1000);
                    } else if (result.action === 'request_submitted') {
                        showMessage('Request submitted successfully! Please wait for admin approval.', 'success');
                        disableForm();
                    }
                } else {
                    if (result.action === 'request_pending') {
                        showMessage('You already have a pending request. Please wait for approval.', 'info');
                        disableForm();
                    } else if (result.action === 'device_mismatch') {
                        showMessage('❌ Device Mismatch: This account is registered to a different device. Each user can only access from one device. Please contact admin if you need to change devices.', 'error');
                    } else if (result.action === 'access_revoked') {
                        showMessage('Your access has been revoked. Please contact an administrator.', 'error');
                    } else {
                        showMessage(result.message || 'Request failed. Please try again.', 'error');
                    }
                }
            } catch (error) {
                console.error('Error submitting request:', error);
                showMessage('Error submitting request. Please try again.', 'error');
            } finally {
                if (submitBtn.textContent === 'Submitting...') {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            }
        });

        // Check pending request status
        async function checkPendingRequest() {
            const pendingRequest = localStorage.getItem('rhythmAuth_pendingRequest');
            if (pendingRequest) {
                try {
                    const requestData = JSON.parse(pendingRequest);
                    const status = await window.rhythmAuth.checkRequestStatus(requestData.accessCode, requestData.deviceId);
                    
                    if (status === 'approved') {
                        // Trigger authentication check which will handle login
                        const authResult = await window.rhythmAuth.checkAuthentication();
                        if (authResult.isAuthenticated) {
                            localStorage.removeItem('rhythmAuth_pendingRequest');
                            console.log('✅ Request approved! Redirecting...');
                            showMessage('Your request was approved! Redirecting...', 'success');
                            setTimeout(() => {
                                window.rhythmAuth.redirectAfterLogin();
                            }, 1000);
                            return;
                        }
                    } else if (status === 'rejected') {
                        localStorage.removeItem('rhythmAuth_pendingRequest');
                        showMessage('Your access request has been rejected.', 'error');
                    } else if (status === 'pending') {
                        showMessage('Your request is still pending approval. Please wait for admin review.', 'info');
                        disableForm();
                    } else if (status === 'revoked') {
                        localStorage.removeItem('rhythmAuth_pendingRequest');
                        showMessage('Your access has been revoked.', 'error');
                    } else if (status === 'none') {
                        localStorage.removeItem('rhythmAuth_pendingRequest');
                        showMessage('Your request was not found. Please submit a new request.', 'warning');
                    }
                } catch (e) {
                    console.log('Error checking request status:', e);
                    localStorage.removeItem('rhythmAuth_pendingRequest');
                }
            }
        }

        function disableForm() {
            const nameInput = document.getElementById('name');
            const submitBtn = document.getElementById('submitBtn');
            
            nameInput.disabled = true;
            pinInputs.forEach(input => input.disabled = true);
            submitBtn.disabled = true;
            submitBtn.textContent = 'Request Pending...';
        }

        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Auto-hide after 10 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 10000);
        }
    </script>
    </script>

    <!-- Global navigation functions for admin choice buttons -->
    <script>
        // Navigation functions (global scope for onclick handlers)
        function goToSonglist() {
            window.location.href = 'pages/songlist.html';
        }

        function goToAdmin() {
            window.location.href = 'pages/admin/admin.html';
        }
    </script>
</body>
</html>
