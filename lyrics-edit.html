<!DOCTYPE html>
<html lang="dv">
<head>
  <meta charset="UTF-8">
  <title>Lyrics Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="192x192" href="favicons/icons-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicons/icons-512.png">
<link rel="manifest" href="favicons/manifest.webmanifest">
  <!-- Load Firebase Database Service -->
  <script type="module" src="firebase-db.js"></script>
  <style>
    /* Local font definitions */
    @font-face {
      font-family: 'Faruma';
      src: url('Fonts/Faruma.ttf') format('truetype');
      font-display: swap;
      font-weight: normal;
      font-style: normal;
    }
    
    @font-face {
      font-family: 'Montserrat';
      src: url('Fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
      font-weight: normal;
      font-style: normal;
    }
    
    html, body {
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
    }
    input, textarea, select, button {
      touch-action: manipulation;
    }
    :root {
      --primary-color: #f5d000;
      --hover-color: #fced98;
      --active-color: #E6B800;
      --text-color: #2b2b2b;
      --bg-opacity: rgba(31, 31, 31, 0.0);
      --hover-color2: #3a3a3a;
      --active-color2: #111111
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes slideIn {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    body {
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1f1f1f;
      background-size: cover;
      color: var(--primary-color);
      animation: fadeIn 0.5s ease-in-out;
    }
    .container {
      text-align: center;
      position: relative;
      max-width: 600px;
      width: 100%; 
      padding: 20px;
      background: var(--bg-opacity);
      border-radius: 10px;
      transition: transform 0.3s ease;
      animation: slideIn 0.5s ease-in-out;
      margin-top: 40px;
      margin-bottom: 40px;
    }
    button {
      background-color: var(--primary-color);
      color: var(--text-color);
      border: none;
      border-radius: 5px;
      padding: 10px 18px;
      font-size: 1em;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background-color 0.3s, transform 0.2s;
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
    }
    button:hover {
      background-color: var(--hover-color);
      font-weight: bold;
    }
    button:active {
      background-color: var(--active-color);
      transform: scale(0.97);
    }
    .section {
      background: rgba(43,43,43,0.7);
      border: 1px solid #313131;
      box-shadow: 0 1px 4px #0001;
      padding: 16px 14px 14px 14px;
      margin-bottom: 28px;
      border-radius: 8px;
      position: relative;
      text-align: right;
      direction: rtl;
    }
    .section-title {
      font-weight: 700;
      font-size: 1.1em;
      padding: 4px 0 8px 0;
      border: none;
      background: none;
      width: 100%;
      color: #ffffff;
      margin-bottom: 10px;
      border-bottom: 1px solid #494949;
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s;
      background: transparent;
      direction: ltr;
      font-family: 'Montserrat', Arial, sans-serif;
      text-align: left;
    }
    .section-title:focus {
      border-color: #E6B800;
      background: #111111;
    }
    .line {
      display: flex;
      align-items: stretch;
      margin-bottom: 10px;
      direction: rtl;
      flex-direction: row-reverse;
      gap: 6px;
    }
    .line input[type="text"] {
      flex: 1;
      max-width: 500px;
      width: 100%;
      padding: 7px 12px 7px 5px;
      border-radius: 5px;
      border: 1px solid #535353;
      background: #1b1b1b;
      font-family: 'Faruma', 'MV Elaaf Normal', 'Faruma Regular', 'Faruma Medium', 'Noto Sans Thaana', 'Thaana Unicode', Arial, sans-serif;
      direction: rtl;
      font-size: 1.1em;
      color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      height: 38px;
      box-sizing: border-box;
    }
    .line input[type="checkbox"] {
      height: 90%;
      width: 18px;
      accent-color: #f5d000;
      margin-left: 2px;
      align-self: center;
      display: flex;
    }
    .star-line-btn {
      width: 26px;
      height: 26px;
      background: #222;
      color: #f5d000;
      border: none;
      border-radius: 5px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 6px;
      transition: background 0.2s, color 0.2s;
      box-shadow: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .star-line-btn:hover {
      background: inherit !important;
      color: inherit !important;
    }
    .star-line-btn.active {
      background: #f5d000 !important;
      color: #2b2b2b !important;
      font-weight: bold;
    }
    .controls {
      margin-top: 32px;
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    .remove-section-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      background: #ff7920;
      color: #2b2b2b;
      border: none;
      border-radius: 6px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.2s, color 0.2s;
      z-index: 2;
      box-shadow: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .remove-section-btn:hover {
      background: #ff4f4f;
      color: #fff;
    }
    .remove-line-btn {
      height: 100%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: #ff7920;
      color: #2b2b2b;
      border: none;
      border-radius: 5px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 6px;
      transition: background 0.2s, color 0.2s;
      box-shadow: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .remove-line-btn:hover {
      background: #ff4f4f;
      color: #fff;
    }
    .add-line-btn {
      width: 28px;
      height: 28px;
      background: #f5d000;
      color: #2b2b2b;
      border: none;
      border-radius: 6px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.2s, color 0.2s;
      z-index: 2;
      box-shadow: none;
      font-family: 'Montserrat', Arial, sans-serif;
    }
    .add-line-btn:hover {
      background: #fced98;
      color: #2b2b2b;
    }
    .break-line {
      width: 100%;
      height: 6px;
      background: var(--primary-color);
      border-radius: 8px;
      margin: 24px 0 24px 0;
      display: flex;
      align-items: center;
      position: relative;
      opacity: 0.85;
    }
    .remove-break-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      background: #ff7920;
      color: #2b2b2b;
      border: none;
      border-radius: 50%;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
      box-shadow: none;
      transition: background 0.2s, color 0.2s;
    }
    .remove-break-btn:hover {
      background: #1976d2;
      color: #fff;
    }
    
    /* Mobile-friendly song suggestions */
    .song-suggestion-item {
      padding: 12px 15px;
      cursor: pointer;
      border-bottom: 1px solid #333;
      color: #f5d000;
      font-family: 'Montserrat', Arial, sans-serif;
      text-decoration: none;
      display: block;
      transition: background-color 0.2s;
      -webkit-tap-highlight-color: rgba(245, 208, 0, 0.1);
    }
    .song-suggestion-item:hover,
    .song-suggestion-item:focus {
      background-color: rgba(245, 208, 0, 0.1);
    }
    .song-suggestion-item:last-child {
      border-bottom: none;
    }
    
    @media (max-width: 600px) {
      html, body {
        font-size: 18px;
      }
      .container {
        padding: 12px 2vw 18px 2vw;
        max-width: 98vw;
        min-width: 0;
      }
      h2 {
        font-size: 1.3em;
      }
      .section-title {
        font-size: 1em;
        padding: 6px 0 10px 0;
      }
      .line input[type="text"] {
        font-size: 1em;
        padding: 8px 8px 8px 4px;
        min-width: 0;
        max-width: 100%;
      }
      .controls {
        flex-direction: column;
        gap: 10px;
      }
      button, .remove-section-btn, .remove-line-btn {
        font-size: 1em;
        padding: 10px 0;
        min-width: 0;
      }
    }
  </style>
  <script>
    // Prevent zoom with keyboard (Ctrl/Cmd + +/-/0) and mouse wheel
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (
        e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0'
      )) {
        e.preventDefault();
      }
    });
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });
    // Prevent double-tap zoom on mobile
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 350) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
    // Prevent pinch-zoom and gesture events on iOS/Safari
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="song-name-container" style="position:relative;width:100%;max-width:600px;margin-bottom:18px;">
      <input id="song-name-input" type="text" placeholder="Song Name" autocomplete="off" style="width:100%;font-size:1.2em;padding:10px 12px;border-radius:7px;border:1px solid #aaa;outline:none;box-sizing:border-box;display:block;font-family:'Montserrat',Arial,sans-serif;background:#1b1b1b;color:#FFFFFF;font-weight:bold;" />
      <div id="song-suggestions-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:rgba(43,43,43,0.98);border:1px solid #444;border-radius:5px;z-index:1000;box-shadow:0px 8px 16px 0px rgba(0,0,0,0.2);margin-top:2px;max-height:200px;overflow-y:auto;"></div>
    </div>
    <datalist id="song-names-list"></datalist>
    
    <div class="genre-container" style="width:100%;max-width:600px;margin-bottom:18px;position:relative;">
      <button id="genre-btn" type="button" style="width:100%;font-size:1.2em;padding:10px 12px;border-radius:5px;border:1px solid #444;outline:none;box-sizing:border-box;display:block;font-family:'Montserrat',Arial,sans-serif;background:#222;color:#f5d000;font-weight:bold;text-align:left;cursor:pointer;transition:border-color 0.2s;">
        Select Genre ▼
      </button>
      <div id="genre-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:rgba(43,43,43,0.98);border:1px solid #444;border-radius:5px;z-index:10;box-shadow:0px 8px 16px 0px rgba(0,0,0,0.2);margin-top:2px;">
        <div class="genre-option" data-genre="Baburu" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #333;color:#f5d000;font-family:'Montserrat',Arial,sans-serif;text-decoration:none;display:block;">Baburu</div>
        <div class="genre-option" data-genre="Kaasi" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #333;color:#f5d000;font-family:'Montserrat',Arial,sans-serif;text-decoration:none;display:block;">Kaasi</div>
        <div class="genre-option" data-genre="Nala" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #333;color:#f5d000;font-family:'Montserrat',Arial,sans-serif;text-decoration:none;display:block;">Nala</div>
        <div class="genre-option" data-genre="Taki" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #333;color:#f5d000;font-family:'Montserrat',Arial,sans-serif;text-decoration:none;display:block;">Taki</div>
        <div class="genre-option" data-genre="Thinberu" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #333;color:#f5d000;font-family:'Montserrat',Arial,sans-serif;text-decoration:none;display:block;">Thinberu</div>
        <div class="genre-option" data-genre="Zamaanee" style="padding:8px 12px;cursor:pointer;border-bottom:none;color:#f5d000;font-family:'Montserrat',Arial,sans-serif;text-decoration:none;display:block;">Zamaanee</div>
      </div>
    </div>
    <div id="sections"></div>
    <div class="controls">
      <button onclick="addSection()">Add Section</button>
      <button onclick="addBreak()">Add Break</button>
      <button onclick="copyToClipboard()">Copy to Clipboard</button>
      <button onclick="resetTool()">Reset</button>
    </div>
    
    <!-- Firebase Submission Controls -->
    <div class="controls">
      <button id="submitBtn" onclick="saveSongToDatabase()">Save Song</button>
      <div id="saveStatus" style="margin-top: 10px; font-weight: bold;"></div>
    </div>
  </div>
  <script>
    let sectionCount = 0;
    function transliterateToThaana(text) {
      const map = {
        'A': 'ާ', 'B': 'ޞ', 'C': 'ޝ', 'D': 'ޑ', 'E': 'ޭ', 'F': 'ﷲ', 'G': 'ޣ', 'H': 'ޙ', 'I': 'ީ', 'J': 'ޛ', 'K': 'ޚ', 'L': 'ޅ', 'M': 'ޟ', 'N': 'ޏ', 'O': 'ޯ', 'P': '÷', 'Q': 'ޤ', 'R': 'ޜ', 'S': 'ށ', 'T': 'ޓ', 'U': 'ޫ', 'V': 'ޥ', 'W': 'ޢ', 'X': 'ޘ', 'Y': 'ޠ', 'Z': 'ޡ',
        'a': 'ަ', 'b': 'ބ', 'c': 'ޗ', 'd': 'ދ', 'e': 'ެ', 'f': 'ފ', 'g': 'ގ', 'h': 'ހ', 'i': 'ި', 'j': 'ޖ', 'k': 'ކ', 'l': 'ލ', 'm': 'މ', 'n': 'ނ', 'o': 'ޮ', 'p': 'ޕ', 'q': 'ް', 'r': 'ރ', 's': 'ސ', 't': 'ތ', 'u': 'ު', 'v': 'ވ', 'w': 'އ', 'x': '×', 'y': 'ޔ', 'z': 'ޒ'
      };
      let thaana = text.split('').map(ch => map[ch] || ch).join('');
      // Remove forbidden Thaana characters if directly after any forbidden
      const forbidden = ['ާ','ަ','ް','ޭ','ެ','ޯ','ޮ','ީ','ި','ޫ','ު'];
      let result = '';
      for (let i = 0; i < thaana.length; i++) {
        if (
          i > 0 &&
          forbidden.includes(thaana[i]) &&
          forbidden.includes(thaana[i - 1])
        ) {
          continue; // skip if previous is forbidden
        }
        result += thaana[i];
      }
      return result;
    }
    function setupThaanaTransliteration(input) {
      input.addEventListener('input', function(e) {
        const caret = input.selectionStart;
        const original = input.value;
        const thaana = transliterateToThaana(original);
        if (original !== thaana) {
          input.value = thaana;
          input.setSelectionRange(caret, caret);
        }
      });
    }
    function saveState() {
      const data = [];
      const container = document.getElementById('sections');
      const children = Array.from(container.children);
      children.forEach(child => {
        if (child.classList.contains('section')) {
          const sectionTitle = child.querySelector('.section-title').value;
          const lines = [];
          child.querySelectorAll('.line').forEach(line => {
            lines.push({
              text: line.querySelector('input[type="text"]').value,
              starred: line.querySelector('.star-line-btn').classList.contains('active')
            });
          });
          data.push({ type: 'section', title: sectionTitle, lines });
        } else if (child.classList.contains('break-line')) {
          data.push({ type: 'break' });
        }
      });
      localStorage.setItem('lyricsEditorData', JSON.stringify(data));
    }
    function setLineHighlight(lineDiv) {
      const input = lineDiv.querySelector('input[type="text"]');
      const starBtn = lineDiv.querySelector('.star-line-btn');
      if (starBtn.classList.contains('active')) {
        input.style.color = '#f5d000';
      } else {
        input.style.color = '#ffffff';
      }
    }
    function loadState() {
      const data = JSON.parse(localStorage.getItem('lyricsEditorData') || 'null');
      if (!data) return false;
      document.getElementById('sections').innerHTML = '';
      sectionCount = 0;
      data.forEach(item => {
        if (item.type === 'section') {
          sectionCount++;
          const sectionsDiv = document.getElementById('sections');
          const section = document.createElement('div');
          section.className = 'section';
          section.dataset.sectionId = sectionCount;
          section.innerHTML = `
            <input type="text" class="section-title" placeholder="#M,#1,#2,#4 - $M,$1,$2,$4" />
            <button class="remove-section-btn" title="Remove Section" onclick="removeSection(this.parentNode)">×</button>
            <div class="lines"></div>
            <div style="margin-top: 32px;"><button class="add-line-btn" onclick="addLine(this.parentNode.parentNode)">+</button></div>
          `;
          sectionsDiv.appendChild(section);
          const sectionTitleInput = section.querySelector('.section-title');
          sectionTitleInput.value = item.title;
          const linesDiv = section.querySelector('.lines');
          item.lines.forEach(lineData => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'line';
            lineDiv.innerHTML = `
              <input type="text" placeholder="މިތާ ލިޔޭ ލަވަ، ފަހަރަކު ބައިތެއް" />
              <button class="star-line-btn" title="Nagaa / Zuvaabu">N</button>
              <button class="remove-line-btn" title="Remove Line" onclick="removeLine(this.parentNode)">×</button>
            `;
            linesDiv.appendChild(lineDiv);
            const lineInput = lineDiv.querySelector('input[type="text"]');
            lineInput.value = lineData.text;
            setupThaanaTransliteration(lineInput);
            setupInputNavigation(lineInput);
            const starBtn = lineDiv.querySelector('.star-line-btn');
            if (lineData && lineData.starred) {
              starBtn.classList.add('active');
              starBtn.textContent = 'Z';
            } else {
              starBtn.textContent = 'N';
            }
            setLineHighlight(lineDiv);
            lineInput.addEventListener('input', saveState);
            starBtn.addEventListener('click', function() {
              starBtn.classList.toggle('active');
              starBtn.textContent = starBtn.classList.contains('active') ? 'Z' : 'N';
              setLineHighlight(lineDiv);
              saveState();
            });
            lineInput.addEventListener('input', saveState);
          });
        } else if (item.type === 'break') {
          const sectionsDiv = document.getElementById('sections');
          const breakDiv = document.createElement('div');
          breakDiv.className = 'break-line';
          breakDiv.innerHTML = '<button class="remove-break-btn" title="Remove Break" onclick="this.parentNode.remove()">×</button>';
          sectionsDiv.appendChild(breakDiv);
        }
      });
      return true;
    }
    function addSection(sectionName, editable, skipInitialLine) {
      sectionCount++;
      const sectionsDiv = document.getElementById('sections');
      // Determine auto section name if not provided
      if (!sectionName || !sectionName.trim()) {
        // Find last section or break
        const sectionOrder = ['M', '1', '2', '3', '4', '5', '6', '7', '8', '9', 'N'];
        let prefix = '#';
        let idx = 0;
        const children = Array.from(sectionsDiv.children);
        for (let i = children.length - 1; i >= 0; i--) {
          const child = children[i];
          if (child.classList.contains('break-line')) {
            prefix = '$';
            idx = 0;
            break;
          } else if (child.classList.contains('section')) {
            const lastTitle = child.querySelector('.section-title').value.trim();
            const match = lastTitle.match(/^(#|\$)([A-Za-z0-9]+)/);
            if (match) {
              prefix = match[1];
              let label = match[2];
              let lastIdx = sectionOrder.indexOf(label);
              idx = lastIdx >= 0 ? lastIdx + 1 : 1;
            }
            break;
          }
        }
        if (idx >= sectionOrder.length) idx = sectionOrder.length - 1;
        sectionName = prefix + sectionOrder[idx];
      }
      const section = document.createElement('div');
      section.className = 'section';
      section.dataset.sectionId = sectionCount;
      section.innerHTML = `
        <input type="text" class="section-title" placeholder="#M,#1,#2,#4 - $M,$1,$2,$4" />
        <button class="remove-section-btn" title="Remove Section" onclick="removeSection(this.parentNode)">×</button>
        <div class="lines"></div>
        <div style="margin-top: 32px;"><button class="add-line-btn" onclick="addLine(this.parentNode.parentNode)">+</button></div>
      `;
      sectionsDiv.appendChild(section);
      const sectionTitleInput = section.querySelector('.section-title');
      if (sectionName) {
        sectionTitleInput.value = sectionName;
      }
      if (editable === false) {
        sectionTitleInput.disabled = true;
        sectionTitleInput.style.background = '#333';
      } else {
        sectionTitleInput.focus();
        sectionTitleInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            let firstLineInput = section.querySelector('.line input[type="text"]');
            if (!firstLineInput) {
              addLine(section);
              firstLineInput = section.querySelector('.line input[type="text"]');
            }
            if (firstLineInput) firstLineInput.focus();
          }
        });
      }
      if (!skipInitialLine) {
        addLine(section);
      }
      saveState();
      return section;
    }
    function addLine(sectionDiv) {
      const linesDiv = sectionDiv.querySelector('.lines');
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      lineDiv.innerHTML = `

    function addBreak() {

    function copyToClipboard() {
      const songName = document.getElementById('song-name-input').value.trim();
      const container = document.getElementById('sections');
      const children = Array.from(container.children);
      let missingSections = [];
      children.forEach(child => {
        if (child.classList.contains('section')) {
          const sectionTitle = child.querySelector('.section-title').value.trim();
          if (!sectionTitle) missingSections.push(child);
        }
      });
      if (!songName || !selectedGenre || missingSections.length > 0) {
        let msg = '';
        if (!songName) msg += 'Song name is empty.\n';
        if (!selectedGenre) msg += 'Genre is not selected.\n';
        if (missingSections.length > 0) msg += 'One or more section names are empty.';
        alert(msg);
        return;
      }
      
      // This function is for generating lyrics in the old songs.js format
      // Since we're using Firebase now, this is just for copying formatted lyrics
      let lyrics = '';
      children.forEach(child => {
        if (child.classList.contains('section')) {
          const sectionTitle = child.querySelector('.section-title').value.trim();
          if (sectionTitle) {
            lyrics += sectionTitle + '\n';
          }
          const lines = child.querySelectorAll('.line');
          lines.forEach(line => {
            const input = line.querySelector('input[type="text"]');
            const starBtn = line.querySelector('.star-line-btn');
            let text = input.value.trim();
            if (text) {
              if (starBtn.classList.contains('active')) text = '*' + text;
              lyrics += text + '\n';
            }
          });
          lyrics += '\n';
        } else if (child.classList.contains('break-line')) {
          lyrics += '-\n';
        }
      });
      
      const lyricsEscaped = lyrics.trim().replace(/`/g, '\u0060');
      const output = `{
  name: \`${songName.replace(/`/g, '\u0060')}\`,
  genre: '${selectedGenre}',
  lyrics: \`${lyricsEscaped}\`
},`;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(output);
      } else {
        fallbackCopyTextToClipboard(output);
      }
    }
    function fallbackCopyTextToClipboard(text) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.top = 0;
      textArea.style.left = 0;
      textArea.style.width = '2em';
      textArea.style.height = '2em';
      textArea.style.padding = 0;
      textArea.style.border = 'none';
      textArea.style.outline = 'none';
      textArea.style.boxShadow = 'none';
      textArea.style.background = 'transparent';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        // Do nothing
      }
      document.body.removeChild(textArea);
    }

        const idx = lines.indexOf(currentLine);
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (idx < lines.length - 1) {
            lines[idx + 1].querySelector('input[type="text"]').focus();
          } else {
            // Add new line and focus
            addLine(currentLine.parentNode.parentNode);
            setTimeout(() => {
              const newLines = Array.from(currentLine.parentNode.querySelectorAll('.line'));
              newLines[newLines.length - 1].querySelector('input[type="text"]').focus();
            }, 0);
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (idx > 0) {
            lines[idx - 1].querySelector('input[type="text"]').focus();
          }
        } else if (e.key === 'Enter') {
          if (e.shiftKey) {
            e.preventDefault();

              const lastSection = allSections[allSections.length - 1];

            const newLine = document.createElement('div');
            newLine.className = 'line';

    // Function to import text and create sections/lines
    function importTextToLyrics(text) {
      // Clear existing sections without adding a default empty section
      localStorage.removeItem('lyricsEditorData');
      localStorage.removeItem('lyricsEditorGenre');
      document.getElementById('sections').innerHTML = '';
      sectionCount = 0;
      document.getElementById('song-name-input').value = '';
      selectedGenre = '';
      updateGenreButton();
      
      // Split text into lines and filter out completely empty content
      const lines = text.split(/\r?\n/);
      let currentSection = null;
      let hasContent = false;
      const sectionsDiv = document.getElementById('sections');
      let pendingSection = false; // Flag to indicate we need a new section for the next lyric line
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        
        // Empty lines mark the end of the current section and prepare for a new one
        if (line === '') {
          currentSection = null;
          pendingSection = true; // Next lyric line should start a new section
          continue;
        }
        
        // Check if line is a break indicator (just a dash or multiple dashes)
        if (/^-+$/.test(line)) {
          hasContent = true;
          currentSection = null;
          pendingSection = false;
          
          // Add a break line
          const breakDiv = document.createElement('div');
          breakDiv.className = 'break-line';
          breakDiv.innerHTML = '<button class="remove-break-btn" title="Remove Break" onclick="this.parentNode.remove()">×</button>';
          sectionsDiv.appendChild(breakDiv);
          continue;
        }
        
        // Check if line is a section name (starts with # or $ followed by letters/numbers)
        if (/^[#$][A-Za-z0-9]+$/.test(line)) {
          hasContent = true;
          currentSection = addSection(line, true, true);
          pendingSection = false;
          continue;
        }
        
        // This is a lyric line - add it to current section
        hasContent = true;
        
        // If we don't have a current section or need a new section, create one with automatic naming
        if (!currentSection || pendingSection) {
          currentSection = addSection('', true, true); // Pass empty string to trigger automatic naming
          pendingSection = false;
        }
        
        // Add the line to the current section
        addLineToSection(currentSection, line);
      }
      
      // If no content was found, create at least one empty section
      if (!hasContent) {
        addSection();
      }
      
      // Save the state and show success message
      saveState();
      
      // Optional: Show a brief success message
      setTimeout(() => {
        const firstInput = document.querySelector('.line input[type="text"]');
        if (firstInput) {
          firstInput.focus();
        }
      }, 100);
    }
    
    // Helper function to add a line to a specific section
    function addLineToSection(section, text) {
      const linesDiv = section.querySelector('.lines');
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      lineDiv.innerHTML = `
        <input type="text" placeholder="މިތާ ލިޔޭ ލަވަ، ފަހަރަކު ބައިތެއް"/>
        <button class="star-line-btn" title="Star this line">N</button>
        <button class="remove-line-btn" title="Remove Line" onclick="removeLine(this.parentNode)">×</button>
      `;
      linesDiv.appendChild(lineDiv);
      
      const lineInput = lineDiv.querySelector('input[type="text"]');
      const starBtn = lineDiv.querySelector('.star-line-btn');
      
      // Check if line starts with * for starred text
      let starred = false;
      if (text.startsWith('*')) {
        starred = true;
        text = text.slice(1); // Remove the * prefix
      }
      
      // Count existing lines in this section (excluding the one we just added)
      const existingLines = linesDiv.querySelectorAll('.line');
      const lineIndex = existingLines.length - 1; // 0-based index of current line
      
      // For imported text, apply alternating pattern: first line (index 0) = N, second line (index 1) = Z, etc.
      // Only apply this if the line wasn't already explicitly starred with *
      if (!starred) {
        starred = (lineIndex % 2 === 1); // Odd indices (1, 3, 5...) get Z
      }
      
      // Set the text value (without the * if it was starred)
      lineInput.value = text;
      
      // Set up transliteration and navigation
      setupThaanaTransliteration(lineInput);
      setupInputNavigation(lineInput);
      
      // Set up star button
      if (starred) {
        starBtn.classList.add('active');
        starBtn.textContent = 'Z';
      } else {
        starBtn.textContent = 'N';
      }
      
      // Set up line highlighting
      setLineHighlight(lineDiv);
      
      // Add event listeners
      lineInput.addEventListener('input', saveState);
      starBtn.addEventListener('click', function() {
        starBtn.classList.toggle('active');
        starBtn.textContent = starBtn.classList.contains('active') ? 'Z' : 'N';
        setLineHighlight(lineDiv);
        saveState();
      });
    }
    
    // Firebase Database Submission
    let rhythmDB;
    let existingSongs = {};
    
    async function initializeFirebase() {
      try {
        console.log('Attempting to load Firebase module...');
        const module = await import('./firebase-db.js');
        console.log('Firebase module loaded, creating database instance...');
        
        rhythmDB = new module.RhythmFirebaseDB();
        
        console.log('Database instance created, loading existing songs...');
        
        // Load existing songs to check for duplicates
        const songsObject = await rhythmDB.getAllSongsAsObject();
        existingSongs = {};
        
        if (songsObject && typeof songsObject === 'object') {
          Object.entries(songsObject).forEach(([songName, song]) => {
            if (song && song.name) {
              existingSongs[song.name.toLowerCase()] = song;
            }
          });
        }
        
        console.log('Loaded', Object.keys(existingSongs).length, 'existing songs');
        
        // Check if current song exists
        checkIfSongExists();
        
        // Clear any error messages
        document.getElementById('saveStatus').innerHTML = '<div style="color: #4CAF50;">✓ Connected to database</div>';
        
      } catch (error) {
        console.error('Failed to initialize Firebase:', error);
        console.error('Error details:', error.message);
        console.error('Error stack:', error.stack);
        document.getElementById('saveStatus').innerHTML = `<div style="color: #ff4444;">Error: ${error.message || 'Failed to connect to database'}</div>`;
      }
    }
    
    function checkIfSongExists() {
      const songNameElement = document.getElementById('song-name-input');
      const submitBtn = document.getElementById('submitBtn');
      
      if (!songNameElement || !submitBtn) {
        console.warn('Required elements not found for checkIfSongExists');
        return;
      }
      
      const songName = songNameElement.value.trim();
      
      if (songName && existingSongs[songName.toLowerCase()]) {
        submitBtn.textContent = 'Update Song';
      } else {
        submitBtn.textContent = 'Save Song';
      }
    }
    
    async function saveSongToDatabase() {
      const statusDiv = document.getElementById('saveStatus');
      statusDiv.innerHTML = '<div style="color: #f5d000;">Saving...</div>';
      
      try {
        // Initialize Firebase if not already done
        if (!rhythmDB) {
          await initializeFirebase();
          if (!rhythmDB) {
            statusDiv.innerHTML = '<div style="color: #ff4444;">Database not connected</div>';
            return;
          }
        }
        
        // Get song name
        const songNameElement = document.getElementById('song-name-input');
        if (!songNameElement) {
          statusDiv.innerHTML = '<div style="color: #ff4444;">Error: Song name field not found</div>';
          return;
        }
        
        const songName = songNameElement.value.trim();
        if (!songName) {
          statusDiv.innerHTML = '<div style="color: #ff4444;">Please enter a song name</div>';
          return;
        }
        
        // Get genre
        const genreButton = document.getElementById('genre-btn');
        if (!genreButton) {
          statusDiv.innerHTML = '<div style="color: #ff4444;">Error: Genre button not found</div>';
          return;
        }
        
        const genre = genreButton.textContent === 'Select Genre' ? '' : genreButton.textContent;
        if (!genre) {
          statusDiv.innerHTML = '<div style="color: #ff4444;">Please select a genre</div>';
          return;
        }
        
        // Compile lyrics from all sections
        let lyrics = '';
        const sections = document.querySelectorAll('.section');
        
        sections.forEach((section, sectionIndex) => {
          // Get section title
          const titleInput = section.querySelector('input[type="text"]');
          const sectionTitle = titleInput ? titleInput.value.trim() : '';
          
          if (sectionTitle) {
            lyrics += `[${sectionTitle}]\n`;
          }
          
          // Get all lines in this section
          const lines = section.querySelectorAll('.line input[type="text"]');
          lines.forEach(lineInput => {
            if (!lineInput) {
              console.warn('Found null lineInput element, skipping...');
              return;
            }
            
            const lineText = lineInput.value.trim();
            if (lineText) {
              // Check if this line is starred (Z mode)
              const starBtn = lineInput.parentElement.querySelector('.star-line-btn');
              const isStarred = starBtn && starBtn.classList.contains('active');
              
              if (isStarred) {
                lyrics += `*${lineText}\n`;
              } else {
                lyrics += `${lineText}\n`;
              }
            }
          });
          
          // Add spacing between sections
          if (sectionIndex < sections.length - 1) {
            lyrics += '\n';
          }
        });
        
        if (!lyrics.trim()) {
          statusDiv.innerHTML = '<div style="color: #ff4444;">Please add some lyrics</div>';
          return;
        }
        
        // Create song object
        const songData = {
          name: songName,
          genre: genre,
          lyrics: lyrics.trim()
        };
        
        // Check if this is an update operation from edit mode
        const isUpdateMode = window.isUpdateMode && window.originalSongKey;
        let result;
        
        if (isUpdateMode) {
          // Update existing song using original Firebase key
          result = await rhythmDB.updateSong(window.originalSongKey, songData);
          statusDiv.innerHTML = `<div style="color: #4CAF50;">✓ Song updated successfully!</div>`;
          
          // Clear update mode flags
          window.isUpdateMode = false;
          window.originalSongKey = null;
        } else {
          // Check if song exists by name for regular operation
          const existingSong = existingSongs[songName.toLowerCase()];
          
          if (existingSong) {
            // Update existing song
            result = await rhythmDB.updateSong(songName, songData);
            statusDiv.innerHTML = `<div style="color: #4CAF50;">✓ Song updated successfully!</div>`;
          } else {
            // Save new song
            result = await rhythmDB.addSong(songData);
            statusDiv.innerHTML = `<div style="color: #4CAF50;">✓ Song saved successfully!</div>`;
            
            // Add to existing songs cache
            existingSongs[songName.toLowerCase()] = songData;
          }
        }
        
        // Update button text
        checkIfSongExists();
        
      } catch (error) {
        console.error('Error saving song:', error);
        statusDiv.innerHTML = '<div style="color: #ff4444;">Error saving song. Please try again.</div>';
      }
    }
    
    // Call handleImportedText when page loads
    document.addEventListener('DOMContentLoaded', function() {
      handleImportedText();
      
      // Add event listener to song name input to check for existing songs
      const songNameInput = document.getElementById('song-name-input');
      if (songNameInput) {
        songNameInput.addEventListener('input', checkIfSongExists);
      }
      
      // Initialize Firebase on page load
      initializeFirebase();
      
      // Load song suggestions early for direct page visits
      setTimeout(() => {
        if (!window.pendingEditSongName) {
          populateSongNameSuggestions();
        }
      }, 1000);
    });
  </script>
</body>
