<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit Management - Admin Panel</title>
    <link rel="stylesheet" href="../assets/styles.css">
    
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            color: #f5d000;
            font-size: 2.5rem;
            margin: 0;
        }

        .back-button {
            padding: 10px 20px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #333;
        }

        .tab {
            padding: 15px 30px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #f5d000;
            border-bottom-color: #f5d000;
        }

        .tab:hover {
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Kit Inventory Section */
        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .add-kit-button {
            padding: 12px 30px;
            background: #f5d000;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-kit-button:hover {
            background: #ffd700;
            transform: scale(1.05);
        }

        .kits-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .kit-item {
            background: rgba(31, 31, 31, 0.95);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .kit-info h3 {
            color: #f5d000;
            margin: 0 0 5px 0;
            font-size: 1.3rem;
        }

        .kit-info p {
            color: #aaa;
            margin: 0;
            font-size: 0.9rem;
        }

        .kit-actions {
            display: flex;
            gap: 10px;
        }

        .edit-kit-button {
            padding: 8px 16px;
            background: rgba(245, 208, 0, 0.2);
            border: 2px solid #f5d000;
            color: #f5d000;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .edit-kit-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        .delete-kit-button {
            padding: 8px 16px;
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #f44336;
            color: #f44336;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .delete-kit-button:hover {
            background: #f44336;
            color: #fff;
        }

        /* Members Kit View */
        .members-grid {
            display: grid;
            gap: 20px;
        }

        .member-card {
            background: rgba(31, 31, 31, 0.95);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #333;
        }

        .member-name {
            color: #f5d000;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .member-email {
            color: #aaa;
            font-size: 0.9rem;
        }

        .member-kits {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .kit-badge {
            background: rgba(245, 208, 0, 0.2);
            border: 2px solid #f5d000;
            color: #f5d000;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .no-kits {
            color: #666;
            font-style: italic;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1f1f1f;
            border: 2px solid #f5d000;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h2 {
            color: #f5d000;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5d000;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .modal-button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-button.primary {
            background: #f5d000;
            color: #1a1a1a;
        }

        .modal-button.primary:hover {
            background: #ffd700;
        }

        .modal-button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #666;
        }

        /* Image Upload */
        .upload-section {
            margin-bottom: 20px;
        }

        .upload-button {
            padding: 12px 24px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .upload-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        .image-preview {
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            border: 2px solid #f5d000;
        }

        .kit-image {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-right: 15px;
            border-radius: 8px;
        }

        .modal-button.secondary:hover {
            border-color: #aaa;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .tabs {
                overflow-x: auto;
            }

            .kits-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="page-header">
            <h1>Kit Management</h1>
            <a href="admin-panel.html" class="back-button">← Back to Admin Panel</a>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="inventory">Kit Inventory</button>
            <button class="tab" data-tab="members">Members' Kits</button>
        </div>

        <!-- Kit Inventory Tab -->
        <div class="tab-content active" id="inventory">
            <div class="inventory-header">
                <h2 style="color: #fff; margin: 0;">Available Kits</h2>
                <button class="add-kit-button" id="addKitBtn">+ Add New Kit</button>
            </div>
            <div id="kitsLoading" class="loading">Loading kits...</div>
            <div class="kits-list" id="kitsList" style="display: none;"></div>
        </div>

        <!-- Members Kits Tab -->
        <div class="tab-content" id="members">
            <h2 style="color: #fff; margin-bottom: 20px;">Member Kit Overview</h2>
            <div id="membersLoading" class="loading">Loading members...</div>
            <div class="members-grid" id="membersList" style="display: none;"></div>
        </div>
    </div>

    <!-- Add Kit Modal -->
    <div class="modal" id="addKitModal">
        <div class="modal-content">
            <h2>Add New Kit</h2>
            <form id="addKitForm">
                <div class="upload-section">
                    <label style="display: block; color: #aaa; margin-bottom: 8px; font-weight: 600;">Kit Image</label>
                    <button type="button" class="upload-button" onclick="uploadKitImage()">📷 Upload Image</button>
                    <input type="hidden" id="kitImageUrl" required>
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImg" src="" alt="Kit preview">
                    </div>
                </div>
                <div class="form-group">
                    <label for="kitName">Kit Name</label>
                    <input type="text" id="kitName" required placeholder="e.g., Baburu Beru">
                </div>
                <div class="form-group">
                    <label for="kitDescription">Description</label>
                    <textarea id="kitDescription" rows="3" placeholder="Brief description of the kit"></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-button secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="modal-button primary">Add Kit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Kit Modal -->
    <div class="modal" id="editKitModal">
        <div class="modal-content">
            <h2>Edit Kit</h2>
            <form id="editKitForm">
                <input type="hidden" id="editKitId">
                <div class="upload-section">
                    <label style="display: block; color: #aaa; margin-bottom: 8px; font-weight: 600;">Kit Image</label>
                    <button type="button" class="upload-button" onclick="uploadEditKitImage()">📷 Upload New Image</button>
                    <input type="hidden" id="editKitImageUrl" required>
                    <div class="image-preview show" id="editImagePreview">
                        <img id="editPreviewImg" src="" alt="Kit preview">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editKitName">Kit Name</label>
                    <input type="text" id="editKitName" required placeholder="e.g., Baburu Beru">
                </div>
                <div class="form-group">
                    <label for="editKitDescription">Description</label>
                    <textarea id="editKitDescription" rows="3" placeholder="Brief description of the kit"></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="modal-button secondary" id="editCancelBtn">Cancel</button>
                    <button type="submit" class="modal-button primary">Update Kit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script type="module">
        // Import Unified Auth System
        import '../js/rhythm-unified-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        
        let currentUser = null;
        let allKits = {};
        let allMembers = {};
        let cloudinaryWidget = null;
        let editCloudinaryWidget = null;

        // Check authentication and admin status using unified system
        async function checkAuth() {
            // Wait for auth to initialize
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (!window.rhythmAuth?.isInitialized) {
                console.error('Auth system not initialized');
                window.location.href = '../login.html';
                return;
            }

            const authResult = await window.rhythmAuth.checkAuthentication();
            
            if (!authResult.isAuthenticated) {
                console.log('User not authenticated, redirecting to login');
                window.location.href = '../login.html';
                return;
            }

            // Check if user is admin
            if (!window.rhythmAuth.isAdmin()) {
                alert('Access denied. Admin privileges required.');
                window.location.href = '../index.html';
                return;
            }

            currentUser = authResult.user;
            console.log('Admin authenticated:', currentUser.fullName);
            initPage();
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAuth);
        } else {
            checkAuth();
        }

        // Cloudinary upload widget
        window.uploadKitImage = function() {
            if (!cloudinaryWidget) {
                cloudinaryWidget = cloudinary.createUploadWidget({
                    cloudName: 'dgvde8x6e',
                    uploadPreset: 'Rhyhtm',
                    sources: ['local', 'camera'],
                    multiple: false,
                    maxFileSize: 5000000,
                    clientAllowedFormats: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'],
                    maxImageWidth: 1000,
                    maxImageHeight: 1000,
                    cropping: true,
                    croppingAspectRatio: 1,
                    folder: 'rhythm/kits',
                    resourceType: 'image'
                }, (error, result) => {
                    if (error) {
                        console.error('Upload error:', error);
                        alert('Failed to upload image');
                        return;
                    }
                    
                    if (result.event === 'success') {
                        const imageUrl = result.info.secure_url;
                        document.getElementById('kitImageUrl').value = imageUrl;
                        document.getElementById('previewImg').src = imageUrl;
                        document.getElementById('imagePreview').classList.add('show');
                    }
                });
            }
            cloudinaryWidget.open();
        }

        // Cloudinary upload widget for editing
        window.uploadEditKitImage = function() {
            if (!editCloudinaryWidget) {
                editCloudinaryWidget = cloudinary.createUploadWidget({
                    cloudName: 'dgvde8x6e',
                    uploadPreset: 'Rhyhtm',
                    sources: ['local', 'camera'],
                    multiple: false,
                    maxFileSize: 5000000,
                    clientAllowedFormats: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'],
                    maxImageWidth: 1000,
                    maxImageHeight: 1000,
                    cropping: true,
                    croppingAspectRatio: 1,
                    folder: 'rhythm/kits',
                    resourceType: 'image'
                }, (error, result) => {
                    if (error) {
                        console.error('Upload error:', error);
                        alert('Failed to upload image');
                        return;
                    }
                    
                    if (result.event === 'success') {
                        const imageUrl = result.info.secure_url;
                        document.getElementById('editKitImageUrl').value = imageUrl;
                        document.getElementById('editPreviewImg').src = imageUrl;
                        document.getElementById('editImagePreview').classList.add('show');
                    }
                });
            }
            editCloudinaryWidget.open();
        }

        // Initialize page
        function initPage() {
            setupTabs();
            loadKits();
            loadMembers();
        }

        // Tab switching
        function setupTabs() {
            const tabs = document.querySelectorAll('.tab');
            const tabContents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.dataset.tab;
                    
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(targetTab).classList.add('active');
                });
            });
        }

        // Load kits from Firebase
        function loadKits() {
            db.ref('kits/inventory').on('value', (snapshot) => {
                allKits = snapshot.val() || {};
                renderKits();
            });
        }

        // Render kits list
        function renderKits() {
            const loading = document.getElementById('kitsLoading');
            const list = document.getElementById('kitsList');

            loading.style.display = 'none';
            list.style.display = 'grid';
            list.innerHTML = '';

            const kitsArray = Object.entries(allKits);

            if (kitsArray.length === 0) {
                list.innerHTML = '<p style="color: #aaa; text-align: center; grid-column: 1/-1;">No kits available. Add your first kit!</p>';
                return;
            }

            kitsArray.forEach(([id, kit]) => {
                const kitItem = document.createElement('div');
                kitItem.className = 'kit-item';
                kitItem.innerHTML = `
                    <div class="kit-info" style="display: flex; align-items: center;">
                        ${kit.imageUrl ? `<img src="${kit.imageUrl}" alt="${kit.name}" class="kit-image">` : ''}
                        <div>
                            <h3>${kit.name}</h3>
                            <p>${kit.description || 'No description'}</p>
                        </div>
                    </div>
                    <div class="kit-actions">
                        <button class="edit-kit-button" onclick="editKit('${id}')">Edit</button>
                        <button class="delete-kit-button" onclick="deleteKit('${id}')">Delete</button>
                    </div>
                `;
                list.appendChild(kitItem);
            });
        }

        // Load members and their kits
        function loadMembers() {
            db.ref('members').on('value', (snapshot) => {
                allMembers = snapshot.val() || {};
                renderMembers();
            });
        }

        // Render members with their kits
        function renderMembers() {
            const loading = document.getElementById('membersLoading');
            const list = document.getElementById('membersList');

            loading.style.display = 'none';
            list.style.display = 'grid';
            list.innerHTML = '';

            const membersArray = Object.entries(allMembers);

            if (membersArray.length === 0) {
                list.innerHTML = '<p style="color: #aaa; text-align: center;">No members found.</p>';
                return;
            }

            membersArray.forEach(([uid, member]) => {
                const memberCard = document.createElement('div');
                memberCard.className = 'member-card';

                const memberKits = member.kits ? Object.keys(member.kits) : [];
                const kitsHTML = memberKits.length > 0
                    ? memberKits.map(kitId => {
                        const kitName = allKits[kitId]?.name || kitId;
                        return `<span class="kit-badge">${kitName}</span>`;
                    }).join('')
                    : '<span class="no-kits">No kits selected</span>';

                memberCard.innerHTML = `
                    <div class="member-header">
                        <div>
                            <div class="member-name">${member.name || 'Unknown'}</div>
                            <div class="member-email">${member.email || ''}</div>
                        </div>
                    </div>
                    <div class="member-kits">
                        ${kitsHTML}
                    </div>
                `;

                list.appendChild(memberCard);
            });
        }

        // Add kit modal
        document.getElementById('addKitBtn').addEventListener('click', () => {
            document.getElementById('addKitModal').classList.add('active');
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('addKitModal').classList.remove('active');
            document.getElementById('addKitForm').reset();
            document.getElementById('imagePreview').classList.remove('show');
        });

        document.getElementById('addKitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('kitName').value.trim();
            const description = document.getElementById('kitDescription').value.trim();
            const imageUrl = document.getElementById('kitImageUrl').value.trim();

            if (!name) {
                alert('Please enter a kit name');
                return;
            }

            if (!imageUrl) {
                alert('Please upload an image for the kit');
                return;
            }

            try {
                await db.ref('kits/inventory').push({
                    name,
                    description,
                    imageUrl,
                    createdAt: Date.now()
                });

                document.getElementById('addKitModal').classList.remove('active');
                document.getElementById('addKitForm').reset();
                document.getElementById('imagePreview').classList.remove('show');
            } catch (error) {
                console.error('Error adding kit:', error);
                alert('Error adding kit. Please try again.');
            }
        });

        // Edit kit
        window.editKit = function(kitId) {
            const kit = allKits[kitId];
            if (!kit) return;

            document.getElementById('editKitId').value = kitId;
            document.getElementById('editKitName').value = kit.name;
            document.getElementById('editKitDescription').value = kit.description || '';
            document.getElementById('editKitImageUrl').value = kit.imageUrl || '';
            
            if (kit.imageUrl) {
                document.getElementById('editPreviewImg').src = kit.imageUrl;
                document.getElementById('editImagePreview').classList.add('show');
            } else {
                document.getElementById('editImagePreview').classList.remove('show');
            }

            document.getElementById('editKitModal').classList.add('active');
        }

        document.getElementById('editCancelBtn').addEventListener('click', () => {
            document.getElementById('editKitModal').classList.remove('active');
            document.getElementById('editKitForm').reset();
            document.getElementById('editImagePreview').classList.remove('show');
        });

        document.getElementById('editKitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const kitId = document.getElementById('editKitId').value;
            const name = document.getElementById('editKitName').value.trim();
            const description = document.getElementById('editKitDescription').value.trim();
            const imageUrl = document.getElementById('editKitImageUrl').value.trim();

            if (!name) {
                alert('Please enter a kit name');
                return;
            }

            if (!imageUrl) {
                alert('Please upload an image for the kit');
                return;
            }

            try {
                await db.ref(`kits/inventory/${kitId}`).update({
                    name,
                    description,
                    imageUrl,
                    updatedAt: Date.now()
                });

                document.getElementById('editKitModal').classList.remove('active');
                document.getElementById('editKitForm').reset();
                document.getElementById('editImagePreview').classList.remove('show');
            } catch (error) {
                console.error('Error updating kit:', error);
                alert('Error updating kit. Please try again.');
            }
        });

        // Delete kit
        window.deleteKit = async function deleteKit(kitId) {
            if (!confirm('Are you sure you want to delete this kit? This will also remove it from all members.')) {
                return;
            }

            try {
                // Delete from inventory
                await db.ref(`kits/inventory/${kitId}`).remove();

                // Remove from all members
                for (const [uid, member] of Object.entries(allMembers)) {
                    if (member.kits && member.kits[kitId]) {
                        await db.ref(`members/${uid}/kits/${kitId}`).remove();
                    }
                }

            } catch (error) {
                console.error('Error deleting kit:', error);
                alert('Error deleting kit. Please try again.');
            }
        }

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            const addModal = document.getElementById('addKitModal');
            const editModal = document.getElementById('editKitModal');
            
            if (e.target === addModal) {
                addModal.classList.remove('active');
                document.getElementById('addKitForm').reset();
                document.getElementById('imagePreview').classList.remove('show');
            }
            
            if (e.target === editModal) {
                editModal.classList.remove('active');
                document.getElementById('editKitForm').reset();
                document.getElementById('editImagePreview').classList.remove('show');
            }
        });
    </script>
</body>
</html>
