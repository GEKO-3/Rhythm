<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Checklist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5d000">
  
  <!-- 🚀 PREVENT FLASH: Immediate dark background -->
  <style>
    html, body {
      background-color: #1f1f1f !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    
    body {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
    
    body.loaded {
      visibility: visible;
      opacity: 1;
    }
  </style>
  
  <!-- 🚨 CRITICAL: Emergency visibility timeout - MUST be first script -->
  <script>
    window.rhythmLoadStages = {
      emergencyTimeoutSet: Date.now(),
      scriptsStarted: Date.now(),
      stages: []
    };
    
    function logStage(stage) {
      const elapsed = Date.now() - window.rhythmLoadStages.scriptsStarted;
      console.log(`📊 [Checklist] ${stage} at ${elapsed}ms`);
      window.rhythmLoadStages.stages.push({ stage, time: elapsed });
    }
    
    logStage('Emergency timeout script executed');
    
    setTimeout(() => {
      document.body.classList.add('loaded');
      logStage('Emergency timeout (500ms) - page forced visible');
      console.warn('🚨 [Checklist] Emergency timeout triggered');
    }, 500);
    
    setTimeout(() => {
      if (!document.body.classList.contains('loaded')) {
        document.body.classList.add('loaded');
        logStage('Secondary timeout (2000ms)');
        console.error('🚨 [Checklist] Secondary timeout triggered');
      }
    }, 2000);
    
    document.addEventListener('DOMContentLoaded', () => logStage('DOMContentLoaded'));
    window.addEventListener('load', () => {
      logStage('Window load');
      console.log('📊 [Checklist] Timeline:', window.rhythmLoadStages);
    });
  </script>
  
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/icons-192.png">
  
  <!-- Firebase -->
  <script type="module" onerror="console.error('❌ [Checklist] Failed to load Firebase module')">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
    
    const firebaseConfig = {
      apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
      authDomain: "rhythm-ea7a1.firebaseapp.com",
      databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rhythm-ea7a1",
      storageBucket: "rhythm-ea7a1.firebasestorage.app",
      messagingSenderId: "776053739080",
      appId: "1:776053739080:web:bfaf1a208b117faf94927d"
    };
    
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    
    window.checklistDB = { database, ref, onValue, update };
  </script>
  
  <script type="module" src="../../js/rhythm-unified-auth.js"></script>
  
  <style>
    @font-face {
      font-family: 'Montserrat';
      src: url('../../assets/Fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: #1f1f1f;
      color: #f5f5f5;
      padding: 20px;
      padding-bottom: 80px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f5d000;
    }
    
    .back-button {
      background: rgba(43, 43, 43, 0.9);
      border: 2px solid #f5d000;
      color: #f5d000;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    .back-button:hover {
      background: #f5d000;
      color: #1f1f1f;
    }
    
    h1 {
      color: #f5d000;
      font-size: 2em;
      text-align: center;
      flex: 1;
    }
    
    .tab-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      justify-content: center;
    }
    
    .tab-btn {
      background: #2a2a2a;
      border: 2px solid #444;
      color: #f5f5f5;
      padding: 15px 40px;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .tab-btn:hover {
      border-color: #f5d000;
      background: #333;
    }
    
    .tab-btn.active {
      background: #f5d000;
      color: #1f1f1f;
      border-color: #f5d000;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .category-card {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .category-card:hover {
      border-color: #f5d000;
      background: #333;
    }
    
    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
    }
    
    .category-name {
      font-size: 1.2em;
      font-weight: 700;
      color: #f5d000;
    }
    
    .category-count {
      background: #444;
      color: #f5d000;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 0.9em;
    }
    
    .items-container {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #444;
    }
    
    .items-container.expanded {
      display: block;
    }
    
    .expand-icon {
      transition: transform 0.3s ease;
      font-size: 1.2em;
    }
    
    .expand-icon.rotated {
      transform: rotate(180deg);
    }
    
    .checklist-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #3a3a3a;
      transition: background 0.2s ease;
    }
    
    .checklist-item:last-child {
      border-bottom: none;
    }
    
    .checklist-item:hover {
      background: rgba(245, 208, 0, 0.05);
      border-radius: 6px;
    }
    
    .checkbox-wrapper {
      position: relative;
      margin-right: 15px;
    }
    
    .checkbox {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #f5d000;
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    
    .checkbox:checked {
      background: #f5d000;
      border-color: #f5d000;
    }
    
    .checkbox:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #1f1f1f;
      font-size: 16px;
      font-weight: bold;
    }
    
    .item-label {
      flex: 1;
      font-size: 1em;
      cursor: pointer;
      user-select: none;
    }
    
    .item-label.checked {
      text-decoration: line-through;
      opacity: 0.6;
    }
    
    .sub-items {
      margin-left: 45px;
      margin-top: 8px;
    }
    
    .sub-item {
      display: flex;
      align-items: center;
      padding: 8px 0;
      font-size: 0.9em;
    }
    
    .sub-item .checkbox {
      width: 20px;
      height: 20px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #f5d000;
      font-size: 1.2em;
    }
    
    .last-updated {
      text-align: center;
      color: #888;
      font-size: 0.85em;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #3a3a3a;
    }
    
    .sync-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(46, 204, 113, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      display: none;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    
    .sync-indicator.show {
      display: block;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 768px) {
      body {
        padding: 15px;
      }
      
      h1 {
        font-size: 1.5em;
      }
      
      .back-button {
        padding: 8px 16px;
        font-size: 0.9em;
      }
      
      .tab-btn {
        padding: 12px 25px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="sync-indicator" id="syncIndicator">✓ Synced</div>
  
  <div class="container">
    <div class="header">
      <a href="admin.html" class="back-button">← Back</a>
      <h1>📋 Admin Checklist</h1>
      <div style="width: 100px;"></div>
    </div>
    
    <div class="tab-buttons">
      <button class="tab-btn active" data-tab="equipment">🎵 Equipment</button>
      <button class="tab-btn" data-tab="itinerary">📅 Itinerary</button>
    </div>
    
    <div id="equipment-tab" class="tab-content active">
      <div id="equipmentContainer" class="category-list loading">
        Loading equipment...
      </div>
    </div>
    
    <div id="itinerary-tab" class="tab-content">
      <div id="itineraryContainer" class="category-list loading">
        Loading itinerary...
      </div>
    </div>
    
    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <script>
    let currentTab = 'equipment';
    let isUpdating = false;
    let checklistData = { equipment: {}, itinerary: {} };

    // Safety timeout
    setTimeout(() => {
      if (!document.body.classList.contains('loaded')) {
        console.warn('⚠️ Force-showing page after timeout');
        document.body.classList.add('loaded');
      }
    }, 2000);

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tab = e.target.dataset.tab;
        switchTab(tab);
      });
    });

    function switchTab(tab) {
      currentTab = tab;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
      
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`${tab}-tab`).classList.add('active');
    }

    async function initializeChecklist() {
      document.body.classList.add('loaded');

      // Wait for auth
      let attempts = 0;
      while (!window.rhythmAuth?.isInitialized && attempts < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }

      if (!window.rhythmAuth?.isInitialized) {
        showError('Authentication failed to initialize');
        return;
      }

      const authResult = await window.rhythmAuth.checkAuthentication();
      if (!authResult.isAuthenticated || !window.rhythmAuth.isAdmin()) {
        window.location.href = 'admin.html';
        return;
      }

      // Wait for Firebase to initialize
      attempts = 0;
      while (!window.checklistDB && attempts < 50) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }

      if (!window.checklistDB) {
        showError('Firebase initialization failed');
        return;
      }

      await loadChecklistData();
      renderChecklist();
      setupRealtimeSync();
    }

    async function loadChecklistData() {
      const { database, ref, onValue } = window.checklistDB;
      const dataRef = ref(database, 'checklistData');
      
      return new Promise((resolve) => {
        onValue(dataRef, (snapshot) => {
          const data = snapshot.val();
          if (data) {
            checklistData = data;
          }
          resolve();
        }, { onlyOnce: true });
      });
    }

    function renderChecklist() {
      renderEquipment();
      renderItinerary();
    }

    function renderEquipment() {
      const container = document.getElementById('equipmentContainer');
      container.innerHTML = '';
      container.classList.remove('loading');

      const equipment = checklistData.equipment || {};
      
      if (Object.keys(equipment).length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 40px;">No equipment categories yet.<br><a href="checklist-data-entry.html" style="color: #f5d000;">Add data via entry page</a></div>';
        return;
      }

      Object.keys(equipment).forEach(categoryId => {
        const category = equipment[categoryId];
        const categoryCard = createCategoryCard(categoryId, category, 'equipment');
        container.appendChild(categoryCard);
      });
    }

    function renderItinerary() {
      const container = document.getElementById('itineraryContainer');
      container.innerHTML = '';
      container.classList.remove('loading');

      const itinerary = checklistData.itinerary || {};
      
      if (Object.keys(itinerary).length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #888; padding: 40px;">No itinerary items yet.<br><a href="checklist-data-entry.html" style="color: #f5d000;">Add data via entry page</a></div>';
        return;
      }

      Object.keys(itinerary).forEach(categoryId => {
        const category = itinerary[categoryId];
        const categoryCard = createCategoryCard(categoryId, category, 'itinerary');
        container.appendChild(categoryCard);
      });
    }

    function createCategoryCard(categoryId, category, type) {
      const card = document.createElement('div');
      card.className = 'category-card';
      
      const items = category.items || {};
      const itemCount = Object.keys(items).length;
      let checkedCount = 0;
      
      Object.values(items).forEach(item => {
        if (item.checked) checkedCount++;
        if (item.subItems) {
          Object.values(item.subItems).forEach(sub => {
            if (sub.checked) checkedCount++;
          });
        }
      });
      
      card.innerHTML = `
        <div class="category-header" data-type="${type}" data-category="${categoryId}">
          <div class="category-name">${category.name}</div>
          <div style="display: flex; align-items: center; gap: 15px;">
            <div class="category-count">${checkedCount} checked</div>
            <span class="expand-icon" id="icon-${type}-${categoryId}">▼</span>
          </div>
        </div>
        <div class="items-container" id="items-${type}-${categoryId}">
          ${renderItems(categoryId, items, type)}
        </div>
      `;
      
      card.querySelector('.category-header').addEventListener('click', (e) => {
        toggleCategory(type, categoryId);
      });
      
      return card;
    }

    function renderItems(categoryId, items, type) {
      let html = '';
      
      Object.keys(items).forEach(itemId => {
        const item = items[itemId];
        const itemPath = `${type}/${categoryId}/${itemId}`;
        const hasSubItems = item.subItems && Object.keys(item.subItems).length > 0;
        
        html += `
          <div class="checklist-item">
            <div class="checkbox-wrapper">
              <input type="checkbox" class="checkbox" data-path="${itemPath}" ${item.checked ? 'checked' : ''}>
            </div>
            <label class="item-label ${item.checked ? 'checked' : ''}">${item.name}</label>
          </div>
        `;
        
        if (hasSubItems) {
          html += '<div class="sub-items">';
          Object.keys(item.subItems).forEach(subId => {
            const subItem = item.subItems[subId];
            const subPath = `${type}/${categoryId}/${itemId}/${subId}`;
            html += `
              <div class="sub-item">
                <div class="checkbox-wrapper">
                  <input type="checkbox" class="checkbox" data-path="${subPath}" ${subItem.checked ? 'checked' : ''}>
                </div>
                <label class="item-label ${subItem.checked ? 'checked' : ''}">${subItem.name}</label>
              </div>
            `;
          });
          html += '</div>';
        }
      });
      
      return html || '<div style="color: #888; padding: 10px;">No items</div>';
    }

    function toggleCategory(type, categoryId) {
      const itemsContainer = document.getElementById(`items-${type}-${categoryId}`);
      const icon = document.getElementById(`icon-${type}-${categoryId}`);
      
      itemsContainer.classList.toggle('expanded');
      icon.classList.toggle('rotated');
    }

    async function handleCheckboxChange(path, checked) {
      if (isUpdating) return;

      const { database, ref, update } = window.checklistDB;
      const pathParts = path.split('/');
      const [type, categoryId, itemId, subId] = pathParts;

      try {
        const dataPath = subId 
          ? `checklistData/${type}/${categoryId}/items/${itemId}/subItems/${subId}`
          : `checklistData/${type}/${categoryId}/items/${itemId}`;
        
        const checklistRef = ref(database, dataPath);
        await update(checklistRef, { checked: checked });
        
        // Update state tracking
        const stateRef = ref(database, `checklistStates/${path.replace(/\//g, '_')}`);
        await update(stateRef, {
          checked: checked,
          lastUpdated: Date.now(),
          updatedBy: window.rhythmAuth.getCurrentUser()?.fullName || 'Unknown'
        });

        showSyncIndicator();
      } catch (error) {
        console.error('Failed to update checklist:', error);
        const checkbox = document.querySelector(`[data-path="${path}"]`);
        if (checkbox) checkbox.checked = !checked;
      }
    }

    function setupRealtimeSync() {
      const { database, ref, onValue } = window.checklistDB;
      
      // Listen to data changes
      const dataRef = ref(database, 'checklistData');
      onValue(dataRef, (snapshot) => {
        const data = snapshot.val();
        if (data && !isUpdating) {
          checklistData = data;
          renderChecklist();
          attachCheckboxListeners();
        }
      });

      // Listen to state changes for last updated info
      const statesRef = ref(database, 'checklistStates');
      onValue(statesRef, (snapshot) => {
        const states = snapshot.val() || {};
        
        let latestUpdate = 0;
        let updatedBy = '';
        Object.values(states).forEach(state => {
          if (state.lastUpdated > latestUpdate) {
            latestUpdate = state.lastUpdated;
            updatedBy = state.updatedBy;
          }
        });

        if (latestUpdate) {
          const lastUpdatedEl = document.getElementById('lastUpdated');
          const date = new Date(latestUpdate);
          lastUpdatedEl.textContent = `Last updated by ${updatedBy} at ${date.toLocaleString()}`;
        }

        showSyncIndicator();
      });
    }

    function attachCheckboxListeners() {
      document.querySelectorAll('.checkbox').forEach(checkbox => {
        checkbox.replaceWith(checkbox.cloneNode(true)); // Remove old listeners
      });
      
      document.querySelectorAll('.checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const path = e.target.dataset.path;
          handleCheckboxChange(path, e.target.checked);
          
          // Update label
          const label = e.target.closest('.checklist-item, .sub-item').querySelector('.item-label');
          if (label) {
            label.classList.toggle('checked', e.target.checked);
          }
        });
      });
    }

    function showSyncIndicator() {
      const indicator = document.getElementById('syncIndicator');
      indicator.classList.add('show');
      setTimeout(() => {
        indicator.classList.remove('show');
      }, 2000);
    }

    function showError(message) {
      const containers = [document.getElementById('equipmentContainer'), document.getElementById('itineraryContainer')];
      containers.forEach(container => {
        container.innerHTML = `
          <div style="text-align: center; color: #e74c3c; padding: 40px;">
            <h2>❌ Error</h2>
            <p>${message}</p>
            <a href="admin.html" style="color: #f5d000; text-decoration: underline;">Return to Admin Panel</a>
          </div>
        `;
        container.classList.remove('loading');
      });
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', initializeChecklist);
  </script>
</body>
</html>
