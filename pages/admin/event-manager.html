<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Manager - Rhythm Boduberu Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        h1 {
            color: #f5d000;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .create-btn {
            background: #f5d000;
            color: #1a1a1a;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .create-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .event-card {
            background: rgba(31, 31, 31, 0.95);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid rgba(245, 208, 0, 0.3);
            transition: all 0.3s ease;
        }

        .event-card:hover {
            border-color: #f5d000;
            transform: translateY(-5px);
        }

        .event-card.active {
            border-color: #4caf50;
            border-width: 3px;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .event-title {
            color: #f5d000;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .event-active-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .event-info {
            margin: 10px 0;
            color: #ccc;
            font-size: 0.95rem;
        }

        .event-info strong {
            color: #f5d000;
        }

        .event-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .event-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .set-active-btn {
            background: #4caf50;
            color: white;
        }

        .set-active-btn:hover {
            background: #45a049;
        }

        .edit-btn {
            background: #2196F3;
            color: white;
        }

        .edit-btn:hover {
            background: #0b7dda;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .delete-btn:hover {
            background: #da190b;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            border: 2px solid #f5d000;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #f5d000;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #f5d000;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(245, 208, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #f5d000;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .location-info {
            background: rgba(245, 208, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #f5d000;
        }

        .kit-selection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .kit-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .kit-item:hover {
            border-color: #f5d000;
        }

        .kit-item.selected {
            background: rgba(245, 208, 0, 0.2);
            border-color: #f5d000;
        }

        .kit-item input[type="checkbox"] {
            margin-right: 8px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-btn {
            background: #f5d000;
            color: #1a1a1a;
        }

        .save-btn:hover {
            background: #ffd700;
        }

        .cancel-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="admin.html" class="back-button">← Back to Admin</a>
        
        <h1>📅 Event Manager</h1>
        
        <button class="create-btn" onclick="openCreateModal()">+ Create New Event</button>
        
        <div class="events-grid" id="eventsGrid">
            <!-- Events will be populated here -->
        </div>
    </div>

    <!-- Event Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h2 id="modalTitle">Create New Event</h2>
            
            <div class="form-group">
                <label for="eventTitle">Event Title</label>
                <input type="text" id="eventTitle" placeholder="e.g., Boduberu Night at Rasfannu">
            </div>
            
            <div class="form-group">
                <label for="eventDescription">Description</label>
                <textarea id="eventDescription" placeholder="Event details and instructions..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="eventDate">Date</label>
                <input type="date" id="eventDate">
            </div>
            
            <div class="form-group">
                <label for="eventTime">Time</label>
                <input type="time" id="eventTime">
            </div>
            
            <div class="form-group">
                <label>Location (Click on map to set)</label>
                <div id="map"></div>
                <div class="location-info" id="locationInfo">
                    Click on the map to select event location
                </div>
            </div>
            
            <div class="form-group">
                <label>Select Kits for Event</label>
                <div class="kit-selection" id="kitSelection">
                    <!-- Kits will be populated here -->
                </div>
            </div>
            
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                <button class="save-btn" onclick="saveEvent()">Save Event</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus&callback=initMap" async defer></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const eventsRef = db.ref('events/currentEvents');
        const activeEventRef = db.ref('events/activeEvent');
        const kitsRef = db.ref('kits/inventory');

        let map, marker;
        let selectedLocation = null;
        let currentEditingEventId = null;
        let availableKits = [];

        // Initialize Google Maps
        window.initMap = function() {
            // Default to Malé, Maldives
            const maleLocation = { lat: 4.1755, lng: 73.5093 };
            
            map = new google.maps.Map(document.getElementById('map'), {
                center: maleLocation,
                zoom: 13,
                styles: [
                    {
                        "elementType": "geometry",
                        "stylers": [{"color": "#212121"}]
                    },
                    {
                        "elementType": "labels.text.fill",
                        "stylers": [{"color": "#757575"}]
                    },
                    {
                        "elementType": "labels.text.stroke",
                        "stylers": [{"color": "#212121"}]
                    }
                ]
            });

            // Add click listener to place marker
            map.addListener('click', function(event) {
                placeMarker(event.latLng);
            });
        };

        function placeMarker(location) {
            if (marker) {
                marker.setMap(null);
            }

            marker = new google.maps.Marker({
                position: location,
                map: map,
                animation: google.maps.Animation.DROP
            });

            selectedLocation = {
                lat: location.lat(),
                lng: location.lng()
            };

            // Reverse geocode to get address
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ location: location }, function(results, status) {
                if (status === 'OK' && results[0]) {
                    const address = results[0].formatted_address;
                    document.getElementById('locationInfo').innerHTML = `
                        <strong>Selected Location:</strong><br>
                        ${address}<br>
                        <small>Lat: ${selectedLocation.lat.toFixed(6)}, Lng: ${selectedLocation.lng.toFixed(6)}</small>
                    `;
                }
            });
        }

        // Load kits
        function loadKits() {
            kitsRef.once('value', (snapshot) => {
                availableKits = [];
                const kitsData = snapshot.val();
                if (kitsData) {
                    Object.entries(kitsData).forEach(([id, kit]) => {
                        availableKits.push({ id, name: kit.name });
                    });
                }
                renderKitSelection();
            });
        }

        function renderKitSelection() {
            const container = document.getElementById('kitSelection');
            container.innerHTML = '';
            
            availableKits.forEach(kit => {
                const kitItem = document.createElement('div');
                kitItem.className = 'kit-item';
                kitItem.innerHTML = `
                    <input type="checkbox" id="kit-${kit.id}" value="${kit.id}">
                    <label for="kit-${kit.id}">${kit.name}</label>
                `;
                
                kitItem.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'INPUT') {
                        const checkbox = kitItem.querySelector('input');
                        checkbox.checked = !checkbox.checked;
                    }
                    kitItem.classList.toggle('selected');
                });
                
                container.appendChild(kitItem);
            });
        }

        // Load events
        function loadEvents() {
            eventsRef.on('value', (snapshot) => {
                const events = snapshot.val();
                renderEvents(events);
            });

            activeEventRef.on('value', (snapshot) => {
                window.activeEventId = snapshot.val();
                renderEvents();
            });
        }

        function renderEvents(events) {
            const grid = document.getElementById('eventsGrid');
            grid.innerHTML = '';

            if (!events) {
                grid.innerHTML = '<p style="color: #aaa;">No events created yet. Click "Create New Event" to get started.</p>';
                return;
            }

            Object.entries(events).forEach(([id, event]) => {
                const card = document.createElement('div');
                card.className = 'event-card';
                if (id === window.activeEventId) {
                    card.classList.add('active');
                }

                const isActive = id === window.activeEventId;
                const selectedKits = event.selectedKits || [];
                const kitNames = selectedKits.map(kitId => {
                    const kit = availableKits.find(k => k.id === kitId);
                    return kit ? kit.name : kitId;
                }).join(', ') || 'No kits selected';

                card.innerHTML = `
                    ${isActive ? '<div class="event-active-badge">✓ ACTIVE</div>' : ''}
                    <h3 class="event-title">${event.title}</h3>
                    <div class="event-info"><strong>Date:</strong> ${event.date}</div>
                    <div class="event-info"><strong>Time:</strong> ${event.time}</div>
                    <div class="event-info"><strong>Location:</strong> ${event.address || 'Location set'}</div>
                    <div class="event-info"><strong>Kits:</strong> ${kitNames}</div>
                    <div class="event-actions">
                        ${!isActive ? `<button class="set-active-btn" onclick="setActiveEvent('${id}')">Set Active</button>` : ''}
                        <button class="edit-btn" onclick="editEvent('${id}')">Edit</button>
                        <button class="delete-btn" onclick="deleteEvent('${id}')">Delete</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function openCreateModal() {
            currentEditingEventId = null;
            document.getElementById('modalTitle').textContent = 'Create New Event';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
            
            // Clear kit selections
            document.querySelectorAll('.kit-item input').forEach(cb => {
                cb.checked = false;
                cb.parentElement.classList.remove('selected');
            });
            
            // Clear marker
            if (marker) marker.setMap(null);
            selectedLocation = null;
            document.getElementById('locationInfo').innerHTML = 'Click on the map to select event location';
            
            document.getElementById('eventModal').classList.add('active');
        }

        function editEvent(eventId) {
            currentEditingEventId = eventId;
            document.getElementById('modalTitle').textContent = 'Edit Event';
            
            eventsRef.child(eventId).once('value', (snapshot) => {
                const event = snapshot.val();
                
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDescription').value = event.description || '';
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventTime').value = event.time;
                
                // Set location on map
                if (event.location) {
                    const location = new google.maps.LatLng(event.location.lat, event.location.lng);
                    placeMarker(location);
                    map.setCenter(location);
                }
                
                // Set kit selections
                document.querySelectorAll('.kit-item input').forEach(cb => {
                    cb.checked = event.selectedKits && event.selectedKits.includes(cb.value);
                    if (cb.checked) {
                        cb.parentElement.classList.add('selected');
                    }
                });
                
                document.getElementById('eventModal').classList.add('active');
            });
        }

        async function saveEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const description = document.getElementById('eventDescription').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;

            if (!title || !date || !time) {
                alert('Please fill in title, date, and time');
                return;
            }

            if (!selectedLocation) {
                alert('Please select a location on the map');
                return;
            }

            // Get selected kits
            const selectedKits = Array.from(document.querySelectorAll('.kit-item input:checked'))
                .map(cb => cb.value);

            const eventData = {
                title,
                description,
                date,
                time,
                location: selectedLocation,
                address: document.getElementById('locationInfo').textContent.split('\n')[1] || 'Location set',
                selectedKits,
                createdAt: Date.now()
            };

            try {
                if (currentEditingEventId) {
                    await eventsRef.child(currentEditingEventId).update(eventData);
                    alert('Event updated successfully!');
                } else {
                    await eventsRef.push(eventData);
                    alert('Event created successfully!');
                }
                closeModal();
            } catch (error) {
                console.error('Error saving event:', error);
                alert('Failed to save event');
            }
        }

        async function setActiveEvent(eventId) {
            if (confirm('Set this event as active? Members will see this event.')) {
                try {
                    await activeEventRef.set(eventId);
                    alert('Event set as active!');
                } catch (error) {
                    console.error('Error setting active event:', error);
                    alert('Failed to set active event');
                }
            }
        }

        async function deleteEvent(eventId) {
            if (confirm('Are you sure you want to delete this event?')) {
                try {
                    await eventsRef.child(eventId).remove();
                    
                    // If this was the active event, clear it
                    if (eventId === window.activeEventId) {
                        await activeEventRef.set(null);
                    }
                    
                    alert('Event deleted successfully!');
                } catch (error) {
                    console.error('Error deleting event:', error);
                    alert('Failed to delete event');
                }
            }
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('eventModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadKits();
            loadEvents();
        });
    </script>
</body>
</html>
