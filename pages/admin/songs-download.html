<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Songs - Rhythm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Local font definitions -->
  <style>
    @font-face {
      font-family: 'Faruma';
      src: url('../../assets/Fonts/Faruma.ttf') format('truetype');
      font-display: swap;
      font-weight: normal;
      font-style: normal;
    }
    
    @font-face {
      font-family: 'Montserrat';
      src: url('../../assets/Fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
      font-weight: normal;
      font-style: normal;
    }
  </style>
  
  <link rel="icon" type="image/png" sizes="192x192" href="../../assets/favicons/icons-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../../assets/favicons/icons-512.png">
  <link rel="manifest" href="../../assets/favicons/admin-manifest.webmanifest">
  
  <style>
    html, body {
      touch-action: pan-x pan-y;
      overscroll-behavior: none;
    }
    
    input, textarea, select, button {
      touch-action: manipulation;
    }
    
    :root {
      --primary-color: #f5d000;
      --hover-color: #fced98;
      --active-color: #E6B800;
      --text-color: #2b2b2b;
      --bg-opacity: rgba(31, 31, 31, 0.0);
      --hover-color2: #3a3a3a;
      --active-color2: #111111;
    }
    
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    @keyframes slideIn {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    
    body {
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1f1f1f;
      color: var(--primary-color);
      animation: fadeIn 0.5s ease-in-out;
    }
    
    .container {
      text-align: center;
      position: relative;
      max-width: 800px;
      width: 100%;
      padding: 20px;
      background: var(--bg-opacity);
      border-radius: 10px;
      transition: transform 0.3s ease;
      animation: slideIn 0.5s ease-in-out;
      margin-top: 40px;
      margin-bottom: 40px;
    }
    
    h1 {
      color: var(--primary-color);
      margin-bottom: 1em;
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
      font-size: 2em;
    }
    
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--primary-color);
      color: var(--text-color);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
      z-index: 10;
    }
    
    .back-button:hover {
      background: var(--hover-color);
    }
    
    .songs-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 100%;
    }
    
    .song-item {
      background: rgba(43, 43, 43, 0.8);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(245, 208, 0, 0.2);
      gap: 20px;
    }
    
    .song-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 208, 0, 0.3);
    }
    
    .song-info {
      flex: 1;
      text-align: left;
    }
    
    .song-name {
      font-size: 1.3em;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 8px;
      font-family: 'Faruma', 'MV Elaaf Normal', 'Faruma Regular', 'Faruma Medium', 'Noto Sans Thaana', 'Thaana Unicode', Arial, sans-serif;
    }
    
    .song-genre {
      color: #ccc;
      font-size: 0.9em;
      margin-bottom: 8px;
    }
    
    .download-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 320px;
      min-width: 280px;
    }
    
    .download-btn {
      background: var(--primary-color);
      color: var(--text-color);
      border: none;
      border-radius: 5px;
      padding: 10px 12px;
      font-size: 0.85em;
      cursor: pointer;
      transition: background-color 0.3s;
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .download-btn:hover {
      background: var(--hover-color);
    }
    
    .download-btn:active {
      background: var(--active-color);
    }
    
    .download-btn:disabled {
      background: #666;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .download-btn.english {
      background: #2196F3;
      color: white;
    }
    
    .download-btn.english:hover {
      background: #1976D2;
    }
    
    .download-btn.view-btn {
      background: #4CAF50;
      color: white;
    }
    
    .download-btn.view-btn:hover {
      background: #45a049;
    }
    
    .download-btn.edit-btn {
      background: #FF9800;
      color: white;
    }
    
    .download-btn.edit-btn:hover {
      background: #F57C00;
    }
    
    .download-btn.downloading {
      background: #FF9800;
      cursor: wait;
    }
    
    .search-container {
      background: #1f1f1f;
      max-width: 600px;
      border-radius: 8px;
      padding: 16px;
      margin: 0 auto 30px auto;
      width: 96%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    
    .search-input {
      flex: 1;
      padding: 12px;
      border: 2px solid #444;
      border-radius: 5px;
      background: rgba(43, 43, 43, 0.8);
      color: var(--primary-color);
      font-size: 1em;
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    
    .filter-dropdown {
      position: relative;
      display: inline-block;
    }
    
    .filter-btn {
      background: var(--primary-color);
      color: var(--text-color);
      border: none;
      border-radius: 5px;
      padding: 12px;
      font-size: 1em;
      cursor: pointer;
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
      transition: background-color 0.3s;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .filter-btn:hover {
      background: var(--hover-color);
    }
    
    .filter-content {
      display: none;
      position: absolute;
      background: rgba(43, 43, 43, 0.98);
      border: 1px solid #444;
      border-radius: 5px;
      box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      min-width: 200px;
      top: 100%;
      right: 0;
      margin-top: 2px;
    }
    
    .filter-content a {
      color: var(--primary-color);
      padding: 8px 12px;
      text-decoration: none;
      display: block;
      font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
    }
    
    .filter-content a:hover {
      background: var(--hover-color2);
    }
    
    .stats {
      margin-bottom: 20px;
      color: #ccc;
      font-size: 0.9em;
    }
    
    /* Hidden canvas for image generation */
    #lyrics-canvas {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
    }
    
    @media (max-width: 768px) {
      .container {
        max-width: 95vw;
        padding: 15px;
      }
      
      .song-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      
      .song-info {
        text-align: left;
        width: 100%;
      }
      
      .download-buttons {
        width: 100%;
        max-width: 100%;
        min-width: 100%;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      
      .download-btn {
        font-size: 0.8em;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-button" onclick="window.history.back()">←</button>
    
    <h1>Song Manager</h1>
    
    <div class="search-container">
      <input type="text" class="search-input" id="searchInput" placeholder="Search songs...">
      <div class="filter-dropdown">
        <button class="filter-btn" onclick="toggleFilter()">🎵</button>
        <div class="filter-content" id="filterContent">
          <a href="#" onclick="filterByGenre('All')">All Genres</a>
          <a href="#" onclick="filterByGenre('Taki')">Taki</a>
          <a href="#" onclick="filterByGenre('Kaasi')">Kaasi</a>
          <a href="#" onclick="filterByGenre('Nala')">Nala</a>
          <a href="#" onclick="filterByGenre('Baburu')">Baburu</a>
          <a href="#" onclick="filterByGenre('Thinberu')">Thinberu</a>
          <a href="#" onclick="filterByGenre('Zamaanee')">Zamaanee</a>
        </div>
      </div>
    </div>
    
    <div class="stats" id="stats">
      Loading songs...
    </div>
    
    <div class="songs-list" id="songsList">
      <!-- Songs will be populated here -->
    </div>
  </div>

  <!-- Hidden canvas for image generation -->
  <canvas id="lyrics-canvas"></canvas>

  <!-- Firebase Scripts -->
  <script type="module" src="../../js/firebase-db.js"></script>
  <script type="module" src="../../js/rhythm-unified-auth.js"></script>
  
  <!-- Firebase SDK for transliteration -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="../../js/transliteration-firebase.js"></script>
  <script src="../../js/reverse-transliteration.js"></script>

  <script>
    console.log('🔥🔥🔥 SONGS DOWNLOAD PAGE SCRIPT LOADING 🔥🔥🔥');
    console.log('📍 Script location: pages/admin/songs-download.html');
    console.log('🕐 Current time:', new Date().toISOString());
    
    // Check if reverse transliteration is loaded
    console.log('🔍 Checking reverse transliteration availability...');
    console.log('🔍 typeof reverseTransliterate:', typeof reverseTransliterate);
    console.log('🔍 typeof reverseTransliterationMap:', typeof reverseTransliterationMap);
    
    // Initialize Firebase and load songs
    let rhythmDB = null;
    let currentUser = null;
    
    // Add immediate test logging
    console.log('🧪 Testing basic JavaScript functionality...');
    console.log('🧪 typeof window:', typeof window);
    console.log('🧪 typeof document:', typeof document);
    console.log('🧪 document ready state:', document.readyState);

    async function initializeFirebase() {
      try {
        console.log('🔄 Starting Firebase initialization...');
        console.log('🔗 Attempting to import firebase-db.js...');
        
        const module = await import(`../../js/firebase-db.js?t=${Date.now()}`);
        console.log('✅ Firebase module loaded successfully:', module);
        console.log('🔍 Module exports:', Object.keys(module));
        console.log('🔍 RhythmFirebaseDB class:', module.RhythmFirebaseDB);
        
        console.log('🏗️ Creating RhythmFirebaseDB instance...');
        rhythmDB = new module.RhythmFirebaseDB();
        console.log('✅ RhythmFirebaseDB instance created:', rhythmDB);
        console.log('🔍 rhythmDB methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(rhythmDB)));
        console.log('🔍 rhythmDB.isInitialized:', rhythmDB.isInitialized);
        
        window.rhythmDB = rhythmDB;
        console.log('✅ Firebase initialization complete - rhythmDB assigned to window');
        console.log('🔍 window.rhythmDB:', window.rhythmDB);
        return true;
      } catch (error) {
        console.error('❌ Failed to initialize Firebase:', error);
        console.error('❌ Error type:', error.constructor.name);
        console.error('❌ Error message:', error.message);
        console.error('❌ Error stack:', error.stack);
        return false;
      }
    }

    async function loadSongsFromFirebase() {
      try {
        console.log('🔄 Starting loadSongsFromFirebase...');
        console.log('🔍 rhythmDB exists:', !!rhythmDB);
        console.log('🔍 window.rhythmDB exists:', !!window.rhythmDB);
        
        if (!rhythmDB) {
          console.error('❌ rhythmDB is null or undefined');
          console.log('🔍 Trying to use window.rhythmDB as fallback...');
          rhythmDB = window.rhythmDB;
          
          if (!rhythmDB) {
            console.error('❌ window.rhythmDB is also null or undefined');
            return [];
          }
        }
        
        console.log('✅ rhythmDB instance found:', rhythmDB);
        console.log('🔍 rhythmDB.isInitialized:', rhythmDB.isInitialized);
        console.log('🔍 rhythmDB methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(rhythmDB)));
        
        if (!rhythmDB.isInitialized) {
          console.error('❌ rhythmDB is not initialized');
          return [];
        }
        
        console.log('🔄 Calling rhythmDB.getSongsMetadata()...');
        const songsMetadata = await rhythmDB.getSongsMetadata();
        console.log('✅ getSongsMetadata returned:', songsMetadata);
        console.log('📊 Songs metadata count:', songsMetadata ? songsMetadata.length : 'null/undefined');
        console.log('📋 First 3 metadata samples:', songsMetadata ? songsMetadata.slice(0, 3) : 'none');
        
        if (!songsMetadata || songsMetadata.length === 0) {
          console.warn('⚠️ No songs metadata returned from Firebase');
          console.log('🔄 Trying to call getSongsMetadata again after 1 second...');
          
          await new Promise(resolve => setTimeout(resolve, 1000));
          const retryMetadata = await rhythmDB.getSongsMetadata();
          console.log('🔄 Retry getSongsMetadata result:', retryMetadata);
          
          if (!retryMetadata || retryMetadata.length === 0) {
            console.error('❌ Still no songs after retry');
            return [];
          } else {
            console.log('✅ Retry successful, got', retryMetadata.length, 'songs');
            // Continue with retryMetadata
            songsMetadata = retryMetadata;
          }
        }
        
        const songs = [];
        console.log('🔄 Processing songs metadata (name and genre only)...');
        console.log('📊 About to process', songsMetadata.length, 'songs');
        
        // Convert to song list format - ONLY get name and genre, NOT full lyrics
        for (let i = 0; i < songsMetadata.length; i++) {
          const song = songsMetadata[i];
          
          if (!song) {
            console.warn(`⚠️ Song ${i + 1} is null or undefined:`, song);
            continue;
          }
          
          if (!song.name) {
            console.warn(`⚠️ Song ${i + 1} has no name:`, song);
            continue;
          }
          
          console.log(`🔄 Processing song ${i + 1}/${songsMetadata.length}: "${song.name}" (genre: "${song.genre || 'undefined'}")`, song);
          
          const songEntry = {
            id: song.id || song.name, // Fallback to name if no ID
            timestamp: Date.now(),
            name: song.name,
            genre: song.genre || 'General', // Fallback to 'General' if no genre
            lyrics: 'loaded_on_demand', // Placeholder - will load when needed
            englishLyrics: null // Will be determined when lyrics are loaded
          };
          
          songs.push(songEntry);
          
          // Log every 10th song to avoid console spam
          if ((i + 1) % 10 === 0 || i === songsMetadata.length - 1) {
            console.log(`✅ Processed ${i + 1}/${songsMetadata.length} songs so far`);
          }
        }
        
        console.log('✅ Final songs array (metadata only):', songs.length, 'songs');
        console.log('📋 Sample songs:', songs.slice(0, 3));
        console.log('🔍 All song names:', songs.map(s => s.name));
        console.log('🚀 Songs loaded super fast - no lyrics fetched yet!');
        return songs;
        
      } catch (error) {
        console.error('❌ Error in loadSongsFromFirebase:', error);
        console.error('❌ Error stack:', error.stack);
        return [];
      }
    }

    // Global flag to prevent multiple initializations
    let isInitializing = false;
    let isInitialized = false;
    
    async function initializePage() {
      // Prevent multiple simultaneous initializations
      if (isInitializing || isInitialized) {
        console.log('🛑 Skipping initializePage - already initializing:', isInitializing, 'or initialized:', isInitialized);
        return;
      }
      
      isInitializing = true;
      console.log('🚀 Starting initializePage...');
      console.log('🔍 Document ready state:', document.readyState);
      console.log('🔍 Current URL:', window.location.href);
      
      // Initialize Firebase transliteration data
      if (typeof transliterationFirebase !== 'undefined') {
        console.log('🔥 Initializing Firebase transliteration data...');
        await transliterationFirebase.initialize();
      }
      
      // Update loading message
      const stats = document.getElementById('stats');
      if (stats) {
        stats.textContent = 'Initializing...';
        console.log('✅ Stats element found and updated');
      } else {
        console.error('❌ Stats element not found');
      }

      // Check authentication first
      console.log('🔒 Checking authentication...');
      console.log('🔍 window.rhythmAuth exists:', !!window.rhythmAuth);
      
      if (window.rhythmAuth) {
        try {
          console.log('🔄 Calling rhythmAuth.checkAuthentication()...');
          const authResult = await window.rhythmAuth.checkAuthentication();
          console.log('✅ Authentication result:', authResult);
          
          if (!authResult.isAuthenticated) {
            console.error('❌ Authentication failed:', authResult);
            alert('Authentication failed. Please log in again.');
            window.location.href = '../../login.html';
            return;
          }
          
          // Check admin permission
          if (!window.rhythmAuth.isAdmin()) {
            console.error('❌ No admin permissions:', authResult.user);
            alert(`Access denied. Admin permissions required for song downloads.`);
            window.location.href = '../songlist.html';
            return;
          }
          
          currentUser = authResult.user;
          console.log('✅ Authenticated as:', currentUser.fullName);
        } catch (authError) {
          console.error('❌ Authentication error:', authError);
          console.error('❌ Auth error stack:', authError.stack);
          // Continue anyway for debugging
          console.log('⚠️ Continuing without authentication for debugging...');
        }
      } else {
        console.warn('⚠️ No authentication system found - proceeding without auth check');
      }

      console.log('🔥 About to initialize Firebase...');
      // Update loading message
      if (stats) {
        stats.textContent = 'Connecting to Firebase...';
      }

      // Initialize Firebase and load songs
      console.log('🔥 Calling initializeFirebase()...');
      const firebaseReady = await initializeFirebase();
      console.log('🔥 Firebase ready result:', firebaseReady);
      
      if (!firebaseReady) {
        console.error('❌ Firebase initialization failed');
        if (stats) {
          stats.textContent = 'Failed to initialize Firebase. Please refresh the page.';
        }
        // Don't return - continue for debugging
        console.log('⚠️ Continuing despite Firebase failure for debugging...');
      }

      console.log('📚 About to load songs from Firebase...');
      // Update loading message
      if (stats) {
        stats.textContent = 'Loading songs from database...';
      }

      // Load songs from Firebase
      console.log('📚 Calling loadSongsFromFirebase()...');
      try {
        const songs = await loadSongsFromFirebase();
        console.log('📚 Songs loaded result:', songs);
        console.log('📊 Songs count:', songs ? songs.length : 'null/undefined');
        console.log('📋 First 3 songs sample:', songs ? songs.slice(0, 3) : 'none');
      
        if (!songs || songs.length === 0) {
          console.warn('⚠️ No songs loaded - songs:', songs);
          if (stats) {
            stats.textContent = 'No songs found. Please check your connection and refresh.';
          }
          
          // For debugging, create fake data
          console.log('⚠️ Creating fake data for debugging...');
          const fakeSongs = [
            { id: 1, name: 'Test Song 1', genre: 'Taki', lyrics: 'Test lyrics 1' },
            { id: 2, name: 'Test Song 2', genre: 'Kaasi', lyrics: 'Test lyrics 2' }
          ];
          window.songs = fakeSongs;
          console.log('🧪 Using fake songs for debugging:', window.songs);
        } else {
          console.log('🌍 Setting window.songs to:', songs.length, 'songs');
          window.songs = songs; // Make globally available for compatibility
        }
      } catch (loadError) {
        console.error('💥 Error loading songs from Firebase:', loadError);
        console.error('💥 Load error stack:', loadError.stack);
        if (stats) {
          stats.textContent = 'Error loading songs. Using test data...';
        }
        
        // Create fake data for debugging
        console.log('🧪 Creating fake data due to load error...');
        const fakeSongs = [
          { id: 1, name: 'Test Song 1', genre: 'Taki', lyrics: 'Test lyrics 1' },
          { id: 2, name: 'Test Song 2', genre: 'Kaasi', lyrics: 'Test lyrics 2' }
        ];
        window.songs = fakeSongs;
        console.log('🧪 Using fake songs due to error:', window.songs);
      }
      
      // Initialize the download page
      console.log('🎵 Calling initializeSongsDownload()...');
      console.log('🔍 window.songs before initializeSongsDownload:', window.songs ? window.songs.length : 'undefined');
      initializeSongsDownload();
      console.log('✅ Page initialization complete!');
      
      // Mark as initialized
      isInitializing = false;
      isInitialized = true;
    }
    
    // Force immediate call for debugging - COMMENTED OUT TO PREVENT LOOPS
    // console.log('🚀 FORCING initializePage() call for debugging...');
    // initializePage().catch(error => {
    //   console.error('💥 Error in forced initializePage call:', error);
    //   isInitializing = false; // Reset flag on error
    // });
    
    function initializeSongsDownload() {
      console.log('🎵 initializeSongsDownload called');
      console.log('🔍 window.songs exists:', !!window.songs);
      console.log('🔍 window.songs length:', window.songs ? window.songs.length : 'undefined');
      console.log('🔍 window.songs content:', window.songs);

      // Initialize the page immediately or when DOM is ready
      function initPage() {
        console.log('🔄 initPage called inside initializeSongsDownload');
        console.log('🔍 window.songs in initPage:', window.songs);
        
        if (!window.songs) {
          console.error('❌ window.songs is not available in initPage');
          return;
        }
        
        filteredSongs = [...window.songs].sort((a, b) => a.name.localeCompare(b.name));
        console.log('✅ filteredSongs created:', filteredSongs.length, 'songs');
        
        // Apply filters which will render songs and update stats
        console.log('🔄 Calling applyFilters from initPage');
        applyFilters();
        
        console.log('🔄 Restoring scroll position');
        // Restore scroll position after rendering
        restoreScrollPosition();
        
        console.log('🔄 Adding search event listener');
        // Add search functionality
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function(e) {
          console.log('🔍 Search input changed:', e.target.value);
          applyFilters();
        });
        
        console.log('✅ initPage completed successfully');
      }
      
      // Actually call initPage to display the songs!
      console.log('🚀 Calling initPage from initializeSongsDownload');
      initPage();
    }
    
    // Global variables for the functions
    let filteredSongs = [];
    let currentGenreFilter = 'All';
    
    // Add error listener to catch any unhandled errors
    window.addEventListener('error', (e) => {
      console.error('💥 Global error caught:', e.error);
      console.error('💥 Error message:', e.message);
      console.error('💥 Error filename:', e.filename);
      console.error('💥 Error line:', e.lineno);
    });
    
    console.log('✅ Event listeners set up complete');

    // Function to parse lyrics structure for editing
    function parseLyricsForEdit(lyrics) {
      const lines = lyrics.split('\n');
      const sections = [];
      let currentSection = null;
      
      lines.forEach((line, index) => {
        const trimmedLine = line.trim();
        
        // Skip empty lines
        if (trimmedLine === '') {
          return;
        }
        
        // Section headers (# or $)
        if (trimmedLine.startsWith('#') || trimmedLine.startsWith('$')) {
          // Start new section - keep the full title with prefix
          currentSection = {
            type: 'section',
            title: trimmedLine, // Keep full title including # or $ prefix
            lines: []
          };
          sections.push(currentSection);
          return;
        }
        
        // Break lines
        if (trimmedLine.startsWith('-')) {
          sections.push({
            type: 'break'
          });
          return;
        }
        
        // Regular lines (including starred lines)
        if (currentSection === null) {
          // Create default section if no section header exists
          currentSection = {
            type: 'section',
            title: '#M', // Default section with prefix
            lines: []
          };
          sections.push(currentSection);
        }
        
        // Check if line is starred (starts with *)
        const isStarred = trimmedLine.startsWith('*');
        const lineText = isStarred ? trimmedLine.substring(1).trim() : trimmedLine;
        
        currentSection.lines.push({
          text: lineText,
          starred: isStarred
        });
      });
      
      return sections;
    }
    
    async function downloadLyrics(songId, language) {
      console.log('⬇️ downloadLyrics called for ID:', songId, 'language:', language);

          } catch (fontError) {
            console.warn('Faruma font loading failed, using fallback');
          }
        }
        
        // Get lyrics text based on language
        let lyrics;
        if (language === 'dhivehi') {
          lyrics = lyricsData;
        } else {
          // For English, use reverse transliteration on Dhivehi lyrics
          console.log('🔄 Converting Dhivehi lyrics to English using reverse transliteration...');
          button.textContent = 'Converting...';
          
          // Check if reverse transliteration is available
          if (typeof reverseTransliterate !== 'function') {
            console.error('❌ Reverse transliteration function not available');
            console.log('🔄 Attempting to wait for script to load...');
            
            // Try to wait for the function to be available
            let attempts = 0;
            const maxAttempts = 10;
            const checkInterval = 100; // ms
            
            while (attempts < maxAttempts && typeof reverseTransliterate !== 'function') {
              await new Promise(resolve => setTimeout(resolve, checkInterval));
              attempts++;
              console.log(`🔄 Attempt ${attempts}: typeof reverseTransliterate =`, typeof reverseTransliterate);
            }
            
            if (typeof reverseTransliterate !== 'function') {
              console.error('❌ Reverse transliteration function still not available after waiting');
              alert('Reverse transliteration not available. Please refresh the page.');
              return;
            } else {
              console.log('✅ Reverse transliteration function now available!');
            }
          }
          
          lyrics = reverseTransliterate(lyricsData);
          console.log('✅ Lyrics converted to English');
        }
        
        const { sections } = parseSections(lyrics);
        
        // Create image from lyrics
        const canvas = document.getElementById('lyrics-canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas width and calculate height
        canvas.width = 600;
        
        // Define text wrapping constraints
        const lineHeight = 35;
        const leftMargin = 30;
        const rightMargin = canvas.width - 30;
        const maxTextWidth = canvas.width - 60; // Use canvas width minus margins (30px on each side)
        
        // Font selection with fallbacks
        const titleFont = language === 'dhivehi' ? 
          '32px Faruma, "MV Elaaf Normal", "Faruma Regular", "Faruma Medium", "Noto Sans Thaana", "Thaana Unicode", Arial, sans-serif' : 
          '32px Montserrat, Arial, sans-serif';
        const textFont = language === 'dhivehi' ? 
          '22px Faruma, "MV Elaaf Normal", "Faruma Regular", "Faruma Medium", "Noto Sans Thaana", "Thaana Unicode", Arial, sans-serif' : 
          '22px Montserrat, Arial, sans-serif';
        
        // Function to calculate wrapped lines count
        function getWrappedLinesCount(text, font, maxWidth) {
          ctx.font = font;
          const words = text.split(' ');
          let lines = 1;
          let currentLine = '';
          
          for (const word of words) {
            const testLine = currentLine + (currentLine ? ' ' : '') + word;
            const testWidth = ctx.measureText(testLine).width;
            
            if (testWidth > maxWidth && currentLine !== '') {
              lines++;
              currentLine = word;
            } else {
              currentLine = testLine;
            }
          }
          
          return lines;
        }
        
        // First pass: calculate required height
        let totalHeight = 180; // Start with more space for title and genre
        
        // Calculate height for each section
        sections.forEach(section => {
          // Handle break sections
          if (section.name === 'break') {
            // Add spacing before and after break, plus break line height
            totalHeight += lineHeight * 0.5; // Space before
            totalHeight += 30; // Break line height
            totalHeight += lineHeight * 0.5; // Space after
            return;
          }
          
          // Add height for each line in the section
          section.lines.forEach(line => {
            if (line.startsWith('-')) {
              totalHeight += 30; // Break line height
            } else if (line.trim() === '') {
              totalHeight += lineHeight * 0.5; // Half line height for empty lines
            } else if (line.startsWith('*')) {
              const text = line.replace(/^\*+/, '').trim();
              if (text) {
                const wrappedLineCount = getWrappedLinesCount(text, textFont, maxTextWidth);
                totalHeight += lineHeight * wrappedLineCount;
              }
            } else if (line.trim() !== '') {
              const wrappedLineCount = getWrappedLinesCount(line.trim(), textFont, maxTextWidth);
              totalHeight += lineHeight * wrappedLineCount;
            }
          });
          
          totalHeight += 20; // Space between sections
        });
        
        totalHeight += 60; // Bottom margin
        
        // Set calculated height
        canvas.height = totalHeight;
        
        // Fill background
        ctx.fillStyle = '#1f1f1f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Add title
        ctx.fillStyle = '#f5d000';
        
        // Determine if song name is in Dhivehi or English and use appropriate font
        const isDhivehi = /[\u0780-\u07BF]/.test(song.name);
        ctx.font = isDhivehi ? titleFont : '32px Montserrat, Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(song.name, canvas.width / 2, 70);
        
        // Add genre
        ctx.fillStyle = '#ccc';
        ctx.font = '18px Montserrat, Arial, sans-serif';
        ctx.fillText(song.genre, canvas.width / 2, 120);
        
        // Add large watermark overlay across the entire image
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.font = 'bold 32px Montserrat';
        ctx.textAlign = 'center';
        
        // Calculate diagonal watermark positions
        const watermarkText = 'rhythmboduberu.com';
        const watermarkSpacingX = 380; // Horizontal spacing
        const watermarkSpacingY = 100; // Vertical spacing
        
        // Rotate canvas for diagonal watermarks
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-Math.PI / 6); // -30 degrees
        
        // Draw multiple watermarks across the image with separate X and Y spacing
        for (let x = -canvas.width; x <= canvas.width; x += watermarkSpacingX) {
          for (let y = -canvas.height; y <= canvas.height; y += watermarkSpacingY) {
            ctx.fillText(watermarkText, x, y);
          }
        }
        
        ctx.restore();
        
        // Add bottom watermark (more visible)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.font = 'bold 14px Montserrat';
        ctx.textAlign = 'center';
        ctx.fillText('rhythmboduberu.com', canvas.width / 2, canvas.height - 20);
        
        // Function to wrap text if it's too long
        function wrapText(text, maxWidth) {
          const words = text.split(' ');
          const lines = [];
          let currentLine = '';
          
          for (const word of words) {
            const testLine = currentLine + (currentLine ? ' ' : '') + word;
            const testWidth = ctx.measureText(testLine).width;
            
            if (testWidth > maxWidth && currentLine !== '') {
              lines.push(currentLine);
              currentLine = word;
            } else {
              currentLine = testLine;
            }
          }
          
          if (currentLine) {
            lines.push(currentLine);
          }
          
          return lines;
        }
        
        // Function to process text with highlighting like lyrics.html
        function processLineForCanvas(line, ctx, yPos, isHighlighted = false) {
          // Clean the line text
          let cleanText = line;
          if (line.startsWith('*')) {
            cleanText = line.slice(1).trim();
            isHighlighted = true;
          }
          
          // Handle &...& highlighting by processing the entire line as one unit
          // but changing colors for different parts
          const parts = cleanText.split(/(&[^&]+&)/);
          let fullLineText = '';
          
          // First pass: construct the full text without & symbols
          parts.forEach(part => {
            if (part.startsWith('&') && part.endsWith('&')) {
              fullLineText += part.slice(1, -1); // Remove & symbols
            } else {
              fullLineText += part;
            }
          });
          
          // Wrap the full line normally
          const wrappedLines = wrapText(fullLineText.trim(), maxTextWidth);
          
          // For each wrapped line, we need to figure out which parts are highlighted
          wrappedLines.forEach(wrappedLine => {
            // For simplicity, if the line contains highlighted parts, 
            // we'll render it with mixed colors by drawing character by character
            if (cleanText.includes('&')) {
              drawMixedColorLine(cleanText, wrappedLine, ctx, yPos, isHighlighted);
            } else {
              // Simple case - single color line
              ctx.fillStyle = isHighlighted ? '#f5d000' : '#FFFFFF';
              ctx.fillText(wrappedLine, canvas.width / 2, yPos);
            }
            yPos += lineHeight;
          });
          
          return yPos;
        }
        
        // Function to draw a line with mixed colors for &...& parts
        function drawMixedColorLine(originalText, wrappedLine, ctx, yPos, isHighlighted) {
          // Check if this is Dhivehi text (contains Thaana characters)
          const isDhivehi = /[\u0780-\u07BF]/.test(wrappedLine);
          
          // Check if the original text has any &...& highlighting
          const hasHighlighting = originalText.includes('&');
          
          if (!hasHighlighting) {
            // No highlighting needed, just draw with base color
            ctx.fillStyle = isHighlighted ? '#f5d000' : '#FFFFFF';
            ctx.fillText(wrappedLine, canvas.width / 2, yPos);
            return;
          }
          
          if (isDhivehi) {
            // For Dhivehi text with highlighting, we need a different approach
            // Parse the original text to create segments
            const parts = originalText.split(/(&[^&]+&)/);
            let processedParts = [];
            
            parts.forEach(part => {
              if (part.startsWith('&') && part.endsWith('&')) {
                // Highlighted part - remove & symbols
                const text = part.slice(1, -1);
                processedParts.push({
                  text: text,
                  color: isHighlighted ? '#FFFFFF' : '#f5d000'
                });
              } else if (part.trim()) {
                // Regular part
                processedParts.push({
                  text: part,
                  color: isHighlighted ? '#f5d000' : '#FFFFFF'
                });
              }
            });
            
            // For Dhivehi, draw each part separately but in proper RTL order
            // Calculate total width first
            let totalWidth = 0;
            processedParts.forEach(part => {
              totalWidth += ctx.measureText(part.text).width;
            });
            
            // Start from the right side for RTL
            let currentX = (canvas.width + totalWidth) / 2;
            
            // Draw parts from right to left
            for (let i = processedParts.length - 1; i >= 0; i--) {
              const part = processedParts[i];
              const partWidth = ctx.measureText(part.text).width;
              currentX -= partWidth;
              
              ctx.fillStyle = part.color;
              ctx.textAlign = 'left';
              ctx.fillText(part.text, currentX, yPos);
            }
            
            // Reset text alignment
            ctx.textAlign = 'center';
            return;
          }
          
          // For English text, use the original character-by-character approach
          const parts = originalText.split(/(&[^&]+&)/);
          let reconstructedText = '';
          let colorMap = [];
          
          // Build a map of which characters should be what color
          parts.forEach(part => {
            if (part.startsWith('&') && part.endsWith('&')) {
              const text = part.slice(1, -1);
              for (let i = 0; i < text.length; i++) {
                colorMap.push(isHighlighted ? '#FFFFFF' : '#f5d000');
                reconstructedText += text[i];
              }
            } else {
              for (let i = 0; i < part.length; i++) {
                colorMap.push(isHighlighted ? '#f5d000' : '#FFFFFF');
                reconstructedText += part[i];
              }
            }
          });
          
          // Find where our wrapped line appears in the reconstructed text
          const lineStart = reconstructedText.indexOf(wrappedLine);
          if (lineStart === -1) {
            // Fallback: just draw with default color
            ctx.fillStyle = isHighlighted ? '#f5d000' : '#FFFFFF';
            ctx.fillText(wrappedLine, canvas.width / 2, yPos);
            return;
          }
          
          // Calculate starting position for centered text
          const totalWidth = ctx.measureText(wrappedLine).width;
          let currentX = (canvas.width - totalWidth) / 2;
          
          // Draw each character with its appropriate color
          for (let i = 0; i < wrappedLine.length; i++) {
            const char = wrappedLine[i];
            const colorIndex = lineStart + i;
            
            if (colorIndex < colorMap.length) {
              ctx.fillStyle = colorMap[colorIndex];
            } else {
              ctx.fillStyle = isHighlighted ? '#f5d000' : '#FFFFFF';
            }
            
            ctx.textAlign = 'left';
            ctx.fillText(char, currentX, yPos);
            currentX += ctx.measureText(char).width;
          }
          
          // Reset text alignment
          ctx.textAlign = 'center';
        }
        
        // Draw lyrics with proper styling
        let yPosition = 180;
        
        sections.forEach(section => {
          // Handle break sections
          if (section.name === 'break') {
            // Add empty line before break
            yPosition += lineHeight * 0.5;
            
            // Draw break line (filter out any empty lines, only draw actual break lines)
            section.lines.forEach(line => {
              if (line.startsWith('-')) {
                ctx.fillStyle = '#f5d000';
                const lineY = yPosition + (lineHeight / 2);
                const breakLineWidth = canvas.width - (leftMargin * 2) - 40;
                const breakLineX = leftMargin + 20;
                ctx.fillRect(breakLineX, lineY - 3, breakLineWidth, 6);
                yPosition += 30;
              }
            });
            
            // Add empty line after break
            yPosition += lineHeight * 0.5;
            return;
          }
          
          section.lines.forEach(line => {
            if (line.startsWith('-')) {
              // Break line - add space before
              yPosition += lineHeight * 0.5;
              
              ctx.fillStyle = '#f5d000';
              const lineY = yPosition + (lineHeight / 2);
              const breakLineWidth = canvas.width - (leftMargin * 2) - 40;
              const breakLineX = leftMargin + 20;
              ctx.fillRect(breakLineX, lineY - 3, breakLineWidth, 6);
              yPosition += 30;
              
              // Add space after break
              yPosition += lineHeight * 0.5;
            } else if (line.trim() === '') {
              // Empty line - add spacing
              yPosition += lineHeight * 0.5; // Half line height for empty lines
            } else if (line.trim() !== '') {
              // Process line with proper highlighting
              ctx.font = textFont;
              ctx.textAlign = 'center';
              yPosition = processLineForCanvas(line, ctx, yPosition);
            }
          });
          
          yPosition += 20; // Space between sections
        });
        
        // Convert canvas to blob and download
        canvas.toBlob(function(blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${song.name.replace(/[^\w\s]/gi, '')}_${language}_lyrics.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 'image/png');
        
      } catch (error) {
        console.error('Error generating lyrics image:', error);
        alert('Error generating lyrics image. Please try again.');
      } finally {
        button.textContent = originalText;
        button.classList.remove('downloading');
        button.disabled = false;
      }
    }
    
    // Parse sections function - simplified to preserve exact database order
    function parseSections(lyrics) {
      const lines = lyrics.split('\n');
      let sections = [];
      let currentSection = {
        name: 'lyrics',
        lines: []
      };
      
      // Process each line in exact order from database
      lines.forEach((line, idx) => {
        if (line.startsWith('#') || line.startsWith('$')) {
          // Section headers are metadata - skip them in rendering but preserve structure
          // Don't add them as separate sections, they're just markers
          return;
        } else if (line.startsWith('-')) {
          // Break lines - add as special break section
          if (currentSection.lines.length > 0) {
            sections.push(currentSection);
            currentSection = { name: 'lyrics', lines: [] };
          }
          sections.push({
            name: 'break',
            lines: [line]
          });
        } else {
          // Regular content line (including empty lines)
          currentSection.lines.push(line);
        }
      });
      
      // Add final section if it has content
      if (currentSection.lines.length > 0) {
        sections.push(currentSection);
      }
      
      // Filter out empty sections
      sections = sections.filter(section => section.lines.length > 0);
      
      return {
        sections: sections,
        // Keep compatibility with existing code
        html: '',
        orderedSections: []
      };
    }
  </script>
