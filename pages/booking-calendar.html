<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar - Rhythm Boduberu</title>
    
    <!-- 🚨 CRITICAL: Emergency page load script -->
    <script>
        window.rhythmLoadStages = { emergencyTimeoutSet: Date.now(), scriptsStarted: Date.now(), stages: [] };
        function logStage(stage) {
            const elapsed = Date.now() - window.rhythmLoadStages.scriptsStarted;
            console.log(`📊 [Booking] ${stage} at ${elapsed}ms`);
            window.rhythmLoadStages.stages.push({ stage, time: elapsed });
        }
        logStage('Emergency script loaded');
        document.addEventListener('DOMContentLoaded', () => logStage('DOMContentLoaded'));
        window.addEventListener('load', () => {
            logStage('Window load');
            console.log('📊 [Booking] Timeline:', window.rhythmLoadStages);
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        h1 {
            color: #f5d000;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .calendar-section {
            background: rgba(31, 31, 31, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .calendar-header h2 {
            color: #f5d000;
            font-size: 1.8rem;
        }

        .calendar-nav {
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .calendar-nav:hover {
            background: #f5d000;
            color: #1f1f1f;
            transform: scale(1.1);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .calendar-day-header {
            text-align: center;
            color: #f5d000;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 15px 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 2px solid transparent;
        }

        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .calendar-day.other-month {
            opacity: 0.3;
            cursor: default;
        }

        .calendar-day.today {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .calendar-day.booked {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }

        .calendar-day.special-event {
            background: rgba(245, 208, 0, 0.2);
            border-color: #f5d000;
        }

        .event-indicator {
            width: 8px;
            height: 8px;
            background: #f5d000;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ccc;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 2px solid;
        }

        .legend-color.booked {
            background: rgba(244, 67, 54, 0.2);
            border-color: #f44336;
        }

        .legend-color.special {
            background: rgba(245, 208, 0, 0.2);
            border-color: #f5d000;
        }

        .legend-color.today {
            background: rgba(76, 175, 80, 0.1);
            border-color: #4caf50;
        }

        /* Event Details Modal */
        .event-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .event-modal.active {
            display: flex;
        }

        .event-modal-content {
            background: #1f1f1f;
            border: 2px solid #f5d000;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
        }

        .event-modal-content h3 {
            color: #f5d000;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .event-modal-content .event-date {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .event-modal-content .event-details {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .modal-buttons button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-buttons .close-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #666;
        }

        .modal-buttons .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .calendar-header {
                flex-direction: column;
                gap: 20px;
            }

            .calendar-day {
                font-size: 0.9rem;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../login.html" class="back-button">← Back to Login</a>
        
        <h1>📅 Booking Calendar</h1>
        <p class="subtitle">View upcoming events and bookings</p>

        <div class="calendar-section">
            <div class="calendar-header">
                <div class="calendar-nav" onclick="previousMonth()">‹</div>
                <h2 id="monthYear"></h2>
                <div class="calendar-nav" onclick="nextMonth()">›</div>
            </div>

            <div class="calendar-grid">
                <div class="calendar-day-header">Sun</div>
                <div class="calendar-day-header">Mon</div>
                <div class="calendar-day-header">Tue</div>
                <div class="calendar-day-header">Wed</div>
                <div class="calendar-day-header">Thu</div>
                <div class="calendar-day-header">Fri</div>
                <div class="calendar-day-header">Sat</div>
                
                <div id="calendarGrid"></div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color today"></div>
                    <span>Today</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color booked"></div>
                    <span>Booked</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color special"></div>
                    <span>Special Event</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div class="event-modal" id="eventModal">
        <div class="event-modal-content">
            <h3 id="modalTitle">Event Details</h3>
            <p class="event-date" id="eventDate"></p>
            <div class="event-details" id="eventDetails"></div>
            <div class="modal-buttons">
                <button class="close-btn" onclick="closeEventModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script type="module">
        // Import Unified Auth System
        import '../js/rhythm-unified-auth.js';

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const bookedDatesRef = db.ref('bookings/bookedDates');
        const specialEventsRef = db.ref('bookings/specialEvents');

        // State
        let currentDate = new Date();
        let bookedDates = new Map();
        let specialEvents = new Map();
        let currentUser = null;
        let selectedDate = null;

        // Check authentication
        async function checkAuth() {
            // Wait for auth to initialize
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (!window.rhythmAuth?.isInitialized) {
                console.error('Auth system not initialized');
                window.location.href = '../login.html';
                return;
            }

            const authResult = await window.rhythmAuth.checkAuthentication();
            
            if (!authResult.isAuthenticated) {
                console.log('User not authenticated, redirecting to login');
                window.location.href = '../login.html';
                return;
            }

            currentUser = authResult.user;
            console.log('User authenticated:', currentUser.fullName);
            initCalendar();
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkAuth);
        } else {
            checkAuth();
        }

        function initCalendar() {
            // Listen for booked dates
            bookedDatesRef.on('value', (snapshot) => {
                bookedDates.clear();
                const data = snapshot.val();
                if (data) {
                    Object.entries(data).forEach(([key, value]) => {
                        if (typeof value === 'string') {
                            bookedDates.set(value, key);
                        } else if (value && value.date) {
                            bookedDates.set(value.date, key);
                            // Store description for member view
                            if (value.description) {
                                bookedDates.set(value.date + '_desc', value.description);
                            }
                        }
                    });
                }
                renderCalendar();
            });

            // Listen for special events
            specialEventsRef.on('value', (snapshot) => {
                specialEvents.clear();
                const data = snapshot.val();
                if (data) {
                    Object.entries(data).forEach(([key, event]) => {
                        specialEvents.set(event.date, {key, details: event.details});
                    });
                }
                renderCalendar();
            });
        }

        // Render calendar
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            if (!grid) return;

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month/year display
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;

            // Calculate calendar days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const today = new Date();
            const todayStr = formatDate(today);

            let html = '';

            // Previous month's trailing days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                html += `<div class="calendar-day other-month">${day}</div>`;
            }

            // Current month's days
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dateStr = formatDate(date);
                
                let classes = ['calendar-day'];
                let indicator = '';
                
                if (dateStr === todayStr) {
                    classes.push('today');
                }
                
                if (specialEvents.has(dateStr)) {
                    classes.push('special-event');
                    indicator = '<div class="event-indicator"></div>';
                } else if (bookedDates.has(dateStr)) {
                    classes.push('booked');
                }
                
                html += `
                    <div class="${classes.join(' ')}" onclick="viewEvent('${dateStr}')">
                        ${day}
                        ${indicator}
                    </div>
                `;
            }

            // Next month's leading days
            const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
            const remainingCells = totalCells - (firstDay + daysInMonth);
            for (let day = 1; day <= remainingCells; day++) {
                html += `<div class="calendar-day other-month">${day}</div>`;
            }

            grid.innerHTML = html;
        }

        // View event details
        window.viewEvent = function(dateStr) {
            selectedDate = dateStr;
            const modal = document.getElementById('eventModal');
            const eventDateElem = document.getElementById('eventDate');
            const eventDetailsElem = document.getElementById('eventDetails');
            const modalTitle = document.getElementById('modalTitle');

            // Format date for display
            const [year, month, day] = dateStr.split('-');
            const date = new Date(year, month - 1, day);
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            eventDateElem.textContent = `${monthNames[date.getMonth()]} ${day}, ${year}`;

            // Show event details
            if (specialEvents.has(dateStr)) {
                modalTitle.textContent = '✨ Special Event';
                eventDetailsElem.textContent = specialEvents.get(dateStr).details;
                modal.classList.add('active');
            } else if (bookedDates.has(dateStr)) {
                modalTitle.textContent = '📅 Booked Date';
                const description = bookedDates.get(dateStr + '_desc');
                if (description) {
                    eventDetailsElem.textContent = description;
                } else {
                    eventDetailsElem.textContent = 'This date is booked. Contact admin for more details.';
                }
                modal.classList.add('active');
            }
        }

        window.closeEventModal = function() {
            const modal = document.getElementById('eventModal');
            modal.classList.remove('active');
            selectedDate = null;
        }

        // Navigation
        window.previousMonth = function() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        window.nextMonth = function() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        // Helper function
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('eventModal');
            if (e.target === modal) {
                closeEventModal();
            }
        });
    </script>
</body>
</html>
