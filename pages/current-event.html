<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Event - Rhythm Boduberu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        h1 {
            color: #f5d000;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .no-event {
            background: rgba(31, 31, 31, 0.95);
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            color: #aaa;
            border: 2px solid rgba(245, 208, 0, 0.3);
        }

        .no-event h2 {
            color: #f5d000;
            margin-bottom: 15px;
        }

        .event-container {
            background: rgba(31, 31, 31, 0.95);
            border-radius: 20px;
            padding: 40px;
            border: 2px solid rgba(245, 208, 0, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .event-title {
            color: #f5d000;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .event-description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .event-details {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #f5d000;
        }

        .detail-label {
            color: #f5d000;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #fff;
            font-size: 1.2rem;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid rgba(245, 208, 0, 0.3);
        }

        .kits-section {
            margin-bottom: 40px;
        }

        .kits-section h3 {
            color: #f5d000;
            margin-bottom: 15px;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .kit-card {
            background: rgba(245, 208, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid rgba(245, 208, 0, 0.3);
        }

        .kit-card .kit-emoji {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .kit-card .kit-name {
            color: #f5d000;
            font-weight: 600;
        }

        .attendance-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgba(245, 208, 0, 0.3);
        }

        .attendance-section h3 {
            color: #f5d000;
            margin-bottom: 20px;
        }

        .attendance-status {
            background: rgba(76, 175, 80, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
        }

        .attendance-status.not-attending {
            background: rgba(244, 67, 54, 0.1);
            border-left-color: #f44336;
        }

        .attendance-status.maybe {
            background: rgba(255, 193, 7, 0.1);
            border-left-color: #ffc107;
        }

        .attendance-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .attendance-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-attending {
            background: #4caf50;
            color: white;
        }

        .btn-attending:hover {
            background: #45a049;
        }

        .btn-not-attending {
            background: #f44336;
            color: white;
        }

        .btn-not-attending:hover {
            background: #da190b;
        }

        .btn-maybe {
            background: #ffc107;
            color: #1a1a1a;
        }

        .btn-maybe:hover {
            background: #ffb300;
        }

        .reason-section {
            display: none;
            margin-top: 20px;
        }

        .reason-section.active {
            display: block;
        }

        .reason-section textarea {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(245, 208, 0, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            min-height: 120px;
            margin-bottom: 15px;
        }

        .reason-section textarea:focus {
            outline: none;
            border-color: #f5d000;
        }

        .submit-btn {
            background: #f5d000;
            color: #1a1a1a;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: #ffd700;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .attendance-buttons {
                flex-direction: column;
            }
            
            .kits-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../login.html" class="back-button">← Back</a>
        
        <h1>📅 Current Event</h1>
        
        <div id="noEventMessage" class="no-event" style="display: none;">
            <h2>No Active Event</h2>
            <p>There are no events scheduled at the moment. Check back later!</p>
        </div>
        
        <div id="eventContent" style="display: none;">
            <div class="event-container">
                <h2 class="event-title" id="eventTitle"></h2>
                <p class="event-description" id="eventDescription"></p>
                
                <div class="event-details">
                    <div class="detail-item">
                        <div class="detail-label">📅 Date</div>
                        <div class="detail-value" id="eventDate"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">🕐 Time</div>
                        <div class="detail-value" id="eventTime"></div>
                    </div>
                </div>
                
                <div id="map"></div>
                
                <div class="kits-section">
                    <h3>🥁 Required Kits</h3>
                    <div class="kits-grid" id="kitsGrid">
                        <!-- Kits will be populated here -->
                    </div>
                </div>
                
                <div class="attendance-section">
                    <h3>Your Attendance</h3>
                    
                    <div id="currentStatus" style="display: none;"></div>
                    
                    <div class="attendance-buttons">
                        <button class="btn-attending" onclick="selectAttendance('attending')">✓ I'm Attending</button>
                        <button class="btn-maybe" onclick="selectAttendance('maybe')">? Maybe</button>
                        <button class="btn-not-attending" onclick="selectAttendance('not-attending')">✗ Can't Attend</button>
                    </div>
                    
                    <div class="reason-section" id="reasonSection">
                        <label style="color: #f5d000; margin-bottom: 10px; display: block; font-weight: 600;">
                            Please provide a reason:
                        </label>
                        <textarea id="reasonText" placeholder="Why can't you attend?"></textarea>
                        <button class="submit-btn" onclick="submitAttendance()">Submit Response</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus&callback=initMap" async defer></script>

    <script type="module">
        // Import Unified Auth System
        import '../js/rhythm-unified-auth.js';

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const activeEventRef = db.ref('events/activeEvent');
        const eventsRef = db.ref('events/currentEvents');
        const kitsRef = db.ref('kits/inventory');

        let map, marker;
        let currentUser = null;
        let currentEventId = null;
        let selectedAttendanceStatus = null;
        let availableKits = [];

        // Initialize Google Maps
        window.initMap = function() {
            const maleLocation = { lat: 4.1755, lng: 73.5093 };
            map = new google.maps.Map(document.getElementById('map'), {
                center: maleLocation,
                zoom: 13
            });
        };

        // Check authentication
        async function checkAuth() {
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (!window.rhythmAuth?.isInitialized) {
                window.location.href = '../login.html';
                return;
            }

            const authResult = await window.rhythmAuth.checkAuthentication();
            
            if (!authResult.isAuthenticated) {
                window.location.href = '../login.html';
                return;
            }

            currentUser = authResult.user;
            console.log('User authenticated:', currentUser.fullName);
            loadActiveEvent();
        }

        // Load kits
        function loadKits() {
            kitsRef.once('value', (snapshot) => {
                availableKits = [];
                const kitsData = snapshot.val();
                if (kitsData) {
                    Object.entries(kitsData).forEach(([id, kit]) => {
                        availableKits.push({ id, name: kit.name });
                    });
                }
            });
        }

        // Load active event
        function loadActiveEvent() {
            activeEventRef.on('value', (snapshot) => {
                currentEventId = snapshot.val();
                
                if (!currentEventId) {
                    showNoEvent();
                    return;
                }
                
                eventsRef.child(currentEventId).on('value', (eventSnapshot) => {
                    const event = eventSnapshot.val();
                    if (event) {
                        displayEvent(event);
                        loadUserAttendance();
                    } else {
                        showNoEvent();
                    }
                });
            });
        }

        function showNoEvent() {
            document.getElementById('noEventMessage').style.display = 'block';
            document.getElementById('eventContent').style.display = 'none';
        }

        function displayEvent(event) {
            document.getElementById('noEventMessage').style.display = 'none';
            document.getElementById('eventContent').style.display = 'block';
            
            document.getElementById('eventTitle').textContent = event.title;
            document.getElementById('eventDescription').textContent = event.description || '';
            document.getElementById('eventDate').textContent = formatDate(event.date);
            document.getElementById('eventTime').textContent = formatTime(event.time);
            
            // Display location on map
            if (event.location && map) {
                const location = new google.maps.LatLng(event.location.lat, event.location.lng);
                map.setCenter(location);
                map.setZoom(15);
                
                if (marker) marker.setMap(null);
                marker = new google.maps.Marker({
                    position: location,
                    map: map,
                    title: event.title
                });
            }
            
            // Display kits
            displayKits(event.selectedKits || []);
        }

        function displayKits(kitIds) {
            const grid = document.getElementById('kitsGrid');
            grid.innerHTML = '';
            
            if (kitIds.length === 0) {
                grid.innerHTML = '<p style="color: #aaa;">No specific kits required</p>';
                return;
            }
            
            kitIds.forEach(kitId => {
                const kit = availableKits.find(k => k.id === kitId);
                const kitName = kit ? kit.name : kitId;
                
                const card = document.createElement('div');
                card.className = 'kit-card';
                card.innerHTML = `
                    <div class="kit-emoji">🥁</div>
                    <div class="kit-name">${kitName}</div>
                `;
                grid.appendChild(card);
            });
        }

        function loadUserAttendance() {
            if (!currentEventId || !currentUser) return;
            
            const attendanceRef = db.ref(`events/currentEvents/${currentEventId}/attendance/${currentUser.id}`);
            attendanceRef.on('value', (snapshot) => {
                const attendance = snapshot.val();
                if (attendance) {
                    displayCurrentStatus(attendance);
                }
            });
        }

        function displayCurrentStatus(attendance) {
            const statusDiv = document.getElementById('currentStatus');
            statusDiv.style.display = 'block';
            
            let statusClass = 'attendance-status';
            let statusText = '';
            
            if (attendance.status === 'attending') {
                statusText = '✓ You marked as attending';
            } else if (attendance.status === 'not-attending') {
                statusClass += ' not-attending';
                statusText = `✗ You can't attend - Reason: ${attendance.reason || 'No reason provided'}`;
            } else if (attendance.status === 'maybe') {
                statusClass += ' maybe';
                statusText = '? You marked as maybe';
            }
            
            statusDiv.className = statusClass;
            statusDiv.textContent = statusText;
        }

        window.selectAttendance = function(status) {
            selectedAttendanceStatus = status;
            
            if (status === 'not-attending') {
                document.getElementById('reasonSection').classList.add('active');
            } else {
                document.getElementById('reasonSection').classList.remove('active');
                submitAttendance();
            }
        };

        window.submitAttendance = async function() {
            if (!currentEventId || !currentUser || !selectedAttendanceStatus) return;
            
            const attendanceData = {
                status: selectedAttendanceStatus,
                userId: currentUser.id,
                userName: currentUser.fullName,
                timestamp: Date.now()
            };
            
            if (selectedAttendanceStatus === 'not-attending') {
                const reason = document.getElementById('reasonText').value.trim();
                if (!reason) {
                    alert('Please provide a reason for not attending');
                    return;
                }
                attendanceData.reason = reason;
            }
            
            try {
                const attendanceRef = db.ref(`events/currentEvents/${currentEventId}/attendance/${currentUser.id}`);
                await attendanceRef.set(attendanceData);
                
                alert('Your attendance response has been submitted!');
                document.getElementById('reasonSection').classList.remove('active');
                document.getElementById('reasonText').value = '';
            } catch (error) {
                console.error('Error submitting attendance:', error);
                alert('Failed to submit attendance');
            }
        };

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function formatTime(timeStr) {
            const [hours, minutes] = timeStr.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${minutes} ${ampm}`;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadKits();
            checkAuth();
        });
    </script>
</body>
</html>
