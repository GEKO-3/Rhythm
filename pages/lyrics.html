  <script>
    // Hidden online update mechanism - forces cache refresh when online
    (() => {
      let isOnline = navigator.onLine;
      let updateCheckInterval;
      
      function forceUpdateWhenOnline() {
        if (navigator.onLine && !isOnline) {
          console.log('🌐 Network restored - checking for updates...');
          
          if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'FORCE_UPDATE_CHECK' });
          }
          
          const criticalFiles = [
            '../js/rhythm-unified-auth.js',
            '../js/rhythm-local-db.js',
            '../js/firebase-db-optimized.js'
          ];
          
          criticalFiles.forEach(file => {
            fetch(file + '?v=2.1&bust=' + Date.now(), { cache: 'reload' })
              .catch(() => {});
          });
          
          const staleKeys = Object.keys(localStorage).filter(key => 
            key.includes('_temp_') || key.includes('_cached_')
          );
          staleKeys.forEach(key => localStorage.removeItem(key));
        }
        isOnline = navigator.onLine;
      }

      window.addEventListener('online', forceUpdateWhenOnline);
      window.addEventListener('offline', () => { isOnline = false; });
      
      if (navigator.onLine) {
        updateCheckInterval = setInterval(() => {
          if (navigator.onLine && 'serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(registration => {
              registration.update().catch(() => {});
            });
          }
        }, 120000);
      }
    })();

    // Prevent zoom with keyboard (Ctrl/Cmd + +/-/0) and mouse wheel
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (
        e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0'
      )) {
        e.preventDefault();
      }
    });
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });
    // Prevent double-tap zoom on mobile
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 350) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
    // Prevent pinch-zoom and gesture events on iOS/Safari
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gesturechange', function(e) {
      e.preventDefault();
    });
    document.addEventListener('gestureend', function(e) {
      e.preventDefault();
    });

    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(`../js/sw.js?v=2.1.1`, { updateViaCache: 'none' })
          .then(async (registration) => {
            console.log('✅ [ServiceWorker] Registered successfully:', registration.scope);
            
            // Force update check
            registration.addEventListener('updatefound', () => {
              console.log('🔄 [ServiceWorker] Update found, installing new version');
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('🚀 [ServiceWorker] New version installed, refreshing page...');
                  // Auto-refresh after a short delay to apply updates
                  setTimeout(() => {
                    window.location.reload(true);
                  }, 1500);
                }
              });
            });
            
            // Check for updates immediately and periodically
            registration.update();
            
            // Check for updates every 60 seconds
            setInterval(() => {
              registration.update().catch(error => {
                console.warn('⚠️ [ServiceWorker] Update check failed:', error.message);
              });
            }, 60000);
            
            // Add developer utility for cache clearing
            window.clearAppCache = function() {
              if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
                console.log('🧹 Clearing app cache...');
              } else {
                console.log('⚠️ No service worker controller available');
              }
            };
            
            // Listen for service worker messages
            navigator.serviceWorker.addEventListener('message', (event) => {
              if (event.data && event.data.type === 'CACHE_CLEARED') {
                console.log('✅ Cache cleared! Reload the page to see changes.');
                console.log('💡 You can also run clearAppCache() in console to clear cache anytime');
              } else if (event.data && event.data.type === 'SW_UPDATED') {
                console.log(`🎉 Service Worker updated to v${event.data.version} at ${event.data.timestamp}`);
                console.log('ℹ️ Authentication cache preserved to maintain device ID');
              } else if (event.data && event.data.type === 'FORCE_UPDATE_COMPLETED') {
                console.log('✅ Force update completed - fresh content will be loaded');
              }
            });
          })
          .catch((error) => {
            console.log('❌ [ServiceWorker] Registration failed:', error);
          });
      });
    }
    
  </script>

  <script>
    // Initialize unified authentication system on page load
    document.addEventListener('DOMContentLoaded', async function() {
      // 🚀 PREVENT FLASH: Make page visible once DOM is ready
      document.body.classList.add('loaded');
      
      // Initialize Firebase transliteration data (Firebase already initialized above)
      if (typeof transliterationFirebase !== 'undefined') {
        await transliterationFirebase.initialize();
      }
      
      // Initialize auth
      await initializeUnifiedAuth();
    });

    // Unified authentication system using RhythmUnifiedAuth
    async function initializeUnifiedAuth() {
      try {
        console.log('🔍 [Lyrics] Starting unified authentication...');
        const authStartTime = Date.now();
        
        // Wait for unified auth to initialize
        let attempts = 0;
        while (!window.rhythmAuth?.isInitialized && attempts < 50) {
            await new Promise(resolve => setTimeout(resolve, 50)); // Faster polling
            attempts++;
        }
        
        if (!window.rhythmAuth?.isInitialized) {
            console.error('❌ [Lyrics] Unified auth failed to initialize');
            showAccessDenied('Authentication system failed to initialize');
            return;
        }
        
        console.log(`⚡ [Lyrics] Auth init took ${Date.now() - authStartTime}ms`);
        
        // Use unified authentication check
        const authCheckStart = Date.now();
        const authResult = await window.rhythmAuth.checkAuthentication();
        console.log(`⚡ [Lyrics] Auth check took ${Date.now() - authCheckStart}ms`);
        
        if (!authResult.isAuthenticated) {
            console.log('❌ [Lyrics] User not authenticated:', authResult.reason);
            
            if (authResult.reason === 'device_mismatch') {
                showAccessDenied('Device Mismatch: This account is registered to a different device. Each user can only access from one device. Please log in from your registered device or contact admin');
            } else {
                showAccessDenied('You need to be logged in to access lyrics');
            }
            return;
        }
        
        // Check if user has lyrics permission
        if (!window.rhythmAuth.hasPermission('lyrics')) {
            console.log('❌ [Lyrics] User does not have lyrics permission');
            showAccessDenied('You do not have permission to access lyrics');
            return;
        }
        
        const user = authResult.user;
        console.log('✅ [Lyrics] Authentication successful for:', user.fullName);
        
        // Authentication successful - load the lyrics page
        const dataLoadStart = Date.now();
        await loadSongsData();
        console.log(`⚡ [Lyrics] Data loading took ${Date.now() - dataLoadStart}ms`);
        
      } catch (error) {
        console.error('❌ [Lyrics] Authentication failed:', error);
        showAccessDenied('Authentication error occurred');
      }
    }

    function showOfflineNotice(networkQuality) {
      console.log(`📱 [Lyrics] Showing offline notice for ${networkQuality} connection`);
      
      // Update existing offline indicator or create one
      let indicator = document.getElementById('offline-indicator');
      if (!indicator) {
        indicator = document.createElement('div');
        indicator.id = 'offline-indicator';
        indicator.className = 'offline-indicator';
        document.body.appendChild(indicator);
      }
      
      const messages = {
        'offline': '📴 Offline - Using cached lyrics',
        'poor': '🐌 Slow connection - Using cached lyrics'
      };
      
      indicator.textContent = messages[networkQuality] || messages['offline'];
      indicator.classList.add('show');
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        indicator.classList.remove('show');
      }, 5000);
    }
    
    async function loadSongsData() {
      try {
        // Get the selected song ID from localStorage
        const selectedSongId = localStorage.getItem('selectedSongId');
        if (!selectedSongId) {
          throw new Error('No song selected');
        }

        console.log(`🎵 [Lyrics] Loading specific song: ${selectedSongId}`);

        // 🚀 SPEED OPTIMIZATION: Check for prefetched data first
        const prefetchedDataStr = localStorage.getItem('prefetchedSongData');
        let songData = null;
        
        if (prefetchedDataStr) {
          try {
            const prefetchedData = JSON.parse(prefetchedDataStr);
            // Check if data is fresh (less than 30 seconds old) and for correct song
            const isDataFresh = (Date.now() - prefetchedData.timestamp) < 30000;
            const isCorrectSong = prefetchedData.songId === selectedSongId;
            
            if (isDataFresh && isCorrectSong) {
              songData = prefetchedData.data;
              console.log('🚀 [Lyrics] Using prefetched song data - INSTANT LOAD!');
              // Clean up prefetched data
              localStorage.removeItem('prefetchedSongData');
            }
          } catch (e) {
            console.log('⚠️ [Lyrics] Invalid prefetched data, will load from database');
            localStorage.removeItem('prefetchedSongData');
          }
        }

        // If no valid prefetched data, load from local database system
        if (!songData) {
          console.log('� [Lyrics] Loading song from local database system...');
          
          // Use local database enhanced Firebase wrapper - ensure correct instance
          let dbInitialized = false;
          
          // Check if we have a working instance
          if (window.rhythmDB && typeof window.rhythmDB.getSong === 'function' && typeof window.rhythmDB.getDetailedStatus === 'function') {
            console.log('✅ [Lyrics] Using existing working rhythmDB instance');
            dbInitialized = true;
          } else {
            console.log('🔧 [Lyrics] Need to initialize rhythmDB...');
            
            // Force reimport to ensure we get the correct class
            try {
              const module = await import(`../js/firebase-db-offline.js?t=${Date.now()}`);
              window.rhythmDB = new module.RhythmFirebaseDBOffline();
              console.log('✅ [Lyrics] Created fresh RhythmFirebaseDBOffline instance');
              dbInitialized = true;
            } catch (error) {
              console.error('❌ [Lyrics] Failed to create RhythmFirebaseDBOffline:', error);
              dbInitialized = false;
            }
          }
          
          // Verify methods exist
          if (dbInitialized && window.rhythmDB) {
            const hasGetSong = typeof window.rhythmDB.getSong === 'function';
            const hasGetDetailedStatus = typeof window.rhythmDB.getDetailedStatus === 'function';
            const hasIsSongCached = typeof window.rhythmDB.isSongCached === 'function';
            
            console.log(`🔍 [Lyrics] Method check - getSong: ${hasGetSong}, getDetailedStatus: ${hasGetDetailedStatus}, isSongCached: ${hasIsSongCached}`);
          }

          try {
            // Load the selected song with local database support
            songData = await window.rhythmDB.getSong(selectedSongId);
            console.log(`🎵 [Lyrics] Loaded song from local database: ${songData?.title || selectedSongId}`);
          } catch (error) {
            console.error(`❌ [Lyrics] Failed to load song ${selectedSongId}:`, error);
            
            // Show helpful error message based on offline status
            let offlineStatus = null;
            try {
              offlineStatus = window.rhythmDB?.getDetailedStatus?.();
            } catch (statusError) {
              console.warn('⚠️ [Lyrics] Could not get detailed status:', statusError);
            }
            
            if (offlineStatus && !offlineStatus.isOnline) {
              if (!offlineStatus.ready) {
                showSongNotFoundError('No songs cached for offline use. Please connect to the internet first to load and cache songs.');
                return;
              } else {
                showSongNotFoundError(`This song "${selectedSongId}" is not available offline. Please connect to the internet to load it, or choose a different song from the songlist.`);
                return;
              }
            }
            
            // Generic error for online mode
            showSongNotFoundError(`Failed to load song. Please check your connection and try again.`);
            return;
          }
        }
        
        if (songData) {
          // Create songs array with just the selected song
          window.songs = [{
            id: selectedSongId,
            ...songData
          }];
          console.log(`✅ [Lyrics] Song ready for display: ${songData.title || 'Unknown Title'}`);
          
          // Cache this song for offline access if we're online (handled by local database automatically)
          let status = null;
          try {
            status = window.rhythmDB?.getDetailedStatus?.();
          } catch (statusError) {
            console.warn('⚠️ [Lyrics] Could not get detailed status:', statusError);
          }
          
          if (status?.isOnline && window.rhythmDB?.isSongCached && !window.rhythmDB.isSongCached(selectedSongId)) {
            console.log(`💾 [Lyrics] Song ${selectedSongId} automatically cached by local database for offline access`);
          }
          
          // Show network status if using offline data
          if (status && !status.isOnline) {
            showOfflineNotice('offline');
          }
          
        } else {
          console.warn('❌ [Lyrics] Selected song not found');
          window.songs = [];
          throw new Error('Song not found');
        }

        // We don't need showlist for lyrics display
        window.showList = [];

        // 🎯 AUTO-GENERATE ENGLISH LYRICS using reverse transliteration
        if (window.songs && window.songs.length > 0) {
          generateEnglishLyrics();
        }

        // Initialize lyrics display
        initializeLyrics();
        
        // Show the page once everything is loaded
        document.body.classList.add('loaded');
        
      } catch (error) {
        console.error('Failed to load song data from Firebase:', error);
        // Show error message to user
        showSongNotFoundError(error.message);
        // Still show the page even if there's an error
        document.body.classList.add('loaded');
      }
    }

    // Helper functions for lyrics parsing and section management
    function slugify(text) {
      return text
        .toString()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // Remove accents
        .replace(/[^a-zA-Z0-9]+/g, '-') // Replace non-alphanum with dash
        .replace(/^-+|-+$/g, '') // Trim dashes
        .replace(/-+/g, '-') // Collapse dashes
        .toLowerCase();
    }

    function parseSections(lyrics) {
      const lines = lyrics.split('\n');
      // Store all sections in order of appearance
      let orderedSections = [];
      let htmlSections = [];
      let currentSection = null;
      let sectionType = null;
      let sectionId = null;
      let sectionName = null;
      let yellowCount = 0;
      let whiteCount = 0;

      function pushSection() {
        if (currentSection) {
          htmlSections.push(
            `<div class="section-block" id="${sectionId}">${currentSection.join('<br>')}</div>`
          );
          orderedSections.push({ name: sectionName, id: sectionId, type: sectionType });
        }
      }

      function highlightAmpersandParts(line, highlightColor) {
        // Replace &...& with span of highlightColor
        return line.replace(/&([^&]+)&/g, (match, p1) => {
          return `<span style=\"color: ${highlightColor};\">${p1}</span>`;
        });
      }

      lines.forEach((line, idx) => {
        if (line.startsWith('#')) {
          pushSection();
          sectionName = line.replace(/^#+/, '').trim();
          sectionId = 'section-yellow-' + slugify(sectionName) + '-' + yellowCount;
          currentSection = [];
          sectionType = 'yellow';
          yellowCount++;
        } else if (line.startsWith('$')) {
          pushSection();
          sectionName = line.replace(/^\$+/, '').trim();
          sectionId = 'section-white-' + slugify(sectionName) + '-' + whiteCount;
          currentSection = [];
          sectionType = 'white';
          whiteCount++;
        } else if (line.startsWith('-')) {
          pushSection();
          htmlSections.push('<div class="break-line"></div>');
          currentSection = null;
        } else {
          if (!currentSection) {
            // If lyrics start without a section, wrap in a default section
            sectionName = 'Lyrics';
            sectionId = 'section-yellow-default-0';
            currentSection = [];
            sectionType = 'yellow';
            yellowCount++;
          }
          if (line.startsWith('*')) {
            // Highlighted line: *text
            let content = line.slice(1);
            content = highlightAmpersandParts(content, '#FFFFFF');
            currentSection.push(`<span class=\"highlight-line\">${content}</span>`);
          } else {
            let content = highlightAmpersandParts(line, '#f5d000');
            currentSection.push(`<span>${content}</span>`);
          }
        }
      });
      pushSection();
      return { html: htmlSections.join(''), orderedSections };
    }

    function renderSectionButtons(orderedSections) {
      window.sectionNavBar.innerHTML = '';
      orderedSections.forEach((section) => {
        const btn = document.createElement('button');
        btn.textContent = section.name;
        btn.className = section.type === 'yellow' ? 'yellow-btn' : 'white-btn';
        btn.onclick = function() {
          const sectionElem = document.getElementById(section.id);
          if (sectionElem) {
            // 🚀 PERFORMANCE: Use requestAnimationFrame for smooth animation
            requestAnimationFrame(() => {
              // Calculate the position 20px from top
              const elementPosition = sectionElem.getBoundingClientRect().top + window.pageYOffset;
              const offsetPosition = elementPosition - 80;
              
              window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
              });
              
              // Flash effect
              sectionElem.classList.add('flash');
              btn.classList.add('flash');
            });
            
            setTimeout(() => {
              sectionElem.classList.remove('flash');
              btn.classList.remove('flash');
            }, 350);
          }
          // Remove active from all buttons of the same type
          requestAnimationFrame(() => {
            window.sectionNavBar.querySelectorAll('.' + btn.className).forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          });
        };
        window.sectionNavBar.appendChild(btn);
      });
    }

    function createSectionOverlays(orderedSections) {
      // Remove existing overlays
      document.querySelectorAll('.section-name-overlay').forEach(overlay => overlay.remove());
      
      // Create new overlays for each section
      orderedSections.forEach(section => {
        const sectionElement = document.getElementById(section.id);
        if (sectionElement) {
          const overlay = document.createElement('div');
          overlay.className = `section-name-overlay ${window.currentLanguage === 'english' ? 'english' : ''}`;
          overlay.textContent = section.name;
          
          // Position overlay relative to the section
          overlay.style.top = (sectionElement.offsetTop) + 'px';
          overlay.style.left = window.currentLanguage === 'english' ? 'auto' : (sectionElement.offsetLeft) + 'px';
          overlay.style.right = window.currentLanguage === 'english' ? (sectionElement.offsetParent.offsetWidth - sectionElement.offsetLeft - sectionElement.offsetWidth) + 'px' : 'auto';
          
          sectionElement.offsetParent.appendChild(overlay);
        }
      });
    }
    
    // 🔤 CAPITALIZE first letter of each line function
    function capitalizeFirstLetterOfEachLine(text) {
      if (!text || typeof text !== 'string') {
        return text;
      }
      
      // Split by line breaks (handle different line ending types)
      const lines = text.split(/\r?\n/);
      
      // Process each line
      const capitalizedLines = lines.map(line => {
        // Trim whitespace to find the first actual character
        const trimmed = line.trim();
        if (!trimmed) {
          return line; // Keep empty lines as-is
        }
        
        // Find the first letter in the line (skip non-letter characters)
        let firstLetterIndex = 0;
        while (firstLetterIndex < line.length && !/[a-zA-Z]/.test(line[firstLetterIndex])) {
          firstLetterIndex++;
        }
        
        // If we found a letter, capitalize it
        if (firstLetterIndex < line.length) {
          return line.substring(0, firstLetterIndex) + 
                 line[firstLetterIndex].toUpperCase() + 
                 line.substring(firstLetterIndex + 1);
        }
        
        return line; // No letters found, return as-is
      });
      
      return capitalizedLines.join('\n');
    }
    
    // 🎯 AUTO-GENERATE ENGLISH LYRICS Function
    function generateEnglishLyrics() {
      console.log('🔤 Auto-generating English lyrics using reverse transliteration...');
      
      window.songs.forEach(song => {
        // Skip if song already has English lyrics
        if (song.englishLyrics && song.englishLyrics.trim()) {
          console.log(`✅ Song "${song.name}" already has English lyrics, skipping auto-generation`);
          return;
        }
        
        // Skip if no Dhivehi lyrics to transliterate
        if (!song.lyrics || !song.lyrics.trim()) {
          console.log(`⚠️ Song "${song.name}" has no Dhivehi lyrics to transliterate`);
          return;
        }
        
        try {
          // Use the reverse transliteration function
          let englishLyrics = window.reverseTransliterate(song.lyrics);
          
          // 🔤 CAPITALIZE first letter of every line
          englishLyrics = capitalizeFirstLetterOfEachLine(englishLyrics);
          
          // Add the generated English lyrics to the song object
          song.englishLyrics = englishLyrics;
          
          console.log(`🎉 Auto-generated English lyrics for "${song.name}"`);
          console.log(`Original (first 100 chars): ${song.lyrics.substring(0, 100)}...`);
          console.log(`Generated (first 100 chars): ${englishLyrics.substring(0, 100)}...`);
          
        } catch (error) {
          console.error(`❌ Failed to generate English lyrics for "${song.name}":`, error);
        }
      });
      
      // Enable English toggle now that we have generated lyrics
      window.englishAvailable = true;
      console.log('🌐 English lyrics auto-generation complete! Toggle is now available.');
    }
    
    function initializeLyrics() {
    // 🚀 PERFORMANCE: Cache DOM elements to avoid repeated queries
    if (!window.LYRICS_ELEMENTS) {
      window.LYRICS_ELEMENTS = {
        songTitle: document.getElementById('song-title'),
        songLyrics: document.getElementById('song-lyrics'),
        lyricsTemplate: document.getElementById('lyrics-template'),
        sectionNavBar: document.getElementById('section-nav-bar'),
        languageToggle: document.getElementById('language-toggle'),
        toggleSlider: document.getElementById('toggle-slider')
      };
    }

    const { songTitle, songLyrics, lyricsTemplate, sectionNavBar, languageToggle, toggleSlider } = window.LYRICS_ELEMENTS;
    const selectedId = localStorage.getItem('selectedSongId');
    const song = window.songs.find(s => String(s.id) === String(selectedId));
    
    let currentLanguage = 'dhivehi'; // Default to Dhivehi
    let englishAvailable = true;
    
    // Make these variables global so they can be accessed by the toggle function
    window.currentSong = song;
    window.currentLanguage = currentLanguage;
    window.englishAvailable = englishAvailable;
    window.sectionNavBar = sectionNavBar;
    window.toggleSlider = toggleSlider;
    window.songLyrics = songLyrics;
    window.lyricsTemplate = lyricsTemplate;
    
    function switchLanguage(language) {
      if (language === 'english' && !window.englishAvailable) {
        return; // Don't switch if no English lyrics available
      }
      
      window.currentLanguage = language;
      
      // Update toggle slider
      if (language === 'english') {
        window.toggleSlider.classList.add('english');
        window.toggleSlider.textContent = 'English';
        window.toggleSlider.style.fontFamily = "'Montserrat', 'SF-Pro', Arial, sans-serif";
        // Move section nav bar to right
        window.sectionNavBar.classList.add('english');
      } else {
        window.toggleSlider.classList.remove('english');
        window.toggleSlider.textContent = 'ދިވެހި';
        window.toggleSlider.style.fontFamily = "'Faruma', 'MV Elaaf Normal', 'Faruma Regular', 'Faruma Medium', 'Noto Sans Thaana', 'Thaana Unicode', Arial, sans-serif";
        // Move section nav bar to left
        window.sectionNavBar.classList.remove('english');
      }
      
      // Update lyrics display
      const lyrics = language === 'dhivehi' ? window.currentSong.lyrics : window.currentSong.englishLyrics;
      const { html, orderedSections } = parseSections(lyrics);
      window.songLyrics.innerHTML = html;
      
      // Update text direction and font
      if (language === 'english') {
        window.lyricsTemplate.style.direction = 'ltr';
        window.lyricsTemplate.style.textAlign = 'left';
        window.lyricsTemplate.style.fontFamily = "'Montserrat', 'SF-Pro', Arial, sans-serif";
      } else {
        window.lyricsTemplate.style.direction = 'rtl';
        window.lyricsTemplate.style.textAlign = 'right';
        window.lyricsTemplate.style.fontFamily = "'Faruma', 'MV Elaaf Normal', 'Faruma Regular', 'Faruma Medium', 'Noto Sans Thaana', 'Thaana Unicode', Arial, sans-serif";
      }
      
      // Update navigation buttons
      renderSectionButtons(orderedSections);
      
      // Create section overlays
      // 🚀 PERFORMANCE: Use requestAnimationFrame to avoid blocking main thread
      requestAnimationFrame(() => createSectionOverlays(orderedSections));
    }
    
    // Make switchLanguage global
    window.switchLanguage = switchLanguage;

    if (song) {
      songTitle.textContent = song.name;
      
      // Check if English lyrics are available
      englishAvailable = song.englishLyrics && song.englishLyrics.trim() !== '';
      window.englishAvailable = englishAvailable;
      
      if (!englishAvailable) {
        languageToggle.classList.add('disabled');
        languageToggle.title = 'English lyrics not available';
      } else {
        languageToggle.classList.remove('disabled');
        languageToggle.title = '';
      }
      
      // Load Dhivehi lyrics by default
      const { html, orderedSections } = parseSections(song.lyrics);
      songLyrics.innerHTML = html;
      lyricsTemplate.style.display = 'block';
      
      // Render section buttons
      renderSectionButtons(orderedSections);
      
      // Create section overlays
      setTimeout(() => createSectionOverlays(orderedSections), 100);
    } else {
      songTitle.textContent = 'Error: Song not found.';
      songLyrics.textContent = 'Error: Lyrics not found.';
      lyricsTemplate.style.display = 'block';
      
      // Disable toggle if song not found
      languageToggle.classList.add('disabled');
      englishAvailable = false;
      window.englishAvailable = false;
    }
    } // Close initializeLyrics function
    
    // Global toggle function that can be called from HTML
    function toggleLanguage() {
      if (!window.englishAvailable) return; // Don't toggle if English not available
      
      if (window.currentLanguage === 'dhivehi') {
        window.switchLanguage('english');
      } else {
        window.switchLanguage('dhivehi');
      }
    }
