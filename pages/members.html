<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Members - Boduberu Group</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicons/icons-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/favicons/icons-512.png">
    <link rel="manifest" href="../assets/favicons/manifest.webmanifest">
    
    <!-- Font definitions -->
    <style>
        @font-face {
            font-family: 'Faruma';
            src: url('../assets/Fonts/Faruma.ttf') format('truetype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Montserrat';
            src: url('../assets/Fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }
    </style>
    
    <style>
        :root {
            --primary-color: #f5d000;
            --primary-hover: #fced98;
            --primary-dark: #E6B800;
            --bg-color: #1f1f1f;
            --bg-light: #2b2b2b;
            --bg-card: #2d2d2d;
            --text-light: #ffffff;
            --text-muted: #cccccc;
            --text-dark: #2b2b2b;
            --success-color: #4CAF50;
            --error-color: #f44336;
            --border-radius: 12px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --backdrop: rgba(31, 31, 31, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'SF-Pro', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #1a1a1a 100%);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-light), var(--bg-color));
            padding: 20px 0;
            border-bottom: 2px solid var(--primary-color);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-section img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--primary-color);
        }

        .logo-text h1 {
            color: var(--primary-color);
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .logo-text p {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            background: var(--bg-color);
            border: 2px solid rgba(245, 208, 0, 0.2);
            border-radius: 25px;
            padding: 10px 20px 10px 45px;
            color: var(--text-light);
            width: 250px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(245, 208, 0, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            color: var(--text-dark);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            color: var(--primary-color);
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 1.2em;
        }

        /* Members Grid */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .member-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(245, 208, 0, 0.1);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .member-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-dark));
            transform: scaleX(0);
            transition: var(--transition);
        }

        .member-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
        }

        .member-card:hover::before {
            transform: scaleX(1);
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            object-fit: cover;
            transition: var(--transition);
        }

        .member-card:hover .member-avatar {
            transform: scale(1.05);
            border-color: var(--primary-hover);
        }

        .member-basic-info h3 {
            color: var(--primary-color);
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .member-role {
            color: var(--text-muted);
            font-size: 0.95em;
            margin-bottom: 5px;
        }

        .member-index {
            background: rgba(245, 208, 0, 0.1);
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            display: inline-block;
        }

        .member-details {
            display: grid;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .detail-icon {
            color: var(--primary-color);
            width: 16px;
            text-align: center;
        }

        .detail-text {
            color: var(--text-muted);
        }

        .access-status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .access-status.granted {
            background: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .access-status.admin {
            background: rgba(245, 208, 0, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(245, 208, 0, 0.3);
        }

        .access-status.pending {
            background: rgba(255, 152, 0, 0.1);
            color: #ff9800;
            border: 1px solid rgba(255, 152, 0, 0.2);
        }

        .access-status.denied {
            background: rgba(244, 67, 54, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(244, 67, 54, 0.2);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        /* Loading States */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            flex-direction: column;
            gap: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(245, 208, 0, 0.2);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        /* Filter and Sort */
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-select {
            background: var(--bg-card);
            border: 2px solid rgba(245, 208, 0, 0.2);
            border-radius: 8px;
            padding: 10px 15px;
            color: var(--text-light);
            font-size: 0.9em;
            transition: var(--transition);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            .header-actions {
                flex-direction: column;
                width: 100%;
            }

            .search-input {
                width: 100%;
            }

            .page-title h1 {
                font-size: 2.2em;
            }

            .members-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .member-header {
                flex-direction: column;
                text-align: center;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 20px 15px;
            }

            .member-card {
                padding: 20px;
            }

            .page-title h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <img src="../src/Logo.png" alt="Rhythm Logo">
                <div class="logo-text">
                    <h1>Rhythm Members</h1>
                    <p>Boduberu Group</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" 
                           placeholder="Search members..." />
                    <span class="search-icon">🔍</span>
                </div>
                <a href="admin/member-input.html" class="nav-btn">⚙️ Admin</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <div class="page-title">
            <h1>Our Members</h1>
            <p>Meet the talented artists of Rhythm Boduberu</p>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="filter-group">
                <label for="roleFilter" style="color: var(--primary-color); font-weight: 600;">Filter by Role:</label>
                <select id="roleFilter" class="filter-select">
                    <option value="">All Roles</option>
                    <option value="Lead Vocalist">Lead Vocalist</option>
                    <option value="Back Vocalist">Back Vocalist</option>
                    <option value="Drummer">Drummer</option>
                    <option value="Instrumentalist">Instrumentalist</option>
                    <option value="Media">Media</option>
                    <option value="Dancer">Dancer</option>
                </select>
            </div>
        </div>

        <!-- Members Grid -->
        <div id="membersContainer">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p style="color: var(--text-muted);">Loading members...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/members-data.js"></script>
    <script type="module" src="../js/rhythm-unified-auth.js"></script>
    <script type="module" src="../js/rhythm-notifications.js"></script>
    
    <script>
        let allMembers = [];
        let filteredMembers = [];

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
            setupEventListeners();
            initializeAndLoadMembers();
        });

        async function initializeAndLoadMembers() {
            try {
                // Wait for MembersData to be available
                if (typeof window.MembersData === 'undefined') {
                    console.log('🔄 Waiting for MembersData class...');
                    setTimeout(initializeAndLoadMembers, 200);
                    return;
                }

                // Wait for membersData instance to be ready
                if (typeof window.membersData === 'undefined' || !window.membersData.isFirebaseReady) {
                    console.log('🔄 Waiting for Firebase to initialize...');
                    setTimeout(initializeAndLoadMembers, 200);
                    return;
                }

                // Now load the members
                await loadMembers();
            } catch (error) {
                console.error('❌ Error in initialization:', error);
                setTimeout(initializeAndLoadMembers, 1000); // Retry after 1 second
            }
        }

        function initializePage() {
            console.log('🎵 Rhythm Members page initialized');
        }

        function setupEventListeners() {
            // Search functionality
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', debounce(handleSearch, 300));

            // Filter functionality
            document.getElementById('roleFilter').addEventListener('change', applyFilters);
        }

        async function loadMembers() {
            try {
                console.log('📊 Loading members data...');
                
                const membersData = await window.membersData.getAllMembersWithUserStatus();
                allMembers = Object.values(membersData); // Convert object to array
                console.log(`✅ Loaded ${allMembers.length} members with user status`);
                
                filteredMembers = [...allMembers];
                applyFilters(); // Apply sorting and filters
                
            } catch (error) {
                console.error('❌ Error loading members:', error);
                showErrorState();
            }
        }

        function renderMembers() {
            const container = document.getElementById('membersContainer');
            
            if (filteredMembers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Members Found</h3>
                        <p>No members match your current search and filter criteria.</p>
                    </div>
                `;
                return;
            }

            const membersHTML = filteredMembers.map(member => createMemberCard(member)).join('');
            
            container.innerHTML = `
                <div class="members-grid">
                    ${membersHTML}
                </div>
            `;
        }

        function createMemberCard(member) {
            const photoSrc = member.photoPath ? `../${member.photoPath}` : '../src/Logo.png';
            
            return `
                <div class="member-card" onclick="openMemberDetail('${member.id}')">
                    <div class="member-header">
                        <img src="${photoSrc}" alt="${member.fullName}" class="member-avatar"
                             onerror="this.src='../src/Logo.png'" />
                        <div class="member-basic-info">
                            <h3>${member.fullName}</h3>
                            <div class="member-role">${member.role}</div>
                            <span class="member-index">${member.rhythmIndexNumber}</span>
                        </div>
                    </div>
                    
                    <div class="member-details">
                        ${member.residence ? `
                            <div class="detail-item">
                                <span class="detail-icon">📍</span>
                                <span class="detail-text">${member.residence}</span>
                            </div>
                        ` : ''}
                        
                        ${member.dateOfBirth ? `
                            <div class="detail-item">
                                <span class="detail-icon">🎂</span>
                                <span class="detail-text">${formatDate(member.dateOfBirth)}</span>
                            </div>
                        ` : ''}
                        
                        ${member.contactNumber ? `
                            <div class="detail-item">
                                <span class="detail-icon">📱</span>
                                <span class="detail-text">${member.contactNumber}</span>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="access-status ${getAccessStatusClass(member)}">
                        <span class="status-indicator"></span>
                        ${getAccessStatusText(member)}
                    </div>
                </div>
            `;
        }

        function openMemberDetail(memberId) {
            // Store member ID and navigate to detail page
            localStorage.setItem('selectedMemberId', memberId);
            window.location.href = 'member-detail.html';
        }

        function getAccessStatusClass(member) {
            if (!member.userStatus) {
                return 'denied';
            }
            
            switch (member.userStatus.status) {
                case 'admin':
                    return 'admin';
                case 'user':
                    return 'granted';
                case 'pending':
                    return 'pending';
                case 'rejected':
                case 'revoked':
                    return 'denied';
                default:
                    return 'denied';
            }
        }

        function getAccessStatusText(member) {
            if (!member.userStatus) {
                return 'No App Access';
            }
            
            switch (member.userStatus.status) {
                case 'admin':
                    return '👑 Admin Access';
                case 'user':
                    return '✅ App Access';
                case 'pending':
                    return '⏳ Access Pending';
                case 'rejected':
                    return '❌ Access Rejected';
                case 'revoked':
                    return '🚫 Access Revoked';
                default:
                    return 'No App Access';
            }
        }

        function handleSearch(e) {
            const query = e.target.value.trim();
            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;
            
            // Apply filters
            filteredMembers = allMembers.filter(member => {
                // Search filter
                const matchesSearch = !searchQuery || 
                    member.fullName.toLowerCase().includes(searchQuery) ||
                    member.role.toLowerCase().includes(searchQuery) ||
                    member.residence?.toLowerCase().includes(searchQuery) ||
                    member.rhythmIndexNumber.toLowerCase().includes(searchQuery);
                
                // Role filter
                const matchesRole = !roleFilter || member.role === roleFilter;
                
                return matchesSearch && matchesRole;
            });
            
            // Apply default sorting: "Away" members at the end, others sorted by name
            filteredMembers.sort((a, b) => {
                // First, check if either member has "Away" residence
                const aIsAway = a.residence && a.residence.toLowerCase() === 'away';
                const bIsAway = b.residence && b.residence.toLowerCase() === 'away';
                
                // Debug logging
                console.log(`Sorting: ${a.fullName} (residence: "${a.residence}") vs ${b.fullName} (residence: "${b.residence}")`);
                console.log(`aIsAway: ${aIsAway}, bIsAway: ${bIsAway}`);
                
                // If one is "Away" and the other isn't, put "Away" at the end
                if (aIsAway && !bIsAway) return 1;
                if (!aIsAway && bIsAway) return -1;
                
                // If both are "Away" or both are not "Away", sort by name
                return a.fullName.localeCompare(b.fullName);
            });
            
            renderMembers();
        }

        function showErrorState() {
            const container = document.getElementById('membersContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <h3>⚠️ Error Loading Members</h3>
                    <p>Unable to load member data. Please check your connection and try again.</p>
                    <button onclick="loadMembers()" class="nav-btn" style="margin-top: 20px;">
                        🔄 Try Again
                    </button>
                </div>
            `;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
