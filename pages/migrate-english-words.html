<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrate English Words to Firebase</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        button.danger {
            background: #dc3545;
        }
        button.danger:hover {
            background: #c82333;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Migrate English Words to Firebase</h1>
        <p>This tool will migrate English words to Firebase. English words are transliterated even when they appear as part of a larger word.</p>
        <p><strong>Example:</strong> "new" → "ނިއު" will transliterate "new york" as "ނިއު ޔޯކް" and "renew" as "ރެނިއު"</p>
        
        <button onclick="migrateWords()">Start Fresh Migration</button>
        <button class="danger" onclick="clearWords()">Clear All Words</button>
        
        <div id="status"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const englishWordsRef = db.ref('transliteration/englishWords');

        // Sample English words (you can add more)
        const englishWords = [
            // Common English words that appear in Dhivehi songs
            { input: 'okay', output: 'އޯކޭ' },
            { input: 'baby', output: 'ބޭބީ' },
            { input: 'sorry', output: 'ސޮރީ' },
            { input: 'party', output: 'ޕާޓީ' },
            { input: 'love', output: 'ލަވް' },
            { input: 'new', output: 'ނިއު' },
            { input: 'york', output: 'ޔޯކް' },
            { input: 'tokyo', output: 'ޓޯކިޔޯ' }
        ];

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        async function migrateWords() {
            showStatus('Starting migration...', 'info');
            
            try {
                let count = 0;
                const total = englishWords.length;
                
                // Upload words
                for (const word of englishWords) {
                    await englishWordsRef.push(word);
                    count++;
                    
                    showStatus(`Migrated ${count} / ${total} words...`, 'info');
                }
                
                showStatus(`✓ Successfully migrated ${total} English words to Firebase!\n\nYou can now add more words using the Transliteration Manager.`, 'success');
            } catch (error) {
                showStatus(`✗ Error migrating words: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function clearWords() {
            if (!confirm('Are you sure you want to delete ALL English words from Firebase?')) {
                return;
            }
            
            showStatus('Clearing all words...', 'warning');
            
            try {
                await englishWordsRef.remove();
                showStatus('✓ All English words have been cleared from Firebase', 'success');
            } catch (error) {
                showStatus(`✗ Error clearing words: ${error.message}`, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
