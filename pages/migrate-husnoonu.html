            statusDiv.textContent = message;
            statusDiv.className = type;

        async function migratePatterns() {
            showStatus('Starting migration...', 'info');
            
            try {
                let count = 0;
                const total = husNoonuPatterns.length;
                
                // Upload patterns in batches
                for (const pattern of husNoonuPatterns) {
                    await husNoonuRef.push(pattern);
                    count++;
                    
                    if (count % 10 === 0) {
                        showStatus(`Migrated ${count} / ${total} patterns...`, 'info');
                    }
                }
                
                showStatus(`✓ Successfully migrated all ${total} husnoonu patterns to Firebase!`, 'success');
            } catch (error) {
                showStatus(`✗ Error migrating patterns: ${error.message}`, 'error');
                console.error(error);
            }

            showStatus('Clearing all patterns...', 'warning');
