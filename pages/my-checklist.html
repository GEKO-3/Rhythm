<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Checklist - Rhythm Boduberu</title>
    
    <!-- Emergency Diagnostic Script -->
    <script>
        window.rhythmLoadStages = { emergencyTimeoutSet: Date.now(), scriptsStarted: Date.now(), stages: [] };
        function logStage(stage) {
            const elapsed = Date.now() - window.rhythmLoadStages.scriptsStarted;
            console.log(`📊 [MyChecklist] ${stage} at ${elapsed}ms`);
            window.rhythmLoadStages.stages.push({ stage, time: elapsed });
        }
        logStage('Emergency script loaded');
        
        setTimeout(() => {
            if (!document.body.classList.contains('loaded')) {
                console.warn('⏰ Emergency timeout triggered');
                document.body.style.visibility = 'visible';
                document.body.style.opacity = '1';
                logStage('Emergency timeout forced visibility');
            }
        }, 500);
        
        document.addEventListener('DOMContentLoaded', () => logStage('DOMContentLoaded'));
        window.addEventListener('load', () => {
            logStage('Window load');
            console.log('📊 [MyChecklist] Timeline:', window.rhythmLoadStages);
        });
    </script>
    
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body.loaded {
            visibility: visible !important;
            opacity: 1 !important;
        }

        .checklist-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            color: #f5d000;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .checklist-item {
            background: rgba(31, 31, 31, 0.95);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .checklist-item:hover {
            border-color: #f5d000;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 208, 0, 0.2);
        }

        .checklist-item.checked {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .checkbox-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border: 3px solid #666;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .checklist-item.checked .checkbox-icon {
            border-color: #4caf50;
            background: #4caf50;
            color: #fff;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .save-section {
            text-align: center;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #333;
        }

        .save-button {
            padding: 15px 50px;
            background: #f5d000;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-button:hover {
            background: #ffd700;
            transform: scale(1.05);
        }

        .save-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: scale(1);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4caf50;
            color: #4caf50;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .checklist-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="checklist-container">
        <a href="../login.html" class="back-button">← Back to Home</a>
        
        <div class="page-header">
            <h1>Thoddoo Member's Checklist</h1>
            <p>Check items you have</p>
        </div>

        <div id="loadingMessage" class="loading">Loading checklist</div>
        
        <div id="checklistGrid" class="checklist-grid" style="display: none;"></div>

        <div class="save-section" id="saveSection" style="display: none;">
            <button class="save-button" id="saveButton">Save My Checklist</button>
            <div class="success-message" id="successMessage">
                ✓ Your checklist has been saved!
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script type="module">
        // Import Unified Auth System
        import '../js/rhythm-unified-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        
        let currentUser = null;
        let checkedItems = new Set();

        // Checklist items
        const checklistItems = [
            'Rhythm Gamees',
            'Rhythm Feyli (Grey)',
            'Red Bolufothi',
            'Black Gamees',
            'Mundu',
            'shash',
            'New White Showkit',
            'New Pink Travel Kit',
            'Challenge Travel Kit',
            'Real Jersey Kit',
            'White Shoes',
            'Black Jeans'
        ];

        // Check authentication
        async function initPage() {
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (!window.rhythmAuth?.isInitialized) {
                console.error('Auth system not initialized');
                window.location.href = '../login.html';
                return;
            }

            const authResult = await window.rhythmAuth.checkAuthentication();
            
            if (!authResult.isAuthenticated) {
                console.log('User not authenticated, redirecting to login');
                window.location.href = '../login.html';
                return;
            }

            currentUser = authResult.user;
            console.log('User authenticated:', currentUser.fullName);
            loadChecklist();
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        // Load user's checklist
        async function loadChecklist() {
            try {
                const userId = currentUser.accessCode || currentUser.uid;
                const memberId = userId.toString().startsWith('RB') ? userId : `RB${userId}`;
                
                const checklistSnapshot = await db.ref(`members/${memberId}/thoddooChecklist`).once('value');
                const checklistData = checklistSnapshot.val();
                
                if (checklistData) {
                    checkedItems = new Set(Object.values(checklistData));
                }

                renderChecklist();
                document.body.classList.add('loaded');
                
            } catch (error) {
                console.error('Error loading checklist:', error);
                document.getElementById('loadingMessage').textContent = 'Error loading checklist. Please refresh.';
                document.body.classList.add('loaded');
            }
        }

        // Render checklist
        function renderChecklist() {
            const grid = document.getElementById('checklistGrid');
            const loading = document.getElementById('loadingMessage');
            const saveSection = document.getElementById('saveSection');

            loading.style.display = 'none';
            grid.style.display = 'grid';
            saveSection.style.display = 'block';

            grid.innerHTML = '';

            checklistItems.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'checklist-item';
                const itemId = `item-${index}`;
                
                if (checkedItems.has(itemId)) {
                    itemDiv.classList.add('checked');
                }

                itemDiv.innerHTML = `
                    <div class="checkbox-icon">${checkedItems.has(itemId) ? '✓' : ''}</div>
                    <div class="item-name">${item}</div>
                `;

                itemDiv.addEventListener('click', () => {
                    if (checkedItems.has(itemId)) {
                        checkedItems.delete(itemId);
                        itemDiv.classList.remove('checked');
                        itemDiv.querySelector('.checkbox-icon').textContent = '';
                    } else {
                        checkedItems.add(itemId);
                        itemDiv.classList.add('checked');
                        itemDiv.querySelector('.checkbox-icon').textContent = '✓';
                    }
                });

                grid.appendChild(itemDiv);
            });
        }

        // Save checklist
        document.getElementById('saveButton').addEventListener('click', async () => {
            const saveButton = document.getElementById('saveButton');
            const successMessage = document.getElementById('successMessage');

            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';

            try {
                const userId = currentUser.accessCode || currentUser.uid;
                const memberId = userId.toString().startsWith('RB') ? userId : `RB${userId}`;
                
                // Clear existing checklist
                await db.ref(`members/${memberId}/thoddooChecklist`).remove();

                // Save checked items
                if (checkedItems.size > 0) {
                    const checklistObject = {};
                    checkedItems.forEach(itemId => {
                        checklistObject[itemId] = itemId;
                    });
                    await db.ref(`members/${memberId}/thoddooChecklist`).set(checklistObject);
                }

                // Show success message
                successMessage.classList.add('show');
                saveButton.textContent = 'Saved!';

                setTimeout(() => {
                    successMessage.classList.remove('show');
                    saveButton.disabled = false;
                    saveButton.textContent = 'Save My Checklist';
                }, 3000);

            } catch (error) {
                console.error('Error saving checklist:', error);
                alert('Error saving checklist. Please try again.');
                saveButton.disabled = false;
                saveButton.textContent = 'Save My Checklist';
            }
        });
    </script>
</body>
</html>
