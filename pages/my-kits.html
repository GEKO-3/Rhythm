<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kits - Rhythm Boduberu</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .kits-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-header h1 {
            color: #f5d000;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(245, 208, 0, 0.1);
            border: 2px solid #f5d000;
            color: #f5d000;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #f5d000;
            color: #1a1a1a;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kit-card {
            background: rgba(31, 31, 31, 0.95);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            overflow: hidden;
            min-height: 180px;
        }

        .kit-card:hover {
            border-color: #f5d000;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(245, 208, 0, 0.3);
        }

        .kit-card.selected {
            border-color: #f5d000;
            background: rgba(245, 208, 0, 0.1);
        }

        .kit-card.selected::before {
            content: '✓';
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f5d000;
            color: #1a1a1a;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
        }

        .kit-icon {
            width: 180px;
            min-width: 180px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .kit-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .kit-icon img.loaded {
            opacity: 1;
        }

        .kit-icon .loading-spinner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(245, 208, 0, 0.2);
            border-top-color: #f5d000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .kit-icon-emoji {
            font-size: 4rem;
        }

        .kit-content {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kit-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .kit-description {
            color: #aaa;
            font-size: 0.9rem;
        }

        .save-section {
            text-align: center;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #333;
        }

        .save-button {
            padding: 15px 50px;
            background: #f5d000;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-button:hover {
            background: #ffd700;
            transform: scale(1.05);
        }

        .save-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: scale(1);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #aaa;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4caf50;
            color: #4caf50;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .tshirt-section {
            background: rgba(31, 31, 31, 0.95);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: none;
        }

        .tshirt-section h2 {
            color: #f5d000;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .size-input-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .size-input-group label {
            color: #aaa;
            font-weight: 600;
            font-size: 1rem;
        }

        .size-input-group select {
            flex: 1;
            max-width: 300px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .size-input-group select:focus {
            outline: none;
            border-color: #f5d000;
        }

        .size-input-group select option {
            background: #1f1f1f;
            color: #fff;
        }

        @media (max-width: 768px) {
            .kits-grid {
                grid-template-columns: 1fr;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .size-input-group {
                flex-direction: column;
                align-items: flex-start;
            }

            .size-input-group select {
                width: 100%;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div class="kits-container">
        <a href="../login.html" class="back-button">← Back to Login</a>
        
        <div class="page-header">
            <h1>My Kits</h1>
            <p>Select the kits you own</p>
        </div>

        <div id="loadingMessage" class="loading">Loading kits</div>
        
        <div class="tshirt-section" id="tshirtSection">
            <h2>👕 T-Shirt Size</h2>
            <div class="size-input-group">
                <label for="tshirtSize">Your T-Shirt Size:</label>
                <select id="tshirtSize">
                    <option value="">Select Size</option>
                    <option value="XS">XS - Extra Small</option>
                    <option value="S">S - Small</option>
                    <option value="M">M - Medium</option>
                    <option value="L">L - Large</option>
                    <option value="XL">XL - Extra Large</option>
                    <option value="XXL">XXL - Double XL</option>
                    <option value="XXXL">XXXL - Triple XL</option>
                </select>
            </div>
        </div>
        
        <div id="kitsGrid" class="kits-grid" style="display: none;"></div>

        <div class="save-section" id="saveSection" style="display: none;">
            <button class="save-button" id="saveButton">Save My Kits</button>
            <div class="success-message" id="successMessage">
                ✓ Your kit selection has been saved!
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script type="module">
        // Import Unified Auth System
        import '../js/rhythm-unified-auth.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBM1r1pVGc3QVmKzQOWPJkD9N87FTEnhus",
            authDomain: "rhythm-ea7a1.firebaseapp.com",
            databaseURL: "https://rhythm-ea7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rhythm-ea7a1",
            storageBucket: "rhythm-ea7a1.firebasestorage.app",
            messagingSenderId: "776053739080",
            appId: "1:776053739080:web:bfaf1a208b117faf94927d"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        
        let currentUser = null;
        let availableKits = [];
        let selectedKits = new Set();
        let currentTshirtSize = '';

        // Kit icons mapping
        const kitIcons = {
            'Baburu Beru': '🥁',
            'Onugandu': '🔔',
            'Dhandi Beru': '🪘',
            'Kadhaa Thaali': '🎵',
            'Costume': '👕',
            'Flag': '🚩',
            'Other': '📦'
        };

        // Check authentication using unified system
        async function initPage() {
            // Wait for auth to initialize
            let attempts = 0;
            while (!window.rhythmAuth?.isInitialized && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (!window.rhythmAuth?.isInitialized) {
                console.error('Auth system not initialized');
                window.location.href = '../login.html';
                return;
            }

            const authResult = await window.rhythmAuth.checkAuthentication();
            
            if (!authResult.isAuthenticated) {
                console.log('User not authenticated, redirecting to login');
                window.location.href = '../login.html';
                return;
            }

            currentUser = authResult.user;
            console.log('User authenticated:', currentUser.fullName);
            loadKits();
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        // Load available kits and user's current selection
        async function loadKits() {
            try {
                // Load available kit types from Firebase
                const kitsSnapshot = await db.ref('kits/inventory').once('value');
                const kitsData = kitsSnapshot.val();
                
                if (kitsData) {
                    availableKits = Object.entries(kitsData).map(([id, kit]) => ({
                        id,
                        name: kit.name,
                        description: kit.description || '',
                        imageUrl: kit.imageUrl || ''
                    }));
                } else {
                    // No kits available yet
                    availableKits = [];
                }

                // Load user's current kit selection
                // Use RB prefix for member ID (e.g., RB1023)
                const userId = currentUser.accessCode || currentUser.uid;
                const memberId = userId.toString().startsWith('RB') ? userId : `RB${userId}`;
                const userKitsSnapshot = await db.ref(`members/${memberId}/kits`).once('value');
                const userKits = userKitsSnapshot.val();
                
                if (userKits) {
                    selectedKits = new Set(Object.values(userKits));
                }

                // Load user's t-shirt size
                const sizeSnapshot = await db.ref(`members/${memberId}/tshirtSize`).once('value');
                const tshirtSize = sizeSnapshot.val();
                if (tshirtSize) {
                    currentTshirtSize = tshirtSize;
                    document.getElementById('tshirtSize').value = tshirtSize;
                }

                renderKits();
                
            } catch (error) {
                console.error('Error loading kits:', error);
                document.getElementById('loadingMessage').textContent = 'Error loading kits. Please refresh.';
            }
        }

        // Optimize Cloudinary image URLs for faster loading
        function optimizeCloudinaryUrl(url) {
            if (!url || !url.includes('cloudinary.com')) {
                return url;
            }
            // Add Cloudinary transformations for optimized loading
            // w_180 = width 180px, q_auto = auto quality, f_auto = auto format (WebP if supported)
            const parts = url.split('/upload/');
            if (parts.length === 2) {
                return `${parts[0]}/upload/w_180,h_180,c_fill,q_auto:good,f_auto/${parts[1]}`;
            }
            return url;
        }

        // Render kit cards
        function renderKits() {
            const grid = document.getElementById('kitsGrid');
            const loading = document.getElementById('loadingMessage');
            const saveSection = document.getElementById('saveSection');
            const tshirtSection = document.getElementById('tshirtSection');

            loading.style.display = 'none';
            grid.style.display = 'grid';
            saveSection.style.display = 'block';
            tshirtSection.style.display = 'block';

            grid.innerHTML = '';

            if (availableKits.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                        <p style="font-size: 1.5rem; color: #aaa; margin-bottom: 10px;">📦</p>
                        <p style="color: #aaa; font-size: 1.1rem;">No kits available yet</p>
                        <p style="color: #666; font-size: 0.9rem;">Contact an admin to add kits to the inventory</p>
                    </div>
                `;
                saveSection.style.display = 'none';
                return;
            }

            availableKits.forEach(kit => {
                const card = document.createElement('div');
                card.className = 'kit-card';
                if (selectedKits.has(kit.id)) {
                    card.classList.add('selected');
                }

                const iconHTML = kit.imageUrl 
                    ? `<div class="loading-spinner"></div><img src="${optimizeCloudinaryUrl(kit.imageUrl)}" alt="${kit.name}" loading="lazy" data-kit-id="${kit.id}">`
                    : `<span class="kit-icon-emoji">📦</span>`;

                card.innerHTML = `
                    <div class="kit-icon">${iconHTML}</div>
                    <div class="kit-content">
                        <div class="kit-name">${kit.name}</div>
                        <div class="kit-description">${kit.description}</div>
                    </div>
                `;

                // Handle image loading
                const img = card.querySelector('img');
                if (img) {
                    img.addEventListener('load', () => {
                        img.classList.add('loaded');
                        const spinner = card.querySelector('.loading-spinner');
                        if (spinner) spinner.remove();
                    });
                    img.addEventListener('error', () => {
                        const spinner = card.querySelector('.loading-spinner');
                        if (spinner) spinner.remove();
                        img.style.display = 'none';
                        card.querySelector('.kit-icon').innerHTML = '<span class="kit-icon-emoji">📦</span>';
                    });
                }

                card.addEventListener('click', () => {
                    if (selectedKits.has(kit.id)) {
                        selectedKits.delete(kit.id);
                        card.classList.remove('selected');
                    } else {
                        selectedKits.add(kit.id);
                        card.classList.add('selected');
                    }
                });

                grid.appendChild(card);
            });
        }

        // Save kit selection
        document.getElementById('saveButton').addEventListener('click', async () => {
            const saveButton = document.getElementById('saveButton');
            const successMessage = document.getElementById('successMessage');

            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';

            try {
                // Use RB prefix for member ID (e.g., RB1023)
                const userId = currentUser.accessCode || currentUser.uid;
                const memberId = userId.toString().startsWith('RB') ? userId : `RB${userId}`;
                
                // Save t-shirt size
                const tshirtSize = document.getElementById('tshirtSize').value;
                if (tshirtSize) {
                    await db.ref(`members/${memberId}/tshirtSize`).set(tshirtSize);
                }
                
                // Clear existing kits
                await db.ref(`members/${memberId}/kits`).remove();

                // Save selected kits
                if (selectedKits.size > 0) {
                    const kitsObject = {};
                    selectedKits.forEach(kitId => {
                        kitsObject[kitId] = kitId;
                    });
                    await db.ref(`members/${memberId}/kits`).set(kitsObject);
                }

                // Show success message
                successMessage.classList.add('show');
                saveButton.textContent = 'Saved!';

                setTimeout(() => {
                    successMessage.classList.remove('show');
                    saveButton.disabled = false;
                    saveButton.textContent = 'Save My Kits';
                }, 3000);

            } catch (error) {
                console.error('Error saving kits:', error);
                alert('Error saving kits. Please try again.');
                saveButton.disabled = false;
                saveButton.textContent = 'Save My Kits';
            }
        });
    </script>
</body>
</html>
